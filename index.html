<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATCO Trainer v2 // LPS SR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* Light theme — white background, readable green accent, high-contrast buttons */
    --bg: #f4f7f5; --panel: #ffffff; --panel-2: #eef3f0;
    --border: #cdddd4; --border-bright: #9fb8aa;
    /* readable emerald for text/accents on white */
    --green: #07804b; --green-strong: #0a9d5c; --green-dim: #4a9a72; --green-bg: #e3f6ec;
    --amber: #b06a00; --amber-bg: #fdf2dd;
    --red: #c62f2f; --red-bg: #fdeaea;
    --text: #16221c; --text-dim: #4f6359;
    --text-faint: #87998f;
    --shadow: 0 1px 2px rgba(16,40,28,0.06), 0 2px 8px rgba(16,40,28,0.06);
    --shadow-btn: 0 1px 0 rgba(16,40,28,0.08), 0 2px 6px rgba(10,157,92,0.18);
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --display: 'Space Grotesk', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); font-family: var(--mono); font-size: 14px; min-height: 100vh; overflow-x: hidden; }
  /* subtle light grid texture instead of dark scanlines */
  body::before { content:''; position:fixed; inset:0; pointer-events:none; z-index:1;
    background: radial-gradient(ellipse at top, #c9f0db40 0%, transparent 55%),
                linear-gradient(#0a9d5c08 1px, transparent 1px),
                linear-gradient(90deg, #0a9d5c08 1px, transparent 1px);
    background-size: 100% 100%, 28px 28px, 28px 28px; }
  .app { position:relative; z-index:3; max-width:1040px; margin:0 auto; padding:24px 20px 80px; }

  header { display:flex; align-items:center; justify-content:space-between; border:1px solid var(--border); background:var(--panel); padding:14px 18px; margin-bottom:20px; position:relative; border-radius:8px; box-shadow:var(--shadow); }
  header::before { content:''; position:absolute; top:-1px; left:-1px; width:12px; height:12px; border-top:3px solid var(--green-strong); border-left:3px solid var(--green-strong); border-radius:4px 0 0 0; }
  header::after { content:''; position:absolute; bottom:-1px; right:-1px; width:12px; height:12px; border-bottom:3px solid var(--green-strong); border-right:3px solid var(--green-strong); border-radius:0 0 4px 0; }
  .brand { display:flex; align-items:baseline; gap:12px; }
  .brand-mark { color:var(--green); font-weight:800; letter-spacing:0.18em; font-size:13px; }
  .brand-sub { color:var(--text-faint); font-size:11px; letter-spacing:0.2em; }
  .clock { color:var(--green-dim); font-size:12px; letter-spacing:0.15em; font-weight:500; }

  /* TABS — clearly card-like, active tab is a solid filled button */
  .tabs { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:20px; }
  .tab { background:var(--panel); border:1.5px solid var(--border); color:var(--text-dim); padding:14px 14px; cursor:pointer; text-align:left; font-family:var(--mono); font-size:12px; letter-spacing:0.12em; transition:all 0.15s; border-radius:8px; box-shadow:var(--shadow); }
  .tab:hover { border-color:var(--green-strong); color:var(--text); transform:translateY(-1px); box-shadow:0 3px 10px rgba(10,157,92,0.16); }
  .tab.active { background:var(--green-strong); border-color:var(--green-strong); color:#ffffff; box-shadow:0 3px 12px rgba(10,157,92,0.32); }
  .tab .tab-num { display:block; font-size:10px; color:var(--text-faint); margin-bottom:4px; }
  .tab.active .tab-num { color:#d6f5e6; }
  .tab .tab-label { font-weight:700; }

  .panel { background:var(--panel); border:1px solid var(--border); border-radius:8px; box-shadow:var(--shadow); overflow:hidden; }
  .panel-head { display:flex; justify-content:space-between; align-items:center; padding:12px 18px; border-bottom:1px solid var(--border); background:var(--panel-2); font-size:11px; letter-spacing:0.18em; color:var(--text-dim); }
  .stats { display:flex; gap:18px; }
  .stat { display:flex; gap:6px; align-items:baseline; }
  .stat-label { color:var(--text-faint); font-size:10px; }
  .stat-val { color:var(--green); font-weight:700; }
  .stat-val.amber { color:var(--amber); }
  .stat-val.red { color:var(--red); }

  .qcard { padding:28px; min-height:340px; }
  .qmeta { font-size:10px; letter-spacing:0.25em; color:var(--text-faint); margin-bottom:18px; }
  .qmeta .sep { margin:0 10px; }
  .aircraft-display { display:grid; grid-template-columns:380px 1fr; gap:24px; align-items:stretch; margin-bottom:18px; }
  .aircraft-photo { background:var(--panel-2); border:1px solid var(--border); position:relative; aspect-ratio:16/10; overflow:hidden; border-radius:6px; }
  .aircraft-photo img { width:100%; height:100%; object-fit:cover; }
  .aircraft-photo::after { content:''; position:absolute; inset:0; pointer-events:none;
    background: linear-gradient(180deg, transparent 80%, #00000055 100%); }
  .photo-corner { position:absolute; bottom:8px; left:10px; right:10px; z-index:2; color:#ffffff; font-size:9px; letter-spacing:0.15em; display:flex; justify-content:space-between; text-shadow:0 1px 3px rgba(0,0,0,0.7); }
  .photo-loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--green-dim); font-size:11px; letter-spacing:0.2em; animation:pulse-loading 1.4s infinite; }
  .aircraft-info-side { display:flex; flex-direction:column; gap:10px; }
  .ac-target { font-family:var(--display); font-size:18px; color:var(--text); font-weight:700; border-bottom:1px solid var(--border); padding-bottom:10px; margin-bottom:4px; }
  .ac-target small { display:block; font-family:var(--mono); font-size:10px; color:var(--text-faint); letter-spacing:0.15em; font-weight:400; margin-bottom:4px; }
  .ac-row { display:flex; gap:8px; flex-wrap:wrap; font-size:11px; }
  .ac-chip { background:var(--panel-2); border:1px solid var(--border); padding:6px 10px; letter-spacing:0.08em; color:var(--text-dim); border-radius:5px; }
  .ac-chip strong { color:var(--green); margin-right:6px; font-weight:700; }

  .hint-row { margin:14px 0 6px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:10px 14px; background:var(--amber-bg); border-left:4px solid var(--amber); min-height:48px; border-radius:0 6px 6px 0; }
  .hint-row.empty { background:var(--panel-2); border-color:var(--border); }
  .hint-label { color:var(--amber); font-size:10px; letter-spacing:0.18em; font-weight:700; }
  .hint-row.empty .hint-label { color:var(--text-faint); }
  .hint-text { color:var(--text); font-size:12px; flex:1; }
  .hint-row.empty .hint-text { color:var(--text-faint); font-style:italic; }

  /* HINT button — clearly an amber filled action */
  .btn-hint { background:var(--amber); border:1.5px solid var(--amber); color:#ffffff; padding:7px 16px; font-family:var(--mono); font-size:11px; letter-spacing:0.15em; cursor:pointer; font-weight:700; border-radius:6px; box-shadow:0 2px 6px rgba(176,106,0,0.25); transition:all 0.12s; }
  .btn-hint:hover { background:#9a5d00; transform:translateY(-1px); }
  .btn-hint:disabled { opacity:1; cursor:not-allowed; background:var(--panel-2); border-color:var(--border); color:var(--text-faint); box-shadow:none; transform:none; }

  .big-prompt { font-family:var(--display); font-size:64px; font-weight:700; color:var(--green); letter-spacing:0.04em; text-align:center; margin:32px 0 14px; line-height:1; }
  .big-prompt.small { font-size:38px; }
  .prompt-hint { text-align:center; color:var(--text-faint); font-size:11px; letter-spacing:0.2em; margin-bottom:14px; }

  /* INPUT — white field, dark green text, clear border */
  .input-row { display:flex; gap:10px; margin-top:18px; }
  .input-row input { flex:1; background:#ffffff; border:2px solid var(--border-bright); color:var(--green); padding:16px 18px; font-family:var(--mono); font-size:18px; letter-spacing:0.08em; outline:none; text-transform:uppercase; border-radius:8px; font-weight:700; transition:border-color 0.12s, box-shadow 0.12s; }
  .input-row input:focus { border-color:var(--green-strong); box-shadow:0 0 0 3px rgba(10,157,92,0.18); }
  .input-row input::placeholder { color:var(--text-faint); text-transform:none; letter-spacing:0.1em; font-weight:400; }

  /* PRIMARY button — solid green, white text, obviously clickable */
  .btn { background:var(--green-strong); border:1.5px solid var(--green-strong); color:#ffffff; padding:0 24px; font-family:var(--mono); font-size:12px; letter-spacing:0.18em; font-weight:700; cursor:pointer; transition:all 0.12s; border-radius:8px; box-shadow:var(--shadow-btn); }
  .btn:hover { background:var(--green); border-color:var(--green); transform:translateY(-1px); box-shadow:0 4px 12px rgba(10,157,92,0.3); }
  .btn:active { transform:translateY(0); }
  /* SECONDARY (ghost) button — white with strong border, clearly a button */
  .btn.ghost { background:#ffffff; border:1.5px solid var(--border-bright); color:var(--text-dim); box-shadow:var(--shadow); }
  .btn.ghost:hover { background:var(--panel-2); border-color:var(--green-strong); color:var(--green); transform:translateY(-1px); }

  .feedback { margin-top:16px; padding:0; display:none; }
  .feedback.show { display:block; }
  .feedback-banner { padding:12px 16px; border-left:4px solid; font-size:13px; display:flex; align-items:center; justify-content:space-between; gap:16px; border-radius:0 6px 6px 0; font-weight:600; }
  .feedback.ok .feedback-banner { background:var(--green-bg); border-color:var(--green-strong); color:var(--green); }
  .feedback.no .feedback-banner { background:var(--red-bg); border-color:var(--red); color:var(--red); }
  .feedback .answer { font-family:var(--display); font-size:16px; font-weight:700; }

  .reveal { background:var(--panel-2); border:1px solid var(--border); border-top:none; padding:18px 20px; border-radius:0 0 8px 8px; }
  .reveal-title { font-family:var(--display); font-size:22px; color:var(--green); font-weight:700; margin-bottom:4px; letter-spacing:0.01em; }
  .reveal-sub { font-size:11px; letter-spacing:0.15em; color:var(--text-faint); margin-bottom:14px; }
  .reveal-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:8px 14px; font-size:12px; }
  .reveal-grid .item { display:flex; flex-direction:column; gap:2px; padding:7px 0; border-bottom:1px dashed var(--border); }
  .reveal-grid .item-label { font-size:9px; letter-spacing:0.18em; color:var(--text-faint); }
  .reveal-grid .item-val { color:var(--text); }
  .reveal-grid .item-val strong { color:var(--green); font-weight:700; }
  .reveal-ops { margin-top:14px; padding-top:12px; border-top:1px solid var(--border); font-size:11px; color:var(--text-dim); line-height:1.6; }
  .reveal-ops strong { color:var(--amber); display:block; font-size:9px; letter-spacing:0.2em; margin-bottom:4px; }

  .controls { display:flex; gap:8px; padding:12px 18px; border-top:1px solid var(--border); background:var(--panel-2); justify-content:space-between; align-items:center; flex-wrap:wrap; }
  .controls-left { display:flex; gap:8px; flex-wrap:wrap; }
  .controls-right { display:flex; gap:8px; }

  /* FILTER chips — clearly toggle buttons; active = filled green */
  .filter-chip { background:#ffffff; border:1.5px solid var(--border-bright); color:var(--text-dim); padding:7px 12px; font-family:var(--mono); font-size:10px; letter-spacing:0.12em; cursor:pointer; white-space:nowrap; border-radius:20px; font-weight:600; transition:all 0.12s; }
  .filter-chip.on { border-color:var(--green-strong); color:#ffffff; background:var(--green-strong); box-shadow:0 2px 6px rgba(10,157,92,0.22); }
  .filter-chip:hover { border-color:var(--green-strong); color:var(--green); }
  .filter-chip.on:hover { color:#ffffff; }

  .weak-section { margin-top:20px; background:var(--panel); border:1px solid var(--border); padding:14px 18px; border-radius:8px; box-shadow:var(--shadow); }
  .weak-title { font-size:11px; letter-spacing:0.2em; color:var(--amber); margin-bottom:10px; display:flex; gap:10px; align-items:center; font-weight:700; }
  .weak-title::before { content:'!'; display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; border-radius:50%; background:var(--amber); color:#ffffff; font-weight:700; }
  .weak-list { display:flex; flex-wrap:wrap; gap:6px; }
  .weak-item { font-size:11px; padding:5px 9px; background:var(--amber-bg); border:1px solid var(--amber); color:var(--amber); letter-spacing:0.05em; border-radius:5px; font-weight:600; }
  .weak-empty { color:var(--text-faint); font-size:11px; }

  .session-done { padding:40px 28px; text-align:center; }
  .session-done h2 { font-family:var(--display); font-size:28px; color:var(--green); margin-bottom:8px; letter-spacing:0.02em; }
  .session-done p { color:var(--text-dim); margin-bottom:24px; }
  .score-big { font-size:72px; color:var(--green); font-weight:800; font-family:var(--mono); }

  /* ===== MAP / WAYPOINT MODE ===== */
  .map-prompt { text-align:center; margin-bottom:8px; }
  .map-prompt .mp-label { font-size:11px; letter-spacing:0.2em; color:var(--text-faint); display:block; margin-bottom:6px; }
  .map-prompt .mp-name { font-family:var(--display); font-size:46px; font-weight:800; color:var(--green); letter-spacing:0.06em; line-height:1; }
  .map-prompt .mp-sub { font-size:11px; letter-spacing:0.12em; color:var(--text-dim); margin-top:8px; }
  .map-prompt .mp-sub .tg { display:inline-block; background:var(--green-bg); border:1px solid var(--green-strong); color:var(--green); padding:2px 8px; border-radius:4px; margin:0 3px; font-weight:700; }
  .map-wrap { position:relative; width:100%; background:#fbfdfc; border:1px solid var(--border); border-radius:8px; overflow:hidden; margin-top:6px; box-shadow:inset 0 0 0 1px #ffffff; }
  .map-wrap svg { width:100%; height:auto; display:block; touch-action:manipulation; }
  /* dot states */
  .wp-dot { cursor:pointer; transition:r 0.1s, fill 0.1s; }
  .wp-hit { cursor:pointer; }
  .wp-dot.cand { fill:#ffffff; stroke:var(--green-strong); stroke-width:2; }
  .wp-dot.cand:hover { fill:var(--green-bg); }
  .wp-dot.nav.cand { fill:#fff4e0; stroke:var(--amber); }
  .wp-dot.correct { fill:var(--green-strong); stroke:var(--green-strong); }
  .wp-dot.wrong { fill:var(--red); stroke:var(--red); }
  .wp-dot.reveal-correct { fill:var(--green-strong); stroke:#063; stroke-width:2.5; }
  .wp-dot.other { fill:#1a1a1a; stroke:#1a1a1a; stroke-width:1; }
  .wp-anchor { fill:var(--text-dim); }
  .wp-anchor-label { fill:var(--text-dim); font-family:var(--mono); font-size:9px; font-weight:700; letter-spacing:0.1em; }
  .wp-city { fill:var(--amber); }
  .wp-label-reveal { fill:var(--green); font-family:var(--mono); font-size:8.5px; font-weight:800; pointer-events:none; }
  .wp-label-other { fill:#1a1a1a; font-family:var(--mono); font-size:9px; font-weight:700; pointer-events:none; letter-spacing:0.03em; paint-order:stroke; stroke:#fbfdfc; stroke-width:2.5px; stroke-linejoin:round; }
  .sec-line { fill:none; stroke:#6b7d74; stroke-width:1.2; stroke-dasharray:6 4; opacity:0.7; }
  .sec-label { fill:#5b6d64; font-family:var(--mono); font-size:11px; font-weight:800; letter-spacing:0.25em; opacity:0.55; pointer-events:none; }
  .map-legend { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-top:10px; font-size:10px; color:var(--text-dim); letter-spacing:0.05em; }
  .map-legend span { display:inline-flex; align-items:center; gap:5px; }
  .lg-pt::before { content:''; width:11px; height:11px; border-radius:50%; background:#fff; border:2px solid var(--green-strong); display:inline-block; }
  .lg-nav::before { content:''; width:11px; height:11px; border-radius:50%; background:#fff4e0; border:2px solid var(--amber); display:inline-block; }
  .lg-city::before { content:'◆'; color:var(--amber); font-size:12px; }
  .lg-fir::before { content:''; width:14px; height:0; border-top:2px dashed var(--border-bright); display:inline-block; }
  .lg-sec::before { content:''; width:14px; height:0; border-top:1.5px dashed #6b7d74; display:inline-block; }
  .lg-other::before { content:''; width:9px; height:9px; border-radius:50%; background:#1a1a1a; display:inline-block; }
  .map-difficulty { font-size:10px; letter-spacing:0.12em; color:var(--text-faint); text-align:center; margin-top:4px; }

  /* ===== STUDY / EXPLORE MODE ===== */
  .wp-dot.s-W { fill:#0a9d5c; stroke:#06633a; stroke-width:1.2; }
  .wp-dot.s-C { fill:#e08a1e; stroke:#8a5300; stroke-width:1.2; }
  .wp-dot.s-E { fill:#3b82c4; stroke:#22557f; stroke-width:1.2; }
  .wp-dot.s-sel { stroke:#16221c; stroke-width:3.5; }
  .wp-label-study { fill:#16221c; font-family:var(--mono); font-size:8px; font-weight:700; pointer-events:none; letter-spacing:0.02em; paint-order:stroke; stroke:#fbfdfc; stroke-width:2.4px; stroke-linejoin:round; }
  .lg-sw::before { content:''; width:11px; height:11px; border-radius:50%; background:#0a9d5c; display:inline-block; }
  .lg-sc::before { content:''; width:11px; height:11px; border-radius:50%; background:#e08a1e; display:inline-block; }
  .lg-se::before { content:''; width:11px; height:11px; border-radius:50%; background:#3b82c4; display:inline-block; }
  .study-detail { margin-top:14px; background:var(--panel-2); border:1px solid var(--border); border-radius:8px; padding:16px 18px; min-height:96px; }
  .study-detail.empty { color:var(--text-faint); font-style:italic; display:flex; align-items:center; justify-content:center; text-align:center; letter-spacing:0.08em; }
  .study-tip { font-size:10px; letter-spacing:0.1em; color:var(--text-faint); text-align:center; margin-top:6px; }

  /* ===== POMENUJ BOD — obrátený kvíz (mapa svieti, meno sa píše) ===== */
  .wp-dot.ctx { fill:#ccd8d1; stroke:#8c9c94; stroke-width:1; cursor:default; }
  .wp-dot.tgt { fill:var(--amber); stroke:#7a4a00; stroke-width:2.5; cursor:default; }
  .wp-ring { fill:none; stroke:var(--amber); stroke-width:1.8; pointer-events:none; }
  .wp-cross { stroke:var(--amber); stroke-width:1.1; opacity:0.55; pointer-events:none; }
  .wp-label-ctx { fill:#5d6d65; font-family:var(--mono); font-size:8px; font-weight:700; pointer-events:none; letter-spacing:0.02em; paint-order:stroke; stroke:#fbfdfc; stroke-width:2.4px; stroke-linejoin:round; }
  .wp-label-wrong { fill:var(--red); font-family:var(--mono); font-size:9px; font-weight:800; pointer-events:none; paint-order:stroke; stroke:#fbfdfc; stroke-width:2.5px; stroke-linejoin:round; }
  .lg-lit::before { content:''; width:11px; height:11px; border-radius:50%; background:var(--amber); border:2px solid #7a4a00; display:inline-block; }
  .lg-ctx::before { content:''; width:9px; height:9px; border-radius:50%; background:#ccd8d1; border:1px solid #8c9c94; display:inline-block; }

  /* ===== SLEPÁ MAPA ===== */
  .blind-dot { fill:#fff; stroke:var(--text-faint); stroke-width:1.6; }
  .blind-dot.ok { fill:#0a9d5c; stroke:#0a9d5c; }
  .blind-dot.no { fill:#fff; stroke:#c2603a; stroke-width:2.2; }
  .blind-num { font:700 11px ui-monospace,monospace; fill:var(--text); text-anchor:middle; }
  .blind-ans { font:600 9.5px ui-monospace,monospace; fill:#c2603a; text-anchor:middle; }
  .blind-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:6px; margin-top:12px; }
  .blind-cell { display:flex; align-items:center; gap:6px; }
  .blind-n { font:700 10.5px ui-monospace,monospace; color:var(--text-faint); min-width:20px; text-align:right; }
  .blind-in { flex:1; min-width:0; font-family:var(--mono); font-size:12px; text-transform:uppercase; padding:6px 8px; border:1px solid var(--border); border-radius:6px; background:#fff; }
  .blind-in:focus { outline:none; border-color:var(--green-strong); }
  .blind-in.ok { border-color:#0a9d5c; background:#eefaf3; }
  /* doplnené alebo opravené systémom — červeným, aby bolo jasné, že to nie je tvoja odpoveď */
  .blind-in.fixed { border-color:#c2603a; background:#fdf1ec; color:#c2603a; font-weight:700; }
  .blind-was { font:600 10px ui-monospace,monospace; color:var(--text-faint); text-decoration:line-through; white-space:nowrap; }
  .blind-actions { display:flex; gap:8px; margin-top:12px; }
  .blind-actions .btn { padding:12px 24px; }

  /* ===== MOD 02 — mapa letísk a oblasti ICAO ===== */
  .ap-label { font-family:var(--mono); font-size:11px; font-weight:800; pointer-events:none; paint-order:stroke; stroke:#fbfdfc; stroke-width:3px; stroke-linejoin:round; }
  .ap-label.ok { fill:var(--green); }
  .ap-label.no { fill:var(--red); }
  .ap-st { font-family:var(--mono); font-size:10px; font-weight:800; fill:#16221c; text-anchor:middle; cursor:pointer; paint-order:stroke; stroke:#ffffff; stroke-width:2.6px; stroke-linejoin:round; }
  .ap-st:hover, .ap-st.sel { fill:var(--red); font-size:12px; }
  .ap-struct { display:flex; gap:18px; align-items:center; margin-top:14px; padding:14px 18px; background:var(--panel-2); border:1px solid var(--border); border-radius:8px; flex-wrap:wrap; }
  .ap-struct-code { display:flex; gap:4px; }
  .ap-struct-code span { font-family:var(--display); font-size:30px; font-weight:700; color:#fff; background:var(--green-strong); width:40px; height:46px; display:flex; align-items:center; justify-content:center; border-radius:6px; }
  .ap-struct-code span:nth-child(2) { background:var(--amber); }
  .ap-struct-code span:nth-child(n+3) { background:var(--text-faint); }
  .ap-struct-txt { flex:1; min-width:240px; font-size:11.5px; line-height:1.7; color:var(--text-dim); }
  .ap-struct-txt strong { color:var(--text); }
  .ap-struct-ex { margin-top:4px; color:var(--text-faint); font-size:10.5px; }
  .ap-areas { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:10px 16px; margin:14px 0; }
  .ap-area { display:flex; gap:10px; align-items:flex-start; font-size:11px; line-height:1.5; color:var(--text-dim); }
  .ap-area strong { color:var(--text); }
  .ap-sw { flex:none; width:30px; height:30px; border-radius:6px; border:1px solid var(--border-bright); display:flex; align-items:center; justify-content:center; font-family:var(--display); font-weight:700; font-size:16px; color:#16221c; }

  /* ===== MOD 02 — rozšírenia ===== */
  .choice-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:18px; }
  .choice-btn { background:#ffffff; border:2px solid var(--border-bright); color:var(--text); padding:16px 14px; font-family:var(--mono); font-size:16px; font-weight:700; letter-spacing:0.06em; cursor:pointer; border-radius:8px; transition:all 0.12s; box-shadow:var(--shadow); }
  .choice-btn:hover:not(:disabled) { border-color:var(--green-strong); color:var(--green); transform:translateY(-1px); }
  .choice-btn:disabled { cursor:default; opacity:0.75; }
  .choice-btn.ok { background:var(--green-bg); border-color:var(--green-strong); color:var(--green); opacity:1; }
  .choice-btn.no { background:var(--red-bg); border-color:var(--red); color:var(--red); opacity:1; }
  .map-wrap.click svg { cursor:crosshair; }
  .ap-x { stroke:var(--red); stroke-width:2.2; fill:none; pointer-events:none; }
  .ap-miss { stroke:var(--text-faint); stroke-width:1.2; stroke-dasharray:4 3; pointer-events:none; }
  .ap-bks { display:flex; flex-direction:column; gap:6px; margin-top:8px; }
  .ap-bk { display:flex; gap:10px; align-items:center; font-size:11.5px; color:var(--text-dim); }
  .ap-bk strong { display:inline; color:var(--text); font-size:11.5px; letter-spacing:0; margin:0; }
  .ap-bk-c { flex:none; min-width:34px; padding:0 8px; height:30px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-family:var(--display); font-weight:700; font-size:17px; color:#fff; }
  .ap-bk-c.a { background:var(--green-strong); } .ap-bk-c.b { background:var(--amber); } .ap-bk-c.c { background:var(--text-faint); }
  .ap-retry { background:var(--amber-bg); border:1px solid var(--amber); color:var(--amber); padding:2px 7px; border-radius:4px; font-weight:700; letter-spacing:0.1em; margin-left:8px; }
  .ap-progress { font-size:10px; letter-spacing:0.15em; color:var(--green); font-weight:700; align-self:center; margin:0 8px; }
  .ap-note { flex-basis:100%; font-size:10.5px; color:var(--amber); letter-spacing:0.05em; }
  .filter-break { flex-basis:100%; height:0; }

  /* ===== MOD 03 — rozšírenia ===== */
  .cs-back { text-align:center; font-family:var(--display); font-size:34px; font-weight:700; color:var(--text-faint); border:2px dashed var(--border-bright); border-radius:10px; padding:22px 14px; margin:8px auto 0; max-width:640px; }
  .cs-back.open { color:var(--green); border-style:solid; border-color:var(--green-strong); background:var(--green-bg); }
  .cs-back small { display:block; font-family:var(--mono); font-size:11px; font-weight:400; letter-spacing:0.1em; color:var(--text-dim); margin-top:8px; }
  .cs-back small.hard { color:var(--amber); }
  .cs-back u, .cs-c u, .reveal u { text-decoration-color:var(--amber); text-decoration-thickness:2px; text-underline-offset:3px; }
  .cs-acts { display:flex; gap:10px; justify-content:center; margin-top:16px; flex-wrap:wrap; }
  .cs-acts .btn { padding:14px 22px; }
  .cs-key { font-size:9px; opacity:0.75; border:1px solid currentColor; border-radius:4px; padding:1px 5px; margin-left:8px; letter-spacing:0.08em; }
  .cs-list-bar { display:flex; gap:8px; flex-wrap:wrap; }
  .cs-list { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:6px; }
  .cs-cell { display:flex; gap:10px; align-items:baseline; padding:7px 10px; background:var(--panel-2); border:1px solid var(--border); border-left:4px solid var(--green-strong); border-radius:6px; font-size:12px; }
  .cs-cell.hard { border-left-color:var(--amber); }
  .cs-i { font-weight:800; color:var(--green); min-width:34px; }
  .cs-c { color:var(--text); }
  .cs-cell .hid { color:transparent; background:var(--border); border-radius:4px; cursor:pointer; user-select:none; }
  .cs-cell .hid u { text-decoration:none; }
  /* filtre majú teraz viac riadkov — SKIP/RESET nesmú spľasnúť, keď sa zalomia pod ne */
  .controls-right .btn { padding:9px 24px; }
  .cs-pack { font-family:var(--mono); font-size:10px; letter-spacing:0.08em; font-weight:600; color:var(--text-dim); background:#fff; border:1.5px solid var(--border-bright); border-radius:20px; padding:6px 10px; }

/* Projection bounds. Height is computed so longitude/latitude don't get
   stretched — uses cos(latMid) correction (equirectangular). */
const MAP_PROJ = (function(){
  const latMin=47.60, latMax=49.70, lonMin=16.75, lonMax=22.70, w=1000;
  const cosLat = Math.cos(((latMin+latMax)/2) * Math.PI/180);
  const h = w * ((latMax-latMin)/(lonMax-lonMin)) / cosLat;
  return { latMin, latMax, lonMin, lonMax, w, h };
})();
function projX(lon){ return ( (lon - MAP_PROJ.lonMin) / (MAP_PROJ.lonMax - MAP_PROJ.lonMin) ) * MAP_PROJ.w; }
function projY(lat){ return ( 1 - (lat - MAP_PROJ.latMin) / (MAP_PROJ.latMax - MAP_PROJ.latMin) ) * MAP_PROJ.h; }

/* Bratislava CTA sector boundaries (West / Central / East).
   Approximated from the official FRA chart — straight polylines north→south
   as [lat, lon]. Easy to nudge: tweak these to move dividers. */
const SECTOR_LINES = {
  // WEST | CENTRAL  (≈ lon 18.9, slight eastward tilt going south)
  wc: [[49.40, 18.90],[48.80, 18.93],[48.30, 18.98],[47.70, 19.03]],
  // CENTRAL | EAST  (≈ lon 20.0)
  ce: [[49.40, 20.00],[48.80, 20.00],[48.30, 20.04],[48.00, 20.08]],
};
function lonOnLine(line, lat){
  if (lat >= line[0][0]) return line[0][1];
  if (lat <= line[line.length-1][0]) return line[line.length-1][1];
  for (let i=0;i<line.length-1;i++){
    const [la1,lo1] = line[i], [la2,lo2] = line[i+1];
    if (lat <= la1 && lat >= la2){
      const t = (lat - la1) / (la2 - la1);
      return lo1 + t * (lo2 - lo1);
    }
  }
  return line[line.length-1][1];
}
function sectorOf(lat, lon){
  if (lon < lonOnLine(SECTOR_LINES.wc, lat)) return 'W';
  if (lon < lonOnLine(SECTOR_LINES.ce, lat)) return 'C';
  return 'E';
}
const SECTOR_NAMES = { W:'WEST', C:'CENTRAL', E:'EAST' };
const SECTOR_LONG  = { W:'Bratislava CTA — Sector WEST', C:'Bratislava CTA — Sector CENTRAL', E:'Bratislava CTA — Sector EAST' };
WAYPOINTS.forEach(w => { w.sec = sectorOf(w.lat, w.lon); });

/* ============================================================
   HELPERS - shuffle, normalize, levenshtein, matching
   ============================================================ */
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function normalize(s) {
  return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\w]/g, '').trim();
}
function lev(a, b) {
  if (a === b) return 0;
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  const dp = Array.from({length:m+1}, () => new Array(n+1).fill(0));
  for (let i=0;i<=m;i++) dp[i][0]=i;
  for (let j=0;j<=n;j++) dp[0][j]=j;
  for (let i=1;i<=m;i++) for (let j=1;j<=n;j++) {
    const cost = a[i-1]===b[j-1]?0:1;
    dp[i][j] = Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1]+cost);
  }
  return dp[m][n];
}
function matches(userInput, candidates) {
  const u = normalize(userInput);
  if (!u) return false;
  for (const c of candidates) {
    const n = normalize(c);
    if (!n) continue;
    if (u === n) return true;
    const tol = n.length >= 10 ? 2 : (n.length >= 5 ? 1 : 0);
    if (lev(u, n) <= tol) return true;
  }
  return false;
}

   ňu prepočítava kónickou projekciou nafitovanou na 22 bodov
   pobrežia (stredná chyba ~2 px z 866). Oblasti sa nefarbia ručne:
   po načítaní sa každý štát vyleje farbou zo „semienka" vnútri
   svojich hraníc, takže farba vždy presne sedí na čiary mapy.
   ============================================================ */
const EU_W = 866, EU_H = 704;
const EU_PROJ = { n:0.799165, lon0:14.846091, s:18.234493, G:95.760890, xc:372.4429, yc:-418.1905 };
function euXY(lat, lon) {
  const th = EU_PROJ.n * (lon - EU_PROJ.lon0) * Math.PI / 180;
  const rho = EU_PROJ.s * (EU_PROJ.G - lat);
  return [EU_PROJ.xc + rho * Math.sin(th), EU_PROJ.yc + rho * Math.cos(th)];
}
function euOnMap(lat, lon) {
  const [x, y] = euXY(lat, lon);
  return x > 10 && x < EU_W - 10 && y > 10 && y < EU_H - 10;
}

const EU = { plain:'', colored:'', ready:false, hit:{}, stateAt:null };
(function euPrepare() {
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas'); c.width = EU_W; c.height = EU_H;
    const g = c.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, EU_W, EU_H);
    g.drawImage(img, 0, 0);
    g.fillRect(228, 584, 38, 36);                    // vodoznak v Stredozemnom mori
    const im = g.getImageData(0, 0, EU_W, EU_H), d = im.data;
    const own = new Uint8Array(EU_W * EU_H);         // 0 voľné · 1 čiara · 2 vyplnené · 3 lem čiary
    for (let i = 0; i < own.length; i++) {
      const x = i % EU_W, y = (i / EU_W) | 0;
      /* okraj obrázka je tiež hrádza — čiary nedochádzajú presne po kraj
         a farba by popri ňom obtiekla z mora do pevniny */
      if (x < 2 || y < 2 || x > EU_W - 3 || y > EU_H - 3 || d[i*4] + d[i*4+1] + d[i*4+2] < 700) own[i] = 1;
    }
    /* Hranice majú miestami pixelové medzery. Čiara sa preto na čas
       vylievania rozšíri o 1 px (lem); po vyliatí sa lem dofarbí,
       takže farba aj tak siaha až po čiaru. */
    for (let y = 1; y < EU_H - 1; y++) for (let x = 1; x < EU_W - 1; x++) {
      const i = y * EU_W + x;
      if (own[i] !== 0) continue;
      if (own[i-1] === 1 || own[i+1] === 1 || own[i-EU_W] === 1 || own[i+EU_W] === 1 ||
          own[i-EU_W-1] === 1 || own[i-EU_W+1] === 1 || own[i+EU_W-1] === 1 || own[i+EU_W+1] === 1) own[i] = 3;
    }
    /* semienko môže padnúť presne na čiaru — vezmi najbližší voľný pixel */
    const freeNear = (x, y) => {
      for (let r = 0; r <= 4; r++) for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
        const X = x + dx, Y = y + dy;
        if (X >= 0 && Y >= 0 && X < EU_W && Y < EU_H && own[Y * EU_W + X] === 0) return Y * EU_W + X;
      }
      return -1;
    };
    EU.stateAt = new Uint8Array(EU_W * EU_H);         // ktorému štátu pixel patrí (index + 1)
    const flood = (lat, lon, rgb, tag) => {
      const [fx, fy] = euXY(lat, lon);
      const start = freeNear(Math.round(fx), Math.round(fy));
      if (start < 0) return 0;
      const stack = [start], done = []; own[start] = 2;
      const paint = i => { d[i*4] = rgb[0]; d[i*4+1] = rgb[1]; d[i*4+2] = rgb[2]; if (tag) EU.stateAt[i] = tag; };
      while (stack.length) {
        const i = stack.pop(); done.push(i); paint(i);
        const x = i % EU_W;
        if (x > 0 && own[i-1] === 0) { own[i-1] = 2; stack.push(i-1); }
        if (x < EU_W-1 && own[i+1] === 0) { own[i+1] = 2; stack.push(i+1); }
        if (i >= EU_W && own[i-EU_W] === 0) { own[i-EU_W] = 2; stack.push(i-EU_W); }
        if (i < own.length-EU_W && own[i+EU_W] === 0) { own[i+EU_W] = 2; stack.push(i+EU_W); }
      }
      /* dofarbi lem (bez ďalšieho šírenia) */
      done.forEach(i => [i-1, i+1, i-EU_W, i+EU_W].forEach(j => {
        if (j >= 0 && j < own.length && own[j] === 3) { own[j] = 2; paint(j); }
      }));
      return done.length;
    };
    EU_SEA_SEEDS.forEach(s => flood(s[0], s[1], [226, 238, 246]));
    g.putImageData(im, 0, 0);
    EU.plain = c.toDataURL('image/png');
    ICAO_STATES.forEach((st, k) => {
      const col = ICAO_AREAS[st.p.charAt(0)].color;
      EU.hit[st.p] = st.seeds.reduce((n, s) => n + flood(s[0], s[1], col, k + 1), 0);
    });
    g.putImageData(im, 0, 0);
    EU.colored = c.toDataURL('image/png');
    EU.ready = true;
    /* mapa, ktorá sa stihla vykresliť skôr, dostane obrázok dodatočne */
    document.querySelectorAll('image[data-eu]').forEach(el => el.setAttribute('href', EU[el.dataset.eu]));
    /* menovky štátov závisia od toho, čo sa na mape naozaj vylialo */
    if (state.mode === 'airport' && state.filters.apMode === 'study') renderQuestion();
  };
  img.src = EU_IMG_SRC;
})();

/* rozsvietený bod — rovnaký nitkový kríž a pulz ako v MOD 04 */
function litPoint(x, y) {
  const X = x.toFixed(1), Y = y.toFixed(1);
  return `<path class="wp-cross" d="M ${(x-32).toFixed(1)},${Y} h 17 M ${(x+15).toFixed(1)},${Y} h 17 M ${X},${(y-32).toFixed(1)} v 17 M ${X},${(y+15).toFixed(1)} v 17"></path>
    <circle class="wp-ring" cx="${X}" cy="${Y}" r="12"></circle>
    <circle class="wp-ring" cx="${X}" cy="${Y}" r="12">
      <animate attributeName="r" values="11;27" dur="2s" repeatCount="indefinite"></animate>
      <animate attributeName="opacity" values="0.9;0" dur="2s" repeatCount="indefinite"></animate>
    </circle>
    <circle id="tgt-dot" class="wp-dot tgt" cx="${X}" cy="${Y}" r="6"></circle>`;
}

};
function pxAll()      { return ICAO_STATES.concat(ICAO_STATES_EXTRA).filter(st => st.p.indexOf('*') < 0); }
function pxPool()     { return pxAll().filter(st => state.filters.apPx === 'all' || st.doc); }
function pxShort(st)  { return st.name.split(' (')[0]; }
function pxAsk(st)    { return st.ask || (st.p === 'ED' ? 'Nemecko — civilné letiská' : pxShort(st)); }

function buildPrefixQuestions() {
  const list = [];
  pxPool().forEach(st => {
    list.push({ type:'prefix', subtype:'code-to-state', id:'PX_C2S_' + st.p, data:st, accept:pxAccept(st) });
    list.push({ type:'prefix', subtype:'state-to-code', id:'PX_S2C_' + st.p, data:st, accept:[st.p] });
  });
  return list;
}

/* ---------- pokrok: uloženie, opakovanie chýb ---------- */
const AP_STORE = 'atcoTrainerV2.mod02';   // názov kľúča ostal, ukladá sa doň MOD 02 aj MOD 03
function apIsMod02(id) { return id.indexOf('AP_') === 0 || id.indexOf('PX_') === 0; }
function apIsMod03(id) { return id.indexOf('CS_') === 0; }
function apIsMine(id) { return apIsMod02(id) || apIsMod03(id); }
function apSaveProgress() {
  try {
    const m = {};
    Object.keys(state.mistakes).filter(apIsMine).forEach(k => { m[k] = state.mistakes[k]; });
    localStorage.setItem(AP_STORE, JSON.stringify({ mistakes: m, ok: state.apOk }));
  } catch (e) { /* súkromné okno alebo plné úložisko — trenažér beží ďalej bez ukladania */ }
}
function apLoadProgress() {
  try {
    const d = JSON.parse(localStorage.getItem(AP_STORE) || 'null');
    if (!d) return;
    Object.assign(state.mistakes, d.mistakes || {});
    state.apOk = d.ok || {};
  } catch (e) {}
}
function apClearProgress(mine) {
  Object.keys(state.mistakes).filter(mine).forEach(k => { delete state.mistakes[k]; });
  Object.keys(state.apOk).filter(mine).forEach(k => { delete state.apOk[k]; });
  apSaveProgress();
  renderWeak();
}
/* zvládnuté = dvakrát po sebe správne */
function apProgressText() {
  const ids = state.apAllIds || [];
  return `ZVLÁDNUTÉ ${ids.filter(id => (state.apOk[id] || 0) >= 2).length} / ${ids.length}`;
}
function apRenderProgress() {
  const el = document.getElementById('ap-progress');
  if (el) el.textContent = apProgressText();
}
function apRetryBadge(q) {
  if (!q || !q.retry) return;
  const m = document.querySelector('#qcard .qmeta');
  if (m) m.insertAdjacentHTML('beforeend', ' <span class="ap-retry">↻ OPAKOVANIE CHYBY</span>');
}

/* Spoločný krok po každej odpovedi v MOD 02 a MOD 03.
   Chyba sa vráti až neskôr v tom istom cvičení — hneď po sebe by si
   odpoveď len opísal z pamäti. */
function apAfterAnswer(q, ok) {
  if (ok) {
    state.apOk[q.id] = (state.apOk[q.id] || 0) + 1;
    if (state.mistakes[q.id] > 0) {
      state.mistakes[q.id]--;
      if (!state.mistakes[q.id]) delete state.mistakes[q.id];
      renderWeak();
    }
  } else {
    state.apOk[q.id] = 0;
    const r = q.retry || 0;
    if (r < 2) {
      /* vráti sa až v druhej polovici toho, čo ešte zostáva (najmenej
         o 12 otázok), na náhodnom mieste; pri krátkom zvyšku na konci */
      const left = state.queue.length - state.index - 1;
      const from = state.index + 1 + Math.min(left, Math.max(12, Math.floor(left / 2)));
      const pos = from + Math.floor(Math.random() * (state.queue.length - from + 1));
      state.queue.splice(pos, 0, Object.assign({}, q, { retry: r + 1 }));
      state.total = state.queue.length;
      document.getElementById('qtotal').textContent = state.total;
    }
  }
  apSaveProgress();
  apRenderProgress();
  if (!q.click) apMapReveal(q, ok);
}

/* po odpovedi: pulz zhasne a bod dostane menovku */
function apMapMark(svg, x, y, w, text, ok) {
  const right = x > w - 150;
  const lbl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  lbl.setAttribute('class', 'ap-label ' + (ok ? 'ok' : 'no'));
  lbl.setAttribute('x', (x + (right ? -11 : 11)).toFixed(1));
  lbl.setAttribute('y', (y - 10).toFixed(1));
  lbl.setAttribute('text-anchor', right ? 'end' : 'start');
  lbl.textContent = text;
  svg.appendChild(lbl);
}
function apMapReveal(q, ok) {
  const svg = document.getElementById('map-svg');
  if (!svg || q.type !== 'airport') return;
  svg.querySelectorAll('.wp-ring').forEach(r => r.remove());
  const dot = svg.querySelector('#tgt-dot');
  if (dot) { dot.classList.remove('tgt'); dot.classList.add(ok ? 'reveal-correct' : 'wrong'); }
  const m = airportMapXY(q.data);

}

/* vyhodnotenie pre výber z možností a klik do mapy — to isté, čo
   robí submitAnswer() pri písaní, len odpoveď neprichádza z inputu */
function apFinish(q, ok, shown) {
  if (ok) {
    state.correct++; state.streak++;
    if (state.streak > state.bestStreak) state.bestStreak = state.streak;
  } else {
    state.wrong++; state.streak = 0;
    state.mistakes[q.id] = (state.mistakes[q.id] || 0) + 1;
  }
  renderStats(); renderWeak();
  const hb = document.getElementById('btn-hint'); if (hb) hb.disabled = true;
  apAfterAnswer(q, ok);

  const fb = document.getElementById('feedback');
  fb.className = 'feedback show ' + (ok ? 'ok' : 'no');
  fb.innerHTML = `
    <div class="feedback-banner">
      <span>${ok ? `✓ <strong>CORRECT</strong>${shown ? ' · ' + shown : ''}`
                 : `✗ <strong>WRONG</strong> · YOUR ANSWER: <span class="answer">${shown}</span>`}</span>
      <button class="btn" id="next-btn">NEXT ▶</button>
    </div>
    ${renderReveal(q)}
  `;
  setTimeout(() => {
    const nb = document.getElementById('next-btn');
    if (nb) { nb.focus(); nb.onclick = nextQuestion; }
    document.addEventListener('keydown', onEnterNext, { once: true });
  }, 50);
}

/* ---------- VÝBER Z MOŽNOSTÍ ---------- */
/* Nesprávne možnosti sú zámerne podobné: pri kóde letiská z toho istého
   štátu (LOWW / LOWS / LOWL), pri meste mestá tej istej krajiny. */
function choiceSet(q) {
  let correct, cands;
  if (q.type === 'callsign') {
    /* podobné = susedia v abecede: rovnaké prvé dve písmená kódu, potom rovnaké prvé */
    const cs = q.data, i2c = q.subtype === 'icao-to-call';
    const tier = c => c.icao.substring(0,2) === cs.icao.substring(0,2) ? 0 : c.icao.charAt(0) === cs.icao.charAt(0) ? 1 : 2;
    correct = i2c ? cs.call : cs.icao;
    cands = CALLSIGNS.filter(c => q.accept.indexOf(i2c ? c.call : c.icao) < 0 && c.call !== cs.call && c.icao !== cs.icao)
      .map(c => ({ v: i2c ? c.call : c.icao, t: tier(c) }));
  } else if (q.type === 'airport') {
    const ap = q.data, rest = AIRPORTS.filter(a => a.city !== ap.city);
    if (q.subtype === 'icao-to-city') {
      correct = ap.city;
      cands = rest.map(a => ({ v: a.city, t: a.country === ap.country ? 0 : a.cat === ap.cat ? 1 : 2 }));
    } else {
      correct = ap.icao;
      cands = rest.map(a => ({ v: a.icao, t: a.icao.substring(0,2) === ap.icao.substring(0,2) ? 0 : a.icao.charAt(0) === ap.icao.charAt(0) ? 1 : 2 }));
    }
  } else {
    const st = q.data, rest = pxPool().filter(s => s.p !== st.p && pxShort(s) !== pxShort(st));
    const tier = s => s.p.charAt(0) === st.p.charAt(0) ? 0 : 1;
    if (q.subtype === 'code-to-state') { correct = pxShort(st); cands = rest.map(s => ({ v: pxShort(s), t: tier(s) })); }
    else { correct = st.p; cands = rest.map(s => ({ v: s.p, t: tier(s) })); }
  }
  const seen = {}; seen[correct] = 1;
  const uniq = shuffle(cands).filter(c => !seen[c.v] && (seen[c.v] = 1)).sort((a, b) => a.t - b.t);
  return { correct, opts: shuffle([correct].concat(uniq.slice(0, 3).map(c => c.v))) };
}
function renderChoiceQuestion(q, card, body) {
  const set = choiceSet(q);
  card.innerHTML = `
    ${body}
    <div class="hint-row empty" id="hint-row">
      <span class="hint-label">HINT</span>
      <span class="hint-text">— press [?] for a hint —</span>
      <button class="btn-hint" id="btn-hint">? HINT</button>
    </div>
    <div class="choice-grid">${set.opts.map((o, i) => `<button class="choice-btn" data-i="${i}">${o}</button>`).join('')}</div>
    <div class="feedback" id="feedback"></div>
  `;
  apRetryBadge(q);
  document.getElementById('btn-hint').onclick = useHint;
  const btns = card.querySelectorAll('.choice-btn');
  btns.forEach(b => {
    b.onclick = () => {
      const picked = set.opts[+b.dataset.i], ok = picked === set.correct;
      btns.forEach(x => {
        x.disabled = true;
        if (set.opts[+x.dataset.i] === set.correct) x.classList.add('ok');
      });
      if (!ok) b.classList.add('no');
      apFinish(q, ok, ok ? '' : picked.toUpperCase());
    };
  });
}

/* ---------- KLIK DO MAPY ---------- */
const EU_KM_PX = 6.1;     // mapa Európy: 1 px ≈ 6,1 km
const SK_KM_PX = 0.44;    // mapa Slovenska: 1 px ≈ 0,44 km
const CLICK_KM = { eu: 100, sk: 15 };
function svgPoint(svg, e) {
  const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  return [p.x, p.y];
}
function skMapSVG(inner) {
  const P = MAP_PROJ;
  return `<svg viewBox="0 0 ${P.w} ${P.h.toFixed(0)}" xmlns="http://www.w3.org/2000/svg" id="map-svg">
    <rect x="0" y="0" width="${P.w}" height="${P.h.toFixed(0)}" fill="#fbfdfc"></rect>
    <path d="${mapBaseParts().firPath}" fill="#eef6f0" stroke="var(--border-bright)" stroke-width="1.5"></path>
    ${inner}
  </svg>`;
}
function svgAdd(svg, tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.keys(attrs).forEach(k => el.setAttribute(k, attrs[k]));
  svg.appendChild(el);
  return el;
}
function renderClickQuestion(q, card) {
  const sk = q.data.cat === 'sk';
  card.innerHTML = `
    <div class="qmeta">AIRPORT ID <span class="sep">·</span> KLIKNI NA MAPU</div>
    <div class="map-prompt">
      <span class="mp-label">KLIKNI, KDE LETISKO LEŽÍ</span>
      <div class="mp-name">${q.subtype === 'icao-to-city' ? q.data.icao : q.data.city}</div>
      <div class="mp-sub">uzná sa klik do ${sk ? CLICK_KM.sk : CLICK_KM.eu} km od letiska${q.subtype === 'city-to-icao' ? ' · ' + q.data.country : ''}</div>
    </div>
    <div class="map-wrap click">${sk ? skMapSVG('') : euMapSVG('plain', '')}</div>
    <div class="feedback" id="feedback"></div>
  `;
  apRetryBadge(q);
  const svg = document.getElementById('map-svg');
  svg.addEventListener('click', e => {
    if (svg.dataset.done) return;
    svg.dataset.done = '1';
    svg.parentElement.classList.remove('click');
    const xy = svgPoint(svg, e);
    apClickEval(q, xy[0], xy[1], svg, sk);
  });
}
function apClickEval(q, x, y, svg, sk) {
  const m = airportMapXY(q.data);
  const km = Math.hypot(x - m.x, y - m.y) * (sk ? SK_KM_PX : EU_KM_PX);
  const ok = km <= (sk ? CLICK_KM.sk : CLICK_KM.eu);
  svgAdd(svg, 'line', { x1: x, y1: y, x2: m.x, y2: m.y, class: 'ap-miss' });
  svgAdd(svg, 'path', { d: `M ${x-5},${y-5} L ${x+5},${y+5} M ${x-5},${y+5} L ${x+5},${y-5}`, class: 'ap-x' });
  svgAdd(svg, 'circle', { cx: m.x, cy: m.y, r: 6, class: 'wp-dot ' + (ok ? 'reveal-correct' : 'wrong') });
  apMapMark(svg, m.x, m.y, m.w, q.data.icao + ' · ' + q.data.city, ok);
  const dist = '≈ ' + Math.round(km) + ' km od letiska';
  apFinish(q, ok, ok ? dist : dist.toUpperCase());
}
/* ============================================================
   MOD 03 — ROZŠÍRENIA
   balíčky po 20 · kartičky · zoznam · výber z možností · smer ·
   delenie na „kód vo volačke" a „bez súvisu" · opakovanie chýb
   ------------------------------------------------------------
   Vyše tisíc volačiek sa naraz naučiť nedá. Preto sa dajú krájať
   na malé balíčky a oddeliť tie, kde kód vidno priamo vo volačke
   (RYR → RYANAIR), od tých, ktoré treba naozaj vedieť naspamäť
   (BAW → SPEEDBIRD).
   ============================================================ */
const CS_PACK = 20;
/* písmená kódu idú vo volačke v rovnakom poradí za sebou */
function csLogical(cs) {
  const f = cs.call.replace(/[^A-Z]/g, '');
  let i = 0;
  for (let k = 0; k < f.length && i < 3; k++) if (f.charAt(k) === cs.icao.charAt(i)) i++;
  return i === 3;
}
CALLSIGNS.forEach(cs => { cs.logical = csLogical(cs); });
function csHighlight(cs) {
  if (!cs.logical) return cs.call;
  let i = 0;
  return cs.call.split('').map(ch => (i < 3 && ch === cs.icao.charAt(i)) ? (i++, `<u>${ch}</u>`) : ch).join('');
}
/* výber podľa kategórie, písmena a typu — ešte pred krájaním na balíčky */
function csSelection() {
  const F = state.filters;
  let pool = CALLSIGNS;
  if (F.callsignCat !== 'all') pool = pool.filter(c => c.cat === F.callsignCat);
  if (F.csLetter !== 'all') pool = pool.filter(c => c.icao.charAt(0) === F.csLetter);
  if (F.csKind === 'logical') pool = pool.filter(c => c.logical);
  if (F.csKind === 'hard') pool = pool.filter(c => !c.logical);
  return pool;
}
function csPool() {
  const F = state.filters, sel = csSelection();
  if (F.csPack > Math.ceil(sel.length / CS_PACK)) F.csPack = 0;
  return F.csPack ? sel.slice((F.csPack - 1) * CS_PACK, F.csPack * CS_PACK) : sel;
}

function csCardRate(ok) {

}

/* ============================================================
   QUESTION BUILDERS
   ============================================================ */
function buildAircraftQuestions() {
  let pool = AIRCRAFT;
  if (state.filters.wake !== 'all') pool = pool.filter(a => a.wake === state.filters.wake);
  return shuffle(pool).map(a => ({ type: 'aircraft', id: 'AC_' + a.icao, data: a, accept: a.accept }));
}
function buildAirportQuestions() {
  const F = state.filters, m = F.apMode;
  let list = [];
  if (m === 'prefix') {
    list = buildPrefixQuestions();
  } else {
    let pool = AIRPORTS;
    if (F.airportCat !== 'all') pool = pool.filter(a => a.cat === F.airportCat);
    /* v režimoch s mapou len letiská, ktoré sa dajú na mape ukázať */
    if (m === 'map' || m === 'click') pool = pool.filter(airportOnMap);
    pool.forEach(ap => {
      if (m === 'click') {
        list.push({ type: 'airport', subtype: 'icao-to-city', click: true, id: 'AP_KI_' + ap.icao, data: ap, accept: [ap.icao] });
        list.push({ type: 'airport', subtype: 'city-to-icao', click: true, id: 'AP_KC_' + ap.icao, data: ap, accept: [ap.icao] });
        return;
      }
      list.push({ type: 'airport', subtype: 'icao-to-city', id: 'AP_I2C_' + ap.icao, data: ap,
        accept: [ap.city] });
      list.push({ type: 'airport', subtype: 'city-to-icao', id: 'AP_C2I_' + ap.icao, data: ap,
        accept: [ap.icao] });
    });
  }
  state.apAllIds = list.map(q => q.id);
  state.apNote = '';
  /* LEN SLABÉ MIESTA: otázky, ktoré máš zapísané ako chybu */
  if (F.apWeak) {
    const weak = list.filter(q => state.mistakes[q.id] > 0);
    if (weak.length) list = weak;
    else { F.apWeak = false; state.apNote = 'V tomto výbere nemáš žiadne slabé miesta — idú všetky otázky.'; }
  }
  return shuffle(list);
}
function buildCallsignQuestions() {
  const F = state.filters, pool = csPool();
  /* jedna otázka na kód a jedna na volačku — duplicity z dokumentu
     sa zlúčia a uzná sa ktorákoľvek platná odpoveď */
  let list = [];
  const seen = {};
  pool.forEach(cs => {
    if (F.csDir !== 'c2i' && !seen['I' + cs.icao]) {
      seen['I' + cs.icao] = 1;
      const g = CS_BY_ICAO[cs.icao];
      list.push({ type: 'callsign', subtype: 'icao-to-call', id: 'CS_I2C_' + cs.icao, data: cs, group: g,
        accept: g.map(c => c.call) });
    }
    if (F.csDir !== 'i2c' && !seen['C' + cs.call]) {
      seen['C' + cs.call] = 1;
      const g = CS_BY_CALL[cs.call];
      list.push({ type: 'callsign', subtype: 'call-to-icao', id: 'CS_C2I_' + cs.icao, data: cs, group: g,
        accept: g.map(c => c.icao) });
    }
  });
  state.apAllIds = list.map(q => q.id);
  state.csNote = '';
  if (F.csWeak) {
    const weak = list.filter(q => state.mistakes[q.id] > 0);
    if (weak.length) list = weak;
    else { F.csWeak = false; state.csNote = 'V tomto výbere nemáš žiadne slabé miesta — idú všetky otázky.'; }
  }
  return shuffle(list);
}
/* Volačiek je vyše tisíc a mnohé sa líšia jediným písmenom
   (BEXJET / BEEJET). Tolerancia preklepov preto nesmie uznať odpoveď,
   ktorá je presne INÁ volačka alebo iný kód z dokumentu. */
function callsignClash(val, q) {
  if (q.type !== 'callsign') return false;
  const u = normalize(val);
  if (q.accept.some(a => normalize(a) === u)) return false;
  const map = q.subtype === 'icao-to-call' ? CS_BY_CALL : CS_BY_ICAO;
  return Object.keys(map).some(k => normalize(k) === u);
}

/* ============================================================
   MOD 04 — HRANIČNÉ BODY A SLEPÁ MAPA
   ------------------------------------------------------------
   „Hraničný bod" sa počíta GEOMETRICKY a nie z poľa `type`:
   písmená E/X (Entry/Exit) sú v dátach vyplnené len pri 10 bodoch
   a len na severe a východe — západ a juh ich nemajú vôbec. Filter
   postavený na nich by dal krivý a neúplný výber. Vzdialenosť od
   obrysu FIR je úplná a overiteľná: 42 bodov leží do 2 NM od
   hranice a ďalej je zreteľná medzera.
   ============================================================ */

const WP_BORDER_NM = 2;

/* najkratšia vzdialenosť bodu od HRANY obrysu (nie od vrcholu) */
function wpDistToBoundary(p) {
  const O = FIR_OUTLINE;
  const k = Math.cos(p.lat * Math.PI / 180);
  let best = Infinity;
  for (let i = 0; i < O.length; i++) {
    const a = O[i], b = O[(i + 1) % O.length];
    const ax = (a[0] - p.lon) * 60 * k, ay = (a[1] - p.lat) * 60;
    const bx = (b[0] - p.lon) * 60 * k, by = (b[1] - p.lat) * 60;
    const dx = bx - ax, dy = by - ay, L = dx * dx + dy * dy;
    let t = L ? -((ax * dx + ay * dy) / L) : 0;
    t = Math.max(0, Math.min(1, t));
    best = Math.min(best, Math.hypot(ax + t * dx, ay + t * dy));
  }
  return best;
}

/* výsledok sa počíta raz a drží na bode — mapa sa prekresľuje často */
function wpIsBorder(w) {
  if (w._bd === undefined) w._bd = wpDistToBoundary(w);
  return w._bd <= WP_BORDER_NM;
}

/* Poloha bodu POZDĹŽ hranice, meraná ako prejdená dĺžka obrysu.
   Triedenie podľa azimutu od stredu tu nestačí: FIR je pretiahnutý
   a členitý, takže pri zálivoch dva susedné body dostanú veľmi
   odlišný uhol a číslovanie preskakuje (KEKED → KENIN a pod.). */
function wpArcPos(p) {
  const O = FIR_OUTLINE;
  const k = Math.cos(p.lat * Math.PI / 180);
  let cum = 0, best = Infinity, bestPos = 0;
  for (let i = 0; i < O.length; i++) {
    const a = O[i], b = O[(i + 1) % O.length];
    const ax = (a[0] - p.lon) * 60 * k, ay = (a[1] - p.lat) * 60;
    const bx = (b[0] - p.lon) * 60 * k, by = (b[1] - p.lat) * 60;
    const dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy;
    const segLen = Math.sqrt(L2);
    let t = L2 ? -((ax * dx + ay * dy) / L2) : 0;
    t = Math.max(0, Math.min(1, t));
    const d = Math.hypot(ax + t * dx, ay + t * dy);
    if (d < best) { best = d; bestPos = cum + t * segLen; }
    cum += segLen;
  }
  return { pos: bestPos, total: cum };
}

/* ============================================================
   SLEPÁ MAPA — všetky body naraz, ku každému políčko.
   Cieľom je prejsť hranicu ako celok, nie hádať bod po bode.
   ============================================================ */
function blindPool() {
  const pool = filterBySector(WAYPOINTS).slice();
  if (!pool.length) return pool;
  pool.forEach(w => { if (w._arc === undefined) w._arc = wpArcPos(w).pos; });
  pool.sort((a, b) => a._arc - b._arc);
  if (pool.length < 3) return pool;

  const total = wpArcPos(pool[0]).total;
  /* Medzery medzi susednými bodmi po obvode, vrátane tej cez koniec. */
  const gap = i => (i === pool.length - 1)
    ? (total - pool[i]._arc + pool[0]._arc)
    : (pool[i + 1]._arc - pool[i]._arc);
  let maxI = 0, maxG = 0, steps = [];
  for (let i = 0; i < pool.length; i++) { const g = gap(i); steps.push(g); if (g > maxG) { maxG = g; maxI = i; } }
  const median = steps.slice().sort((a, b) => a - b)[Math.floor(steps.length / 2)];

  /* Sektorový filter vyberá body, ktoré na hranici NIE SÚ súvislé
     (EAST leží v dvoch úsekoch, CENTRAL v troch). Číslovanie preto
     začne za najväčšou medzerou — tá potom padne medzi posledné a prvé
     číslo namiesto doprostred radu. Pri súvislom výbere sa začína na
     severe. Prah 3,5× mediánu: pri 2,5× sa pravidlo zaplo aj pre celú
     FIR a číslovanie začínalo na juhovýchode. */
  let startIdx;
  if (maxG > median * 3.5) startIdx = (maxI + 1) % pool.length;
  else { startIdx = 0; for (let i = 1; i < pool.length; i++) if (pool[i].lat > pool[startIdx].lat) startIdx = i; }
  return pool.slice(startIdx).concat(pool.slice(0, startIdx));
}

function buildBlindSVG(points, answers, checked) {
  const P = MAP_PROJ;
  const { firPath, cities } = mapBaseParts();
  const placed = [];
  const collides = (lx, ly) => placed.some(p => Math.abs(p.x - lx) < 22 && Math.abs(p.y - ly) < 9);
  const out = [];
  points.forEach((c, i) => {
    const x = projX(c.lon), y = projY(c.lat);
    const n = i + 1;
    let cls = 'blind-dot';
    if (checked) cls += (answers[i] || '').trim().toUpperCase() === c.name ? ' ok' : ' no';
    out.push(`<circle class="${cls}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6"></circle>`);
    const tries = [[x+9,y-6],[x+9,y+12],[x-9,y-6],[x-9,y+12],[x,y-12],[x,y+17]];
    let ch = tries[0];
    for (const t of tries) { if (!collides(t[0], t[1])) { ch = t; break; } }
    placed.push({ x: ch[0], y: ch[1] });
    out.push(`<text class="blind-num" x="${ch[0].toFixed(1)}" y="${ch[1].toFixed(1)}">${n}</text>`);
    if (checked)
      out.push(`<text class="blind-ans" x="${ch[0].toFixed(1)}" y="${(ch[1]+10).toFixed(1)}">${c.name}</text>`);
  });
  return `<svg viewBox="0 0 ${P.w} ${P.h.toFixed(0)}" xmlns="http://www.w3.org/2000/svg" id="map-svg">
    <rect x="0" y="0" width="${P.w}" height="${P.h.toFixed(0)}" fill="#fbfdfc"></rect>
    <path d="${firPath}" fill="#eef6f0" stroke="var(--border-bright)" stroke-width="1.5"></path>
    ${cities}${out.join('')}
  </svg>`;
}

function blindCountLabel(filled, total) {
  return `vyplnené ${filled} z ${total} — vyhodnotiť môžeš kedykoľvek, zvyšok sa doplní`;
}

function renderWaypointBlind(card) {
  const pool = blindPool();
  const B = state.blind || (state.blind = { answers: [], checked: false });
  if (B.answers.length !== pool.length) { B.answers = pool.map(() => ''); B.checked = false; }
  document.getElementById('qnum').textContent = '•';
  document.getElementById('qtotal').textContent = pool.length + ' bodov';

  const filled = B.answers.filter(a => a.trim()).length;
  const score = B.checked
    ? pool.reduce((n, w, i) => n + ((B.answers[i] || '').trim().toUpperCase() === w.name ? 1 : 0), 0)
    : 0;

  const inputs = pool.map((w, i) => {
    const v = (B.answers[i] || '').trim();
    const ok = B.checked && v.toUpperCase() === w.name;
    /* Po vyhodnotení sa do políčka doplní SPRÁVNY názov — aj tam, kde
       ostalo prázdne, aj tam, kde bola chyba. Pôvodná odpoveď zostane
       vedľa prečiarknutá, inak by si videl len riešenie a nie svoju chybu. */
    const shown = B.checked ? (ok ? v : w.name) : v;
    const cls = B.checked ? (ok ? 'blind-in ok' : 'blind-in fixed') : 'blind-in';
    const was = (B.checked && !ok && v) ? `<span class="blind-was">${v.toUpperCase().replace(/</g,'&lt;')}</span>` : '';
    return `<div class="blind-cell">
      <span class="blind-n">${i + 1}</span>
      <input class="${cls}" data-bi="${i}" value="${shown.replace(/"/g,'&quot;')}"
             ${B.checked ? 'disabled' : ''} autocomplete="off" spellcheck="false" maxlength="10">
      ${was}
    </div>`;
  }).join('');

  card.innerHTML = `
    <div class="qmeta">FRA SIGNIFICANT POINTS <span class="sep">·</span> SLEPÁ MAPA — POMENUJ KAŽDÝ BOD</div>
    <div class="map-prompt"><span class="mp-label">${
      B.checked ? `${score} z ${pool.length} správne — zvyšok je nižšie doplnený červeným`
                : blindCountLabel(filled, pool.length)
    }</span></div>
    <div class="map-wrap">${buildBlindSVG(pool, B.answers, B.checked)}</div>
    <div class="blind-grid">${inputs}</div>
    <div class="blind-actions">
      <button class="btn" id="blind-check" ${B.checked || !pool.length ? 'disabled' : ''}>VYHODNOTIŤ</button>
      <button class="btn ghost" id="blind-reset">${B.checked ? 'SKÚSIŤ ZNOVA' : 'VYMAZAŤ'}</button>
    </div>`;

  card.querySelectorAll('[data-bi]').forEach(inp => {
    inp.oninput = () => { B.answers[+inp.dataset.bi] = inp.value; blindRefreshCount(pool.length); };
    inp.onkeydown = e => {
      if (e.key !== 'Enter') return;
      const next = card.querySelector(`[data-bi="${+inp.dataset.bi + 1}"]`);
      if (next) next.focus(); else { const c = document.getElementById('blind-check'); if (c) c.focus(); }
    };
  });
  const chk = document.getElementById('blind-check');
  if (chk) chk.onclick = () => { B.checked = true; renderQuestion(); };
  const rst = document.getElementById('blind-reset');
  if (rst) rst.onclick = () => { state.blind = { answers: pool.map(() => ''), checked: false }; renderQuestion(); };
}

/* Prepočet počítadla bez prekreslenia celej karty — inak by input
   pri každom písmene stratil kurzor. */
function blindRefreshCount(total) {
  const B = state.blind; if (!B) return;
  const filled = B.answers.filter(a => a.trim()).length;
  const lbl = document.querySelector('#qcard .mp-label');
  if (lbl) lbl.textContent = blindCountLabel(filled, total);
}

function filterBySector(pool) {
  /* Filter hraničných bodov je ZÁMERNE tu, a nie v jednotlivých
     režimoch — takto platí naraz pre všetky cvičenia MOD 04. */
  if (state.filters.wpBorder === 'border') pool = pool.filter(wpIsBorder);
  const g = state.filters.wpGrp;
  if (g === 'all' || !g) return pool;
  if (g === 'NAV') return pool.filter(w => w.kind === 'nav');
  // W / C / E sector codes
  return pool.filter(w => w.sec === g);
}
function buildWaypointQuestions() {
  const pool = filterBySector(WAYPOINTS);
  /* 'find' = meno je zadanie a hľadá sa bod, 'name' = bod je zadanie a píše sa meno */
  const sub = state.filters.wpMode === 'name' ? 'name' : 'find';
  return shuffle(pool).map(w => ({ type: 'waypoint', subtype: sub, id: 'WP_' + w.name, data: w, accept: [w.name] }));
}
function buildQueue() {
  switch(state.mode) {
    case 'aircraft': return buildAircraftQuestions();
    case 'airport':  return buildAirportQuestions();
    case 'callsign': return buildCallsignQuestions();
    case 'waypoint': return buildWaypointQuestions();
  }
}

/* Pick the candidate dots shown for a given target.
   EASY = target + 4 nearest neighbours (5 total).
   HARD = every point currently in the filtered pool. */
function waypointCandidates(target) {
  if (state.filters.wpDiff === 'hard') {
    return filterBySector(WAYPOINTS);
  }
  // easy: nearest 4 by projected distance + target (distractors from full map = realistic)
  const others = WAYPOINTS.filter(w => w.name !== target.name).map(w => {
    const dx = projX(w.lon) - projX(target.lon);
    const dy = projY(w.lat) - projY(target.lat);
    return { w, d: dx*dx + dy*dy };
  }).sort((a,b) => a.d - b.d).slice(0, 4).map(o => o.w);
  return shuffle([target, ...others]);
}

/* ============================================================
   HINT GENERATORS - progressive hints for each question type
   ============================================================ */
function generateHints(q) {
  if (q.type === 'aircraft') return q.data.hints.slice();
  if (q.type === 'airport') {
    const ap = q.data;
    if (q.subtype === 'icao-to-city') {
      return [
        `Krajina: ${ap.country}`,
        `${ap.hint}`,
        `Začína na "${ap.city.charAt(0)}", ${ap.city.length} písmen.`,
        `Letisko: ${ap.name}`,
      ];
    } else {
      const firstLetter = ap.icao.charAt(0);
      const regionMap = { L: 'južná/stredná Európa', E: 'severná/západná Európa', K: 'USA', U: 'CIS/Ukrajina', O: 'Stredný východ' };
      const region = regionMap[firstLetter] || '';
      return [
        `Krajina: ${ap.country}${region ? ' (' + region + ')' : ''}`,
        `${ap.hint}`,
        `Začína na "${ap.icao.substring(0,2)}".`,
        `Posledné dve: "${ap.icao.substring(2,4)}".`,
      ];
    }
  }
  if (q.type === 'prefix') {
    const st = q.data, L = st.p.charAt(0), nm = pxShort(st);
    if (q.subtype === 'code-to-state') return [
      `1. písmeno ${L} = oblasť: ${icaoAreaName(L)}`,
      `Štát začína na „${nm.charAt(0)}“, ${nm.length} znakov.`,
    ];
    return [
      `Oblasť: ${icaoAreaName(L)}`,
      `Prvé písmeno prefixu: ${L}`,
    ];
  }
  if (q.type === 'callsign') {
    const cs = q.data;
    /* údaje o aerolinke majú len dopravcovia z pôvodného zoznamu —
       pri ostatných sa napovedá z písmen */
    const meta = cs.airline ? [
      `Aerolinka: ${cs.airline}`,
      `Krajina: ${cs.country} · Typ: ${cs.type}`,
      `${cs.hint}`,
    ] : [];
    if (q.subtype === 'icao-to-call') {
      const flat = cs.call.replace(/\s/g, '');
      const words = cs.call.split(' ').length;
      const out = meta.concat([
        `Volačka má ${words === 1 ? 'jedno slovo' : words + ' slová'}, spolu ${flat.length} písmen.`,
        `Callsign začína na "${cs.call.charAt(0)}".`,
      ]);
      if (flat.length > 4) out.push(`Prvé tri písmená: "${flat.substring(0, 3)}".`);
      return out;
    } else {
      return meta.concat([
        `ICAO začína na "${cs.icao.charAt(0)}".`,
        `ICAO končí na "${cs.icao.charAt(2)}".`,
      ]);
    }
  }
  if (q.type === 'waypoint' && q.subtype === 'name') {
    const w = q.data;
    const typeFull = { A:'Príletový', D:'Odletový', E:'Vstupný', I:'Vnútorný', X:'Výstupný' };
    const typeList = (w.type||'').split('').filter(c=>typeFull[c]).map(c=>typeFull[c]).join(', ') || '—';
    const near = nearestPoints(w, 1)[0];
    return [
      `Sektor: ${SECTOR_NAMES[w.sec] || '—'}`,
      `Typ bodu: ${typeList}`,
      `Najbližší bod: ${near ? near.name : '—'}`,
      `Začína na „${w.name.charAt(0)}“, ${w.name.length} písmen.`,
    ];
  }
  return [];
}

/* ============================================================
   PHOTO LOADER - Wikipedia REST API summary endpoint
   Returns the infobox thumbnail (CORS-enabled, stable)
   ============================================================ */
const photoCache = {};
async function loadAircraftPhoto(ac) {
  const box = document.getElementById('ac-photo');
  if (!box) return;
  const setImg = (src) => {
    box.innerHTML = `
      <img src="${src}" alt="aircraft" onerror="this.parentElement.innerHTML='<div class=&quot;photo-loading&quot;>IMAGERY UNAVAILABLE</div>'">
      <div class="photo-corner"><span>▲ INBOUND TRAFFIC</span><span>VIS REC</span></div>
    `;
  };
  if (photoCache[ac.icao]) { setImg(photoCache[ac.icao]); return; }
  try {
    const url = `https://en.wikipedia.org/api/rest_v1/page/summary/${ac.wiki}`;
    const r = await fetch(url, { headers: { 'Accept': 'application/json' } });
    if (!r.ok) throw new Error('http ' + r.status);
    const d = await r.json();
    const src = (d.originalimage && d.originalimage.source) || (d.thumbnail && d.thumbnail.source);
    if (!src) throw new Error('no image in summary');
    photoCache[ac.icao] = src;
    setImg(src);
  } catch (e) {
    box.innerHTML = `<div class="photo-loading">IMAGERY UNAVAILABLE<br><span style="font-size:9px;color:var(--text-faint)">${ac.wiki}</span></div>`;
  }
}

/* ============================================================
   RENDER QUESTION
   ============================================================ */
function renderQuestion() {
  const q = state.current;
  const card = document.getElementById('qcard');
  document.getElementById('qnum').textContent = state.index + 1;
  document.getElementById('qtotal').textContent = state.total;
  document.getElementById('mode-label').textContent =
    state.mode === 'aircraft' ? 'AIRCRAFT TYPE' :
    state.mode === 'airport' ? 'AIRPORTS / ICAO' :
    state.mode === 'callsign' ? 'CALLSIGNS' : 'FRA BODY / MAPA';
  state.hintsUsed = 0;

  /* MOD 03 ZOZNAM — čítanie a zakrývanie, bez otázok */
  if (state.mode === 'callsign' && state.filters.csMode === 'list') {
    renderCsList(card);
    return;
  }
  /* MOD 02 ŠTÚDIUM — oblasti ICAO na mape, bez otázok */
  if (state.mode === 'airport' && state.filters.apMode === 'study') {
    renderAirportStudy(card);
    return;
  }
  // STUDY / EXPLORE mode for waypoints — no question, just an interactive map
  if (state.mode === 'waypoint' && state.filters.wpMode === 'study') {
    renderWaypointStudy(card);
    return;
  }
  /* SLEPÁ MAPA — tiež bez fronty otázok: celý výber naraz. */
  if (state.mode === 'waypoint' && state.filters.wpMode === 'blind') {
    renderWaypointBlind(card);
    return;
  }

  if (!q) {
    const pct = Math.round((state.correct / Math.max(1,state.total)) * 100);
    card.innerHTML = `
      <div class="session-done">
        <h2>SESSION COMPLETE</h2>
        <p>Správne: ${state.correct} / ${state.total} · Najlepší streak: ${state.bestStreak}</p>
        <div class="score-big">${pct}%</div>
        <p style="margin-top:18px"><button class="btn" id="restart-btn">RESTART ▶</button></p>
      </div>`;
    document.getElementById('restart-btn').onclick = () => startMode(state.mode);
    return;
  }

  let body = '';
  let placeholder = '';

  /* MOD 02 — klik do mapy má vlastnú kartu bez inputu */
  if (q.click) { renderClickQuestion(q, card); return; }
  /* MOD 03 — kartičky */
  if (q.type === 'callsign' && state.filters.csMode === 'cards') { renderCsCard(q, card); return; }

  if (q.type === 'aircraft') {
    const a = q.data;
    body = `
      <div class="qmeta">IDENT TYPE <span class="sep">·</span> ENTER ICAO TYPE DESIGNATOR <em style="color:var(--text-faint);font-style:normal">(e.g. B738)</em> OR COMMON NAME</div>
      <div class="aircraft-display">
        <div class="aircraft-photo" id="ac-photo">
          <div class="photo-loading">LOADING IMAGERY...</div>
        </div>
        <div class="aircraft-info-side">
          <div class="ac-target">
            <small>QUICK RECOGNITION DATA</small>
            ▼ UNKNOWN TRAFFIC
          </div>
          <div class="ac-row">
            <div class="ac-chip"><strong>WTC</strong>${a.wake}</div>
            <div class="ac-chip"><strong>ENG</strong>${a.enginesCount}</div>
            <div class="ac-chip"><strong>CRS</strong>${a.cruise}</div>
          </div>
          <div class="ac-row">
            <div class="ac-chip"><strong>ROLE</strong>${a.role}</div>
          </div>
        </div>
      </div>`;
    placeholder = 'TYPE DESIGNATOR OR NAME...';
  }

  if (q.type === 'airport') {
    /* režim MAPA: tá istá otázka, ale nad ňou svieti poloha letiska */
    const onMap = state.filters.apMode === 'map';
    const map = onMap ? airportMapHTML(q.data) : '';
    const tag = onMap ? 'MAPA <span class="sep">·</span> ' : '';
    if (q.subtype === 'icao-to-city') {
      body = `<div class="qmeta">AIRPORT ID <span class="sep">·</span> ${tag}ICAO → CITY</div>
              ${map}
              <div class="big-prompt${onMap ? ' small' : ''}">${q.data.icao}</div>
              <div class="prompt-hint">— ${onMap ? 'KTORÉ MESTO SVIETI NA MAPE?' : 'WHICH CITY?'} —</div>`;
      placeholder = 'CITY NAME...';
    } else {
      body = `<div class="qmeta">AIRPORT ID <span class="sep">·</span> ${tag}CITY → ICAO</div>
              ${map}
              <div class="big-prompt small">${q.data.city}</div>
              <div class="prompt-hint">— ${q.data.country} · ${q.data.name} —</div>`;
      placeholder = 'ICAO CODE (4 LETTERS)...';
    }
  }

  if (q.type === 'prefix') {
    const st = q.data;
    if (q.subtype === 'code-to-state') {
      body = `<div class="qmeta">ICAO PREFIX <span class="sep">·</span> KÓD → ŠTÁT</div>
              <div class="big-prompt">${st.p}</div>
              <div class="prompt-hint">— KTORÝ ŠTÁT MÁ TENTO PREFIX? —</div>`;
      placeholder = 'ŠTÁT...';
    } else {
      body = `<div class="qmeta">ICAO PREFIX <span class="sep">·</span> ŠTÁT → KÓD</div>
              <div class="big-prompt small">${pxAsk(st)}</div>
              <div class="prompt-hint">— PRVÉ DVE PÍSMENÁ INDIKÁTORA? —</div>`;
      placeholder = 'PREFIX (2 PÍSMENÁ)...';
    }
  }

  if (q.type === 'callsign') {
    if (q.subtype === 'icao-to-call') {
      body = `<div class="qmeta">OPERATOR CALL <span class="sep">·</span> ICAO → TELEPHONY</div>
              <div class="big-prompt">${q.data.icao}</div>
              <div class="prompt-hint">— RADIO CALLSIGN? —</div>`;
      placeholder = 'CALLSIGN (e.g. SPEEDBIRD)...';
    } else {
      body = `<div class="qmeta">OPERATOR CALL <span class="sep">·</span> TELEPHONY → ICAO</div>
              <div class="big-prompt small">"${q.data.call}"</div>
              <div class="prompt-hint">— ICAO 3-LETTER OPERATOR CODE? —</div>`;
      placeholder = 'ICAO 3-LETTER CODE...';
    }
  }

  if (q.type === 'waypoint') {
    if (q.subtype === 'name') renderWaypointNameQuestion(q, card);
    else renderWaypointQuestion(q, card);
    return;
  }

  /* MOD 02 — výber z možností namiesto písania */
  if (((q.type === 'airport' || q.type === 'prefix') && state.filters.apAns === 'choice') ||
      (q.type === 'callsign' && state.filters.csAns === 'choice')) {
    renderChoiceQuestion(q, card, body);
    return;
  }

  card.innerHTML = `
    ${body}
    <div class="hint-row empty" id="hint-row">
      <span class="hint-label">HINT</span>
      <span class="hint-text">— press [?] for a hint —</span>
      <button class="btn-hint" id="btn-hint">? HINT</button>
    </div>
    <div class="input-row">
      <input type="text" id="answer" placeholder="${placeholder}" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <button class="btn" id="submit-btn">SUBMIT ▶</button>
    </div>
    <div class="feedback" id="feedback"></div>
  `;

  if (q.type === 'aircraft') loadAircraftPhoto(q.data);
  apRetryBadge(q);

  const input = document.getElementById('answer');
  input.focus();
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') submitAnswer();
  });
  document.getElementById('submit-btn').onclick = submitAnswer;
  document.getElementById('btn-hint').onclick = useHint;
}

/* ============================================================
   MAP / WAYPOINT QUESTION RENDERER
   ============================================================ */
/* shared map base: border path + city anchors (used by quiz & study renderers) */
function mapBaseParts() {
  const firPath = smoothClosedPath(FIR_OUTLINE.map(([lo,la]) => [projX(lo), projY(la)]));
  const cities = WP_CITIES.map(c => {
    const x = projX(c.lon), y = projY(c.lat);
    return `<g>
      <path class="wp-city" d="M ${x},${y-6} L ${x+5},${y} L ${x},${y+6} L ${x-5},${y} Z"></path>
      <text class="wp-anchor-label" x="${x+9}" y="${y+3}">${c.name}</text>
    </g>`;
  }).join('');
  return { firPath, cities };
}

function buildMapSVG(target, candidates, opts) {
  opts = opts || {};
  const P = MAP_PROJ;
  const { firPath, cities } = mapBaseParts();

  // dots
  let dots = candidates.map(c => {
    const x = projX(c.lon).toFixed(1), y = projY(c.lat).toFixed(1);
    const isNav = c.kind === 'nav';
    if (isNav) {
      // navaid = hexagon marker to show it's a facility, not a fix
      const r = 7;
      const hex = [];
      for (let i=0;i<6;i++){ const a=Math.PI/6 + i*Math.PI/3; hex.push(`${(+x+r*Math.cos(a)).toFixed(1)},${(+y+r*Math.sin(a)).toFixed(1)}`); }
      return `<polygon class="wp-dot nav cand wp-hit" data-name="${c.name}" points="${hex.join(' ')}"></polygon>
              <circle class="wp-hit" data-name="${c.name}" cx="${x}" cy="${y}" r="16" fill="transparent"></circle>`;
    }
    return `<circle class="wp-dot cand wp-hit" data-name="${c.name}" cx="${x}" cy="${y}" r="6"></circle>
            <circle class="wp-hit" data-name="${c.name}" cx="${x}" cy="${y}" r="16" fill="transparent"></circle>`;
  }).join('');

  return `<svg viewBox="0 0 ${P.w} ${P.h.toFixed(0)}" xmlns="http://www.w3.org/2000/svg" id="map-svg">
    <rect x="0" y="0" width="${P.w}" height="${P.h.toFixed(0)}" fill="#fbfdfc"></rect>
    <path d="${firPath}" fill="#eef6f0" stroke="var(--border-bright)" stroke-width="1.5"></path>
    ${cities}
    ${dots}
  </svg>`;
}

/* Catmull-Rom spline through points -> smooth closed SVG path (cubic Béziers).
   Makes the hand-placed border vertices render as soft curves, not straight chords. */
function smoothClosedPath(pts, k) {
  k = (k == null) ? 0.5 : k; // tension
  const n = pts.length;
  if (n < 3) return 'M ' + pts.map(p => p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L ') + ' Z';
  let d = `M ${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i - 1 + n) % n];
    const p1 = pts[i];
    const p2 = pts[(i + 1) % n];
    const p3 = pts[(i + 2) % n];
    const c1x = p1[0] + (p2[0] - p0[0]) * k / 3;
    const c1y = p1[1] + (p2[1] - p0[1]) * k / 3;
    const c2x = p2[0] - (p3[0] - p1[0]) * k / 3;
    const c2y = p2[1] - (p3[1] - p1[1]) * k / 3;
    d += ` C ${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d + ' Z';
}

/* ============================================================
   STUDY / EXPLORE MODE — free interactive map, no scoring
   ============================================================ */
function buildStudySVG(points, selName) {
  const P = MAP_PROJ;
  const { firPath, cities } = mapBaseParts();

  // collision-nudged label placement so names don't pile up
  const placed = [];
  const collides = (lx, ly) => placed.some(p => Math.abs(p.x - lx) < 30 && Math.abs(p.y - ly) < 9);

  const dots = [], labels = [];
  points.forEach(c => {
    const x = projX(c.lon), y = projY(c.lat);
    const xs = x.toFixed(1), ys = y.toFixed(1);
    const sCls = 's-' + (c.sec || 'W');
    const selCls = (c.name === selName) ? ' s-sel' : '';
    if (c.kind === 'nav') {
      const r = 7, hex = [];
      for (let i=0;i<6;i++){ const a=Math.PI/6 + i*Math.PI/3; hex.push(`${(x+r*Math.cos(a)).toFixed(1)},${(y+r*Math.sin(a)).toFixed(1)}`); }
      dots.push(`<polygon class="wp-dot ${sCls}${selCls} wp-hit" data-name="${c.name}" points="${hex.join(' ')}"></polygon>`);
    } else {
      dots.push(`<circle class="wp-dot ${sCls}${selCls} wp-hit" data-name="${c.name}" cx="${xs}" cy="${ys}" r="5"></circle>`);
    }
    dots.push(`<circle class="wp-hit" data-name="${c.name}" cx="${xs}" cy="${ys}" r="14" fill="transparent"></circle>`);
    // place label
    const tries = [[x+8,y-5,'start'],[x+8,y+11,'start'],[x-8,y-5,'end'],[x-8,y+11,'end'],[x,y-11,'middle'],[x,y+16,'middle']];
    let ch = tries[0];
    for (const t of tries) { if (!collides(t[0], t[1])) { ch = t; break; } }
    placed.push({ x: ch[0], y: ch[1] });
    labels.push(`<text class="wp-label-study" x="${ch[0].toFixed(1)}" y="${ch[1].toFixed(1)}" text-anchor="${ch[2]}">${c.name}</text>`);
  });

  return `<svg viewBox="0 0 ${P.w} ${P.h.toFixed(0)}" xmlns="http://www.w3.org/2000/svg" id="map-svg">
    <rect x="0" y="0" width="${P.w}" height="${P.h.toFixed(0)}" fill="#fbfdfc"></rect>
    <path d="${firPath}" fill="#eef6f0" stroke="var(--border-bright)" stroke-width="1.5"></path>
    ${cities}
    ${dots.join('')}
    ${labels.join('')}
  </svg>`;
}
