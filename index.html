/* ============================================================
   MOD 02 — ROZŠÍRENIA
   prefixy štátov · výber z možností · klik do mapy · rozklad kódu ·
   opakovanie chýb · uložený pokrok
   ------------------------------------------------------------
   Zdroj pravidla aj kódov: prezentácia „3.6 Zobrazovanie dát"
   (ICAO Doc 7910). Štát s doc:true je na mape kódov v prezentácii;
   ostatné sú doplnené z Doc 7910 a v kvíze sa dajú vypnúť.
   ============================================================ */

/* kódy z prezentácie, ktoré na slepej mape nemajú vlastnú plochu */
const ICAO_STATES_EXTRA = [
  { p:'ET', name:'Nemecko', ask:'Nemecko — vojenské letiská', doc:true, pos:[51.0,10.0] },
  { p:'LM', name:'Malta', doc:true, pos:[35.9,14.45] },
  { p:'LN', name:'Monako', doc:true, pos:[43.73,7.42] },
  { p:'GC', name:'Kanárske ostrovy', doc:true },
  { p:'HL', name:'Líbya', doc:true },
  { p:'HE', name:'Egypt', doc:true },
  { p:'BG', name:'Grónsko' },
];
/* štáty mimo mapy — len pre rozklad kódu pri letiskách z MOD 02 */
const ICAO_STATES_FAR = {
  OM:'Spojené arabské emiráty', OT:'Katar', OE:'Saudská Arábia', VH:'Hongkong', WS:'Singapur',
  RJ:'Japonsko', RK:'Južná Kórea', ZB:'Čína', CY:'Kanada',
  OK:'Kuvajt', OB:'Bahrajn', VI:'India', VA:'India', VT:'Thajsko', ZS:'Čína', ZG:'Čína',
  YS:'Austrália', FA:'Južná Afrika', SB:'Brazília', MM:'Mexiko', UU:'Rusko', UL:'Rusko',
};
/* ďalšie uznané názvy pri písaní */
const PX_ALT = {
  EG:['Veľká Británia','Británia','UK','Anglicko'], EH:['Nizozemsko'], LK:['Česká republika','Čechy'],
  LZ:['Slovenská republika'], LY:['Srbsko','Čierna Hora'], LQ:['Bosna'], LW:['Macedónsko'],
  LT:['Turecko','Türkiye'], UM:['Bielorusko'], LO:['Rakúsko'], GC:['Kanáre','Kanárske ostrovy'],
};
function pxAll()      { return ICAO_STATES.concat(ICAO_STATES_EXTRA).filter(st => st.p.indexOf('*') < 0); }
function pxPool()     { return pxAll().filter(st => state.filters.apPx === 'all' || st.doc); }
function pxShort(st)  { return st.name.split(' (')[0]; }
function pxAsk(st)    { return st.ask || (st.p === 'ED' ? 'Nemecko — civilné letiská' : pxShort(st)); }
function pxAccept(st) { return [pxShort(st)].concat(PX_ALT[st.p] || []); }
function pxPos(st)    { return st.seeds ? st.seeds[0] : st.pos; }
function icaoAreaName(L) {
  if (ICAO_AREAS[L]) return ICAO_AREAS[L].name;
  const far = ICAO_AREAS_FAR.find(f => f[0] === L);
  return far ? far[1].split(' — ')[0] : '—';
}

function buildPrefixQuestions() {
  const list = [];
  pxPool().forEach(st => {
    list.push({ type:'prefix', subtype:'code-to-state', id:'PX_C2S_' + st.p, data:st, accept:pxAccept(st) });
    list.push({ type:'prefix', subtype:'state-to-code', id:'PX_S2C_' + st.p, data:st, accept:[st.p] });
  });
  return list;
}

/* ---------- rozklad indikátora (pri každej odpovedi) ---------- */
function icaoBreakdownHTML(ap) {
  const icao = ap.icao, L = icao.charAt(0), p2 = icao.substring(0, 2);
  const chip = (code, cls, txt) => `<div class="ap-bk"><span class="ap-bk-c ${cls}">${code}</span><span>${txt}</span></div>`;
  let rows;
  if (L === 'K') {
    /* USA sú výnimka: K je celá oblasť aj štát, zvyšok je kód letiska */
    rows = chip('K', 'a', `<strong>oblasť aj štát</strong> — ${icaoAreaName('K')}`) +
           chip(icao.substring(1), 'c', `<strong>letisko</strong> — ${ap.city} (${ap.name})`);
  } else {
    const st = pxAll().find(s => s.p === p2);
    const stName = st ? pxShort(st) : (ICAO_STATES_FAR[p2] || (L === 'U' ? 'Rusko' : L === 'C' ? 'Kanada' : L === 'Z' ? 'Čína' : '—'));
    rows = chip(L, 'a', `<strong>1. písmeno — oblasť</strong> · ${icaoAreaName(L)}`) +
           chip(icao.charAt(1), 'b', `<strong>2. písmeno — štát</strong> · ${stName}`) +
           chip(icao.substring(2), 'c', `<strong>3. a 4. písmeno — stanica a spresnenie jej sídla</strong> · ${ap.city}`);
  }
  return `<div class="reveal-ops"><strong>ROZKLAD INDIKÁTORA (DOC 7910)</strong><div class="ap-bks">${rows}</div></div>`;
}

/* ---------- pokrok: uloženie, opakovanie chýb ---------- */
const AP_STORE = 'atcoTrainerV2.mod02';   // názov kľúča ostal, ukladá sa doň MOD 02 aj MOD 03
function apIsMod02(id) { return id.indexOf('AP_') === 0 || id.indexOf('PX_') === 0; }
function apIsMod03(id) { return id.indexOf('CS_') === 0; }
function apIsMod06(id) { return id.indexOf('CO_') === 0; }
function apIsMine(id) { return apIsMod02(id) || apIsMod03(id) || apIsMod06(id) || id.indexOf('AC_') === 0 || id.indexOf('WP_') === 0; }
function apSaveProgress() {
  try {
    const m = {};
    Object.keys(state.mistakes).filter(apIsMine).forEach(k => { m[k] = state.mistakes[k]; });
    localStorage.setItem(AP_STORE, JSON.stringify({ mistakes: m, ok: state.apOk, sr: state.sr, last: state.last, dailyDone: state.dailyDone }));
  } catch (e) { /* súkromné okno alebo plné úložisko — trenažér beží ďalej bez ukladania */ }
}
function apLoadProgress() {
  try {
    const d = JSON.parse(localStorage.getItem(AP_STORE) || 'null');
    if (!d) return;
    Object.assign(state.mistakes, d.mistakes || {});
    state.apOk = d.ok || {};
    state.sr = d.sr || {}; state.last = d.last || {}; state.dailyDone = d.dailyDone || 0;
  } catch (e) {}
}
function apClearProgress(mine) {
  Object.keys(state.mistakes).filter(mine).forEach(k => { delete state.mistakes[k]; });
  Object.keys(state.sr).filter(mine).forEach(k => { delete state.sr[k]; });
  Object.keys(state.apOk).filter(mine).forEach(k => { delete state.apOk[k]; });
  apSaveProgress();
  renderWeak();
}
/* zvládnuté = dvakrát po sebe správne */
function apProgressText() {
  const ids = state.apAllIds || [];
  return `ZVLÁDNUTÉ ${ids.filter(id => (state.apOk[id] || 0) >= 2).length} / ${ids.length}`;
}
function apRenderProgress() {
  const el = document.getElementById('ap-progress');
  if (el) el.textContent = apProgressText();
}
function apRetryBadge(q) {
  if (!q || !q.retry) return;
  const m = document.querySelector('#qcard .qmeta');
  if (m) m.insertAdjacentHTML('beforeend', ' <span class="ap-retry">↻ OPAKOVANIE CHYBY</span>');
}

/* Spoločný krok po každej odpovedi v MOD 02 a MOD 03.
   Chyba sa vráti až neskôr v tom istom cvičení — hneď po sebe by si
   odpoveď len opísal z pamäti. */
function apAfterAnswer(q, ok) {
  srUpdate(q.id, ok);
  if (modOfId(q.id)) state.last[modOfId(q.id)] = dayNow();
  if (ok) {
    state.apOk[q.id] = (state.apOk[q.id] || 0) + 1;
    if (state.mistakes[q.id] > 0) {
      state.mistakes[q.id]--;
      if (!state.mistakes[q.id]) delete state.mistakes[q.id];
      renderWeak();
    }
  } else {
    state.apOk[q.id] = 0;
    const r = q.retry || 0;
    if (r < 2) {
      /* vráti sa až v druhej polovici toho, čo ešte zostáva (najmenej
         o 12 otázok), na náhodnom mieste; pri krátkom zvyšku na konci */
      const left = state.queue.length - state.index - 1;
      const from = state.index + 1 + Math.min(left, Math.max(12, Math.floor(left / 2)));
      const pos = from + Math.floor(Math.random() * (state.queue.length - from + 1));
      state.queue.splice(pos, 0, Object.assign({}, q, { retry: r + 1 }));
      state.total = state.queue.length;
      document.getElementById('qtotal').textContent = state.total;
    }
  }
  apSaveProgress();
  apRenderProgress();
  if (!q.click) apMapReveal(q, ok);
}

/* po odpovedi: pulz zhasne a bod dostane menovku */
function apMapMark(svg, x, y, w, text, ok) {
  const right = x > w - 150;
  const lbl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  lbl.setAttribute('class', 'ap-label ' + (ok ? 'ok' : 'no'));
  lbl.setAttribute('x', (x + (right ? -11 : 11)).toFixed(1));
  lbl.setAttribute('y', (y - 10).toFixed(1));
  lbl.setAttribute('text-anchor', right ? 'end' : 'start');
  lbl.textContent = text;
  svg.appendChild(lbl);
}
function apMapReveal(q, ok) {
  const svg = document.getElementById('map-svg');
  if (!svg || q.type !== 'airport') return;
  if (state.mode !== 'airport' || state.filters.apMode !== 'map') return;
  svg.querySelectorAll('.wp-ring').forEach(r => r.remove());
  const dot = svg.querySelector('#tgt-dot');
  if (dot) { dot.classList.remove('tgt'); dot.classList.add(ok ? 'reveal-correct' : 'wrong'); }
  const m = airportMapXY(q.data);
  apMapMark(svg, m.x, m.y, m.w, q.data.icao + ' · ' + q.data.city, ok);
}

/* vyhodnotenie pre výber z možností a klik do mapy — to isté, čo
   robí submitAnswer() pri písaní, len odpoveď neprichádza z inputu */
function apFinish(q, ok, shown) {
  if (state.mode === 'exam' && state.exam) { examRecord(q, ok, shown || (ok ? examAnswerOf(q) : '')); return; }
  if (ok) {
    state.correct++; state.streak++;
    if (state.streak > state.bestStreak) state.bestStreak = state.streak;
  } else {
    state.wrong++; state.streak = 0;
    state.mistakes[q.id] = (state.mistakes[q.id] || 0) + 1;
  }
  renderStats(); renderWeak();
  const hb = document.getElementById('btn-hint'); if (hb) hb.disabled = true;
  apAfterAnswer(q, ok);

  const fb = document.getElementById('feedback');
  fb.className = 'feedback show ' + (ok ? 'ok' : 'no');
  fb.innerHTML = `
    <div class="feedback-banner">
      <span>${ok ? `✓ <strong>CORRECT</strong>${shown ? ' · ' + shown : ''}`
                 : `✗ <strong>WRONG</strong> · YOUR ANSWER: <span class="answer">${shown}</span>`}</span>
      <button class="btn" id="next-btn">NEXT ▶</button>
    </div>
    ${renderReveal(q)}
  `;
  setTimeout(() => {
    const nb = document.getElementById('next-btn');
    if (nb) { nb.focus(); nb.onclick = nextQuestion; }
    document.addEventListener('keydown', onEnterNext, { once: true });
  }, 50);
}

/* ---------- VÝBER Z MOŽNOSTÍ ---------- */
/* Nesprávne možnosti sú zámerne podobné: pri kóde letiská z toho istého
   štátu (LOWW / LOWS / LOWL), pri meste mestá tej istej krajiny. */
function choiceSet(q) {
  let correct, cands;
  if (q.type === 'coord') {
    /* možnosti sú pripravené pri stavbe otázky a zoradené od najpodobnejších */
    correct = q.correct;
    cands = q.pool.map((v, i) => ({ v, t: i }));
  } else if (q.type === 'aircraft') {
    /* podobné = rovnaká kategória turbulencie a počet motorov, potom aspoň kategória */
    const a = q.data, lbl = x => x.icao + ' — ' + x.name;
    correct = lbl(a);
    cands = AIRCRAFT.filter(x => x.icao !== a.icao).map(x => ({ v: lbl(x), t: (x.wake === a.wake ? 0 : 2) + (x.enginesCount === a.enginesCount ? 0 : 1) }));
  } else if (q.type === 'callsign') {
    /* podobné = susedia v abecede: rovnaké prvé dve písmená kódu, potom rovnaké prvé */
    const cs = q.data, i2c = q.subtype === 'icao-to-call';
    const tier = c => c.icao.substring(0,2) === cs.icao.substring(0,2) ? 0 : c.icao.charAt(0) === cs.icao.charAt(0) ? 1 : 2;
    correct = i2c ? cs.call : cs.icao;
    cands = CALLSIGNS.filter(c => q.accept.indexOf(i2c ? c.call : c.icao) < 0 && c.call !== cs.call && c.icao !== cs.icao)
      .map(c => ({ v: i2c ? c.call : c.icao, t: tier(c) }));
  } else if (q.type === 'airport') {
    const ap = q.data, rest = AIRPORTS.filter(a => a.city !== ap.city);
    if (q.subtype === 'icao-to-city') {
      correct = ap.city;
      cands = rest.map(a => ({ v: a.city, t: a.country === ap.country ? 0 : a.cat === ap.cat ? 1 : 2 }));
    } else {
      correct = ap.icao;
      cands = rest.map(a => ({ v: a.icao, t: a.icao.substring(0,2) === ap.icao.substring(0,2) ? 0 : a.icao.charAt(0) === ap.icao.charAt(0) ? 1 : 2 }));
    }
  } else {
    const st = q.data, rest = pxPool().filter(s => s.p !== st.p && pxShort(s) !== pxShort(st));
    const tier = s => s.p.charAt(0) === st.p.charAt(0) ? 0 : 1;
    if (q.subtype === 'code-to-state') { correct = pxShort(st); cands = rest.map(s => ({ v: pxShort(s), t: tier(s) })); }
    else { correct = st.p; cands = rest.map(s => ({ v: s.p, t: tier(s) })); }
  }
  const seen = {}; seen[correct] = 1;
  const uniq = shuffle(cands).filter(c => !seen[c.v] && (seen[c.v] = 1)).sort((a, b) => a.t - b.t);
  /* MOD 06 má šesť možností — hodnoty sú si podobné a štyri by sa dali uhádnuť */
  return { correct, opts: shuffle([correct].concat(uniq.slice(0, q.type === 'coord' ? 5 : 3).map(c => c.v))) };
}
function renderChoiceQuestion(q, card, body) {
  const set = choiceSet(q);
  card.innerHTML = `
    ${body}
    <div class="hint-row empty" id="hint-row">
      <span class="hint-label">HINT</span>
      <span class="hint-text">— press [?] for a hint —</span>
      <button class="btn-hint" id="btn-hint">? HINT</button>
    </div>
    <div class="choice-grid">${set.opts.map((o, i) => `<button class="choice-btn" data-i="${i}">${o}</button>`).join('')}</div>
    <div class="feedback" id="feedback"></div>
  `;
  apRetryBadge(q);
  if (q.type === 'aircraft') loadAircraftPhoto(q.data);
  document.getElementById('btn-hint').onclick = useHint;
  const btns = card.querySelectorAll('.choice-btn');
  btns.forEach(b => {
    b.onclick = () => {
      const picked = set.opts[+b.dataset.i], ok = picked === set.correct;
      btns.forEach(x => {
        x.disabled = true;
        if (set.opts[+x.dataset.i] === set.correct) x.classList.add('ok');
      });
      if (!ok) b.classList.add('no');
      apFinish(q, ok, ok ? '' : picked.toUpperCase());
    };
  });
}

/* ---------- KLIK DO MAPY ---------- */
const EU_KM_PX = 6.1;     // mapa Európy: 1 px ≈ 6,1 km
const SK_KM_PX = 0.44;    // mapa Slovenska: 1 px ≈ 0,44 km
/* tolerancia kliku v km: ĽAHKÁ / HARDCORE */
const CLICK_KM_ALL = { easy: { eu: 100, sk: 15 }, hard: { eu: 50, sk: 8 } };
const CLICK_KM = { get eu() { return CLICK_KM_ALL[state.filters.apAns === 'type' ? 'hard' : 'easy'].eu; }, get sk() { return CLICK_KM_ALL[state.filters.apAns === 'type' ? 'hard' : 'easy'].sk; } };
function svgPoint(svg, e) {
  const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  return [p.x, p.y];
}
function skMapSVG(inner) {
  const P = MAP_PROJ;
  return `<svg viewBox="0 0 ${P.w} ${P.h.toFixed(0)}" xmlns="http://www.w3.org/2000/svg" id="map-svg">
    <rect x="0" y="0" width="${P.w}" height="${P.h.toFixed(0)}" fill="#fbfdfc"></rect>
    <path d="${mapBaseParts().firPath}" fill="#eef6f0" stroke="var(--border-bright)" stroke-width="1.5"></path>
    ${inner}
  </svg>`;
}
function svgAdd(svg, tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.keys(attrs).forEach(k => el.setAttribute(k, attrs[k]));
  svg.appendChild(el);
  return el;
}
function renderClickQuestion(q, card) {
  const sk = q.data.cat === 'sk';
  card.innerHTML = `
    <div class="qmeta">AIRPORT ID <span class="sep">·</span> KLIKNI NA MAPU</div>
    <div class="map-prompt">
      <span class="mp-label">KLIKNI, KDE LETISKO LEŽÍ</span>
      <div class="mp-name">${q.subtype === 'icao-to-city' ? q.data.icao : q.data.city}</div>
      <div class="mp-sub">uzná sa klik do ${sk ? CLICK_KM.sk : CLICK_KM.eu} km od letiska${q.subtype === 'city-to-icao' && apCityNote(q.data) ? ' · ' + apCityNote(q.data) : ''}</div>
    </div>
    <div class="map-wrap click">${sk ? skMapSVG('') : euMapSVG('plain', '', true)}</div>
    <div class="feedback" id="feedback"></div>
  `;
  apRetryBadge(q);
  const svg = document.getElementById('map-svg');
  svg.addEventListener('click', e => {
    if (svg.dataset.done) return;
    svg.dataset.done = '1';
    svg.parentElement.classList.remove('click');
    const xy = svgPoint(svg, e);
    apClickEval(q, xy[0], xy[1], svg, sk);
  });
}
function apClickEval(q, x, y, svg, sk) {
  const m = airportMapXY(q.data);
  const km = Math.hypot(x - m.x, y - m.y) * (sk ? SK_KM_PX : EU_KM_PX);
  const ok = km <= (sk ? CLICK_KM.sk : CLICK_KM.eu);
  svgAdd(svg, 'line', { x1: x, y1: y, x2: m.x, y2: m.y, class: 'ap-miss' });
  svgAdd(svg, 'path', { d: `M ${x-5},${y-5} L ${x+5},${y+5} M ${x-5},${y+5} L ${x+5},${y-5}`, class: 'ap-x' });
  svgAdd(svg, 'circle', { cx: m.x, cy: m.y, r: 6, class: 'wp-dot ' + (ok ? 'reveal-correct' : 'wrong') });
  apMapMark(svg, m.x, m.y, m.w, q.data.icao + ' · ' + q.data.city, ok);
  const dist = '≈ ' + Math.round(km) + ' km od letiska';
  apFinish(q, ok, ok ? dist : dist.toUpperCase());
}
/* ============================================================
   MOD 03 — ROZŠÍRENIA
   balíčky po 20 · kartičky · zoznam · výber z možností · smer ·
   delenie na „kód vo volačke" a „bez súvisu" · opakovanie chýb
   ------------------------------------------------------------
   Vyše tisíc volačiek sa naraz naučiť nedá. Preto sa dajú krájať
   na malé balíčky a oddeliť tie, kde kód vidno priamo vo volačke
   (RYR → RYANAIR), od tých, ktoré treba naozaj vedieť naspamäť
   (BAW → SPEEDBIRD).
   ============================================================ */
/* Obrázok prevádzkovateľa: úvodný obrázok jeho článku na Wikipédii
   (väčšinou logo, niekedy lietadlo). Načíta sa až keď ho treba; ak
   článok alebo obrázok neexistuje, rámček jednoducho zmizne. */
const csPhotoCache = {};
function csPhotoSlot(cs) {
  const src = (CS_BY_ICAO[cs.icao] || [cs]).find(c => c.wiki);
  if (!src) return '';

  return `<div class="cs-photo"><img src="data:," alt="" style="display:none" onerror="csLoadPhoto(this.parentNode,'${cs.icao}')"></div>`;
}
function csLoadPhoto(box, icao) {
  const cs = (CS_BY_ICAO[icao] || []).find(c => c.wiki);
  if (!cs) { box.remove(); return; }
  const show = url => {
    if (!url) { box.remove(); return; }
    box.innerHTML = `<img src="${url}" alt="" onerror="this.parentNode.remove()">
      <span><strong>${cs.airline}</strong>${cs.country}<br><span class="cs-src">OBRÁZOK: WIKIPÉDIA</span></span>`;
  };
  if (icao in csPhotoCache) { show(csPhotoCache[icao]); return; }
  fetch('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(cs.wiki.replace(/ /g, '_')), { headers: { 'Accept': 'application/json' } })
    .then(r => r.ok ? r.json() : null)
    .then(d => { csPhotoCache[icao] = (d && d.thumbnail && d.thumbnail.source) || ''; show(csPhotoCache[icao]); })
    .catch(() => { box.remove(); });
}

const CS_PACK = 20;
/* písmená kódu idú vo volačke v rovnakom poradí za sebou */
function csLogical(cs) {
  const f = cs.call.replace(/[^A-Z]/g, '');
  let i = 0;
  for (let k = 0; k < f.length && i < 3; k++) if (f.charAt(k) === cs.icao.charAt(i)) i++;
  return i === 3;
}

function csInCat(c, cat) { return cat === 'all' || (cat === 'top' ? c.sim : c.cat === cat); }
/* Vážené žrebovanie poradia: každá otázka dostane kľúč náhoda^(1/váha)
   a radí sa od najväčšieho. Váha 132 teda takmer vždy predbehne váhu 2,
   ale poradie nie je zakaždým rovnaké. */
function csWeightedOrder(list) {
  return list.map(q => ({ q, k: Math.pow(Math.random(), 1 / q.w) })).sort((a, b) => b.k - a.k).map(x => x.q);
}
function csHighlight(cs) {
  if (!cs.logical) return cs.call;
  let i = 0;
  return cs.call.split('').map(ch => (i < 3 && ch === cs.icao.charAt(i)) ? (i++, `<u>${ch}</u>`) : ch).join('');
}
/* výber podľa kategórie, písmena a typu — ešte pred krájaním na balíčky */
function csSelection() {
  const F = state.filters;
  let pool = CALLSIGNS;
  if (F.callsignCat !== 'all') pool = pool.filter(c => csInCat(c, F.callsignCat));
  if (F.csLetter !== 'all') pool = pool.filter(c => c.icao.charAt(0) === F.csLetter);
  if (F.csKind === 'logical') pool = pool.filter(c => c.logical);
  if (F.csKind === 'hard') pool = pool.filter(c => !c.logical);
  /* podľa dôležitosti: najčastejšie sú hore, takže balíček 1 = 20 najpoužívanejších */
  if (F.csOrder === 'freq') pool = pool.slice().sort((a, b) => b.freq - a.freq);
  return pool;
}
function csPool() {
  const F = state.filters, sel = csSelection();
  if (F.csPack > Math.ceil(sel.length / CS_PACK)) F.csPack = 0;
  return F.csPack ? sel.slice((F.csPack - 1) * CS_PACK, F.csPack * CS_PACK) : sel;
}

function csCardShow() {
  const q = state.current, back = document.getElementById('cs-back');

  back.dataset.open = '1';
  const i2c = q.subtype === 'icao-to-call', cs = q.data;
  back.innerHTML = (i2c ? q.group.map(c => '"' + csHighlight(c) + '"').join(' / ') : q.group.map(c => c.icao).join(' / ')) +

    (cs.logical ? '' : '<small class="hard">kód sa z volačky nedá vyčítať — treba ho vedieť</small>') +
    csPhotoSlot(cs);
  back.classList.add('open');
  document.getElementById('cs-acts').innerHTML = `
    <button class="btn" id="cs-yes">✓ VEDEL SOM <span class="cs-key">1</span></button>
    <button class="btn ghost" id="cs-no">✗ NEVEDEL SOM <span class="cs-key">2</span></button>`;
  document.getElementById('cs-yes').onclick = () => csCardRate(true);
  document.getElementById('cs-no').onclick = () => csCardRate(false);
}
function csCardRate(ok) {
  const q = state.current;
  if (!q) return;
  if (ok) {
    state.correct++; state.streak++;
    if (state.streak > state.bestStreak) state.bestStreak = state.streak;
  } else {
    state.wrong++; state.streak = 0;
    state.mistakes[q.id] = (state.mistakes[q.id] || 0) + 1;
  }
  renderStats(); renderWeak();
  apAfterAnswer(q, ok);
  nextQuestion();
}
document.addEventListener('keydown', e => {
  if (state.mode !== 'callsign' || state.filters.csMode !== 'cards' || !state.current) return;
  if (document.getElementById('cs-show')) {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); csCardShow(); }
  } else if (document.getElementById('cs-yes')) {
    if (e.key === '1') csCardRate(true);
    if (e.key === '2') csCardRate(false);
  }
});

    <div class="cs-list-bar">${b('none', 'UKÁZAŤ VŠETKO')}${b('call', 'ZAKRYŤ VOLAČKY')}${b('icao', 'ZAKRYŤ KÓDY')}</div>

    <div class="cs-list">${cells || '<span class="weak-empty">— vo výbere nie je žiadna volačka —</span>'}</div>
  `;

}

function tipFor(el) {
  if (el.id && TIPS['#' + el.id]) return TIPS['#' + el.id];
  for (const k in el.dataset) {
    const t = TIPS[k + '=' + el.dataset[k]] || TIPS[k];
    if (t) return t;
  }
  if (el.classList.contains('choice-btn')) return TIPS['.choice-btn'];
  return '';
}
(function tipInit() {
  const box = document.createElement('div');
  box.className = 'tipbox';
  /* v paneli, nie v body — inak by na celej obrazovke nebolo nápovedu vidno */
  document.querySelector('.panel').appendChild(box);
  const hide = () => { box.style.display = 'none'; };
  document.addEventListener('mouseover', e => {
    const el = e.target.closest ? e.target.closest('button, select') : null;
    const t = el ? tipFor(el) : '';
    if (!t) { hide(); return; }
    box.textContent = t;
    box.style.display = 'block';
    const r = el.getBoundingClientRect();
    let top = r.top - box.offsetHeight - 8;
    if (top < 8) top = r.bottom + 8;
    box.style.top = top + 'px';
    box.style.left = Math.max(8, Math.min(r.left, window.innerWidth - box.offsetWidth - 8)) + 'px';
  });
  document.addEventListener('mousedown', hide);
  window.addEventListener('scroll', hide, true);
})();

/* ============================================================
   VEĽKOSŤ MAPY A CELÁ OBRAZOVKA
   ============================================================ */
/* Každá mapa si do CSS zapíše svoj pomer strán (--ar), aby sa dala
   zväčšiť presne na výšku okna bez orezania. */
(function mapSizing() {
  const card = document.getElementById('qcard');
  const fit = () => card.querySelectorAll('.map-wrap').forEach(w => {
    const svg = w.querySelector('svg'); if (!svg) return;
    const vb = (svg.getAttribute('viewBox') || '').split(/\s+/).map(Number);
    if (vb.length === 4 && vb[3]) w.style.setProperty('--ar', (vb[2] / vb[3]).toFixed(4));
  });
  new MutationObserver(fit).observe(card, { childList: true });
  fit();
})();
/* celá obrazovka je dostupná v každom module */
function modeHasMap() { return true; }
function fsActive() { return document.body.classList.contains('fs-on'); }
function fsSync() {
  const b = document.getElementById('btn-fs');
  b.style.display = '';
  b.innerHTML = fsActive() ? '✕<span> ZAVRIEŤ</span>' : '⛶<span> CELÁ OBRAZOVKA</span>';
}
/* Rozloženie na celé okno robí CSS trieda, takže funguje vždy. Skutočná
   celá obrazovka prehliadača sa k tomu len pridá, ak ju prehliadač dovolí
   (v niektorých oknách ju zakazuje — vtedy ostane aspoň celé okno). */
let fsReal = false;
function fsToggle() {
  const on = !fsActive();
  document.body.classList.toggle('fs-on', on);
  const el = document.documentElement;
  if (on && el.requestFullscreen) {
    const p = el.requestFullscreen();
    if (p && p.then) p.then(() => { fsReal = true; }).catch(() => { fsReal = false; });
  } else if (!on && document.fullscreenElement && document.exitFullscreen) {
    document.exitFullscreen();
  }
  fsSync();
  window.scrollTo(0, 0);
}
document.getElementById('btn-fs').onclick = fsToggle;
document.getElementById('btn-report').onclick = reportBug;
document.getElementById('btn-demo').onclick = demoRun;
/* Nastavenia pod otázkou sa dajú zbaliť. Na úzkom okne sú zbalené od
   začiatku, aby otázka a odpoveď boli na jednej obrazovke. */
(function settingsToggle() {
  let off = null;
  try { off = localStorage.getItem('atcoTrainerV2.setOff'); } catch (e) {}
  document.body.classList.toggle('set-off', off === null ? window.innerWidth < 1100 : off === '1');
  const b = document.getElementById('btn-set');
  const sync = () => { b.innerHTML = (document.body.classList.contains('set-off') ? '⚙<span> NASTAVENIA</span>' : '⚙<span> SKRYŤ</span>'); };
  b.onclick = () => {
    const now = document.body.classList.toggle('set-off');
    try { localStorage.setItem('atcoTrainerV2.setOff', now ? '1' : '0'); } catch (e) {}
    sync();
    if (!now) document.getElementById('filters').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  };
  sync();
})();
/* Esc v skutočnej celej obrazovke ju ukončí v prehliadači — zruš aj rozloženie */
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && fsReal) { fsReal = false; document.body.classList.remove('fs-on'); }
  fsSync();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && fsActive() && !document.fullscreenElement) { document.body.classList.remove('fs-on'); fsSync(); }
});

/* ============================================================
   MOD 05 — HRA NA KURZY
   ------------------------------------------------------------
   Jedno lietadlo letí nad mapou Slovenska. Kurz sa zadáva číslom
   po 5° (245, 250, 255…) a cieľom je preletieť bránkou alebo nad
   zadaným miestom. Po zásahu sa hneď objaví ďalší cieľ.
   Lietadlo začne točiť hneď po Enteri, bez oneskorenia.
   Poloha je v súradniciach mapy (viewBox 1000 × 534, 1 px ≈ 0,44 km).
   ============================================================ */
const HG_SPEED = { easy: 20, hard: 40 };              // px za sekundu (ĽAHKÁ / HARDCORE)
const HG_TURN  = 90;                                 // ° za sekundu — skoro hneď, ale zatáčku ešte vidno
const HG_DELAY = 0;                                  // bez oneskorenia: lietadlo točí hneď po Enteri
const HG_GATE  = { easy: 30, hard: 16 };              // polomer bránky v px
const HS_TOL   = { easy: 5, hard: 0 };                // statický režim: o koľko stupňov smieš byť vedľa
const HG_POINT_R = 14;                               // do akej vzdialenosti sa ráta prelet miesta
const HG = { raf: 0, run: false, built: false };

function hgNorm(h) { h = ((h % 360) + 360) % 360; return h === 0 ? 360 : h; }
function hgPad(h) { return String(Math.round(hgNorm(h))).padStart(3, '0'); }
function hgBearing(x1, y1, x2, y2) { return hgNorm(Math.atan2(x2 - x1, -(y2 - y1)) * 180 / Math.PI); }
/* najkratší rozdiel kurzov, -180…180 (kladný = doprava) */
function hgDiff(from, to) { return ((to - from + 540) % 360) - 180; }

let HG_POLY = null;
function hgInside(x, y) {
  if (!HG_POLY) HG_POLY = FIR_OUTLINE.map(p => [projX(p[0]), projY(p[1])]);
  let c = false;
  for (let i = 0, j = HG_POLY.length - 1; i < HG_POLY.length; j = i++) {
    const a = HG_POLY[i], b = HG_POLY[j];
    if ((a[1] > y) !== (b[1] > y) && x < (b[0] - a[0]) * (y - a[1]) / (b[1] - a[1]) + a[0]) c = !c;
  }
  return c;
}
/* miesta, nad ktoré sa lieta: slovenské letiská z MOD 02, resp. body FRA z MOD 04 */
function hgPlaces() {
  if (state.filters.hgKind === 'fra')
    return WAYPOINTS.map(w => ({ name: w.name, x: projX(w.lon), y: projY(w.lat) }));
  return AIRPORTS.filter(a => a.cat === 'sk' && AP_POS[a.icao])
    .map(a => ({ name: a.city.toUpperCase(), x: projX(AP_POS[a.icao][1]), y: projY(AP_POS[a.icao][0]) }));
}

function hgNewTarget() {
  const F = state.filters;
  let t = null;
  if (F.hgKind === 'gate') {
    for (let i = 0; i < 400 && !t; i++) {
      const x = 60 + Math.random() * 880, y = 40 + Math.random() * 450;
      const d = Math.hypot(x - HG.x, y - HG.y);
      if (hgInside(x, y) && d > 170 && d < 520) t = { x, y, r: HG_GATE[F.hgDiff], name: 'BRÁNKA ' + (HG.hits + 1) };
    }
    if (!t) t = { x: 500, y: 267, r: HG_GATE[F.hgDiff], name: 'BRÁNKA ' + (HG.hits + 1) };
    /* stĺpiky bránky stoja kolmo na smer, z ktorého k nej lietadlo teraz letí */
    t.ang = hgBearing(HG.x, HG.y, t.x, t.y) + 90;
  } else {
    const all = hgPlaces().filter(p => (!HG.target || p.name !== HG.target.name) && Math.hypot(p.x - HG.x, p.y - HG.y) > 110);
    const p = all[Math.floor(Math.random() * all.length)];
    t = { x: p.x, y: p.y, r: HG_POINT_R, name: p.name };
  }
  HG.target = t;
  HG.hintUsed = false;
  hgDrawTarget();
}

function hgReset() {
  cancelAnimationFrame(HG.raf);
  Object.assign(HG, { raf: 0, run: false, x: 500, y: 250, hdg: 90, set: 90, delay: 0, trail: [], cmds: 0, hits: 0, t: 0, out: false, target: null, last: 0 });
  state.correct = 0; state.wrong = 0; state.streak = 0; state.bestStreak = 0;
}
function hgStop() { cancelAnimationFrame(HG.raf); HG.raf = 0; HG.run = false; HG.built = false; }

/* ružica okolo lietadla: sever je hore, čiarka každých 10°, číslo každých 30° */
function hgRoseSVG() {
  let rose = '';
  for (let a = 0; a < 360; a += 10) {
    const r1 = a % 30 === 0 ? 52 : 57, s = Math.sin(a * Math.PI / 180), c = -Math.cos(a * Math.PI / 180);
    rose += `<line x1="${(r1 * s).toFixed(1)}" y1="${(r1 * c).toFixed(1)}" x2="${(62 * s).toFixed(1)}" y2="${(62 * c).toFixed(1)}"></line>`;
    if (a % 30 === 0) rose += `<text x="${(74 * s).toFixed(1)}" y="${(74 * c + 3).toFixed(1)}">${hgPad(a)}</text>`;
  }
  return rose;
}

/* ------------------------------------------------------------
   STATICKÝ REŽIM
   Lietadlo stojí na mieste, niekde na Slovensku je bod. Napíšeš
   kurz, ktorý na bod vedie; lietadlo sa naň natočí a ukáže sa,
   či to sedí. Kurzy sú len násobky 5 (230, 235…), nikdy 232.
   ĽAHKÁ: uzná sa aj susedný kurz (±5°). HARDCORE: len presný kurz.
   ------------------------------------------------------------ */
const HS = {};
/* Správny kurz je VŽDY násobok 5: najprv sa vyžrebuje kurz (005…360),
   potom vzdialenosť, a bod sa položí presne v tom smere od lietadla. */
function hsNew() {
  for (let i = 0; i < 2000; i++) {
    const ax = 60 + Math.random() * 880, ay = 40 + Math.random() * 450;
    if (!hgInside(ax, ay)) continue;
    const brg = 5 * (1 + Math.floor(Math.random() * 72)), d = 160 + Math.random() * 380, a = brg * Math.PI / 180;
    const tx = ax + Math.sin(a) * d, ty = ay - Math.cos(a) * d;
    if (tx < 30 || ty < 25 || tx > 970 || ty > 510 || !hgInside(tx, ty)) continue;
    Object.assign(HS, { ax, ay, tx, ty, brg, done: false });
    return;
  }
  Object.assign(HS, { ax: 300, ay: 300, tx: 600, ty: 300, brg: 90, done: false });
}
function hsRender(card) {

  hsNew();
  document.getElementById('qnum').textContent = state.correct + state.wrong + 1;

  card.innerHTML = `
    <div class="qmeta">HRA NA KURZY <span class="sep">·</span> STATICKÝ REŽIM <span class="sep">·</span> ${hard ? 'HARDCORE' : 'ĽAHKÁ'}</div>
    <div class="map-wrap"><svg viewBox="0 0 ${P.w} ${P.h.toFixed(0)}" xmlns="http://www.w3.org/2000/svg" id="map-svg">
      <rect x="0" y="0" width="${P.w}" height="${P.h.toFixed(0)}" fill="#fbfdfc"></rect>
      <path d="${mapBaseParts().firPath}" fill="#eef6f0" stroke="var(--border-bright)" stroke-width="1.5"></path>
      ${mapBaseParts().cities}
      <g id="hs-lines"></g>
      <circle class="hg-zone" cx="${HS.tx.toFixed(1)}" cy="${HS.ty.toFixed(1)}" r="13"></circle>
      <circle class="hg-post" cx="${HS.tx.toFixed(1)}" cy="${HS.ty.toFixed(1)}" r="6"></circle>
      <g id="hg-ac" transform="translate(${HS.ax.toFixed(1)},${HS.ay.toFixed(1)})">
        <g class="hg-rose" style="${F.hgRose === 'on' ? '' : 'display:none'}"><circle r="62"></circle>${hgRoseSVG()}</g>
        <g id="hg-rot" style="transition:transform 0.35s ease"><path class="hg-plane" d="M0,-12 L8,10 L0,5 L-8,10 Z"></path></g>
      </g>
    </svg></div>
    <div class="hg-task"><span>ÚLOHA</span><strong>Aký kurz vedie od lietadla na oranžový bod?</strong></div>
    <div class="input-row">
      <input type="text" id="hg-in" inputmode="numeric" maxlength="3" placeholder="KURZ PO 5° (napr. 245)" autocomplete="off">
      <button class="btn" id="hg-go">POTVRDIŤ ▶</button>
    </div>
    <div class="hg-msg" id="hg-msg">${hard ? 'HARDCORE: napíš kurz po 5°. Uzná sa len presný kurz.' : 'Napíš kurz po 5°. Uzná sa aj kurz o 5° vedľa.'}</div>
    <div class="hg-hdgs" id="hs-res" style="display:none">
      <div><span>TVOJ KURZ</span><b id="hs-you" class="set">—</b></div>
      <div><span>SPRÁVNY KURZ</span><b id="hs-true">—</b></div>
    </div>
    <div class="hg-btns"><button class="btn" id="hs-next" style="display:none">ĎALŠÍ ▶</button></div>
  `;
  HG.built = true;
  const inp = document.getElementById('hg-in');
  inp.focus();
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); if (HS.done) hsRender(card); else hsAnswer(); } });
  document.getElementById('hg-go').onclick = hsAnswer;
  document.getElementById('hs-next').onclick = () => hsRender(card);
}
function hsAnswer() {
  if (HS.done) return;
  const F = state.filters, hard = F.hgDiff === 'hard';
  const inp = document.getElementById('hg-in'), raw = inp.value.trim(), n = Number(raw);
  if (!raw) return;
  if (!/^\d{1,3}$/.test(raw) || n > 360) { hgMsg(`„${raw}“ nie je kurz. Zadaj číslo 001 až 360.`, 'no'); inp.value = ''; return; }
  if (n % 5 !== 0) { hgMsg(`${hgPad(n)} nie je po 5°. Skús ${hgPad(Math.floor(n / 5) * 5)} alebo ${hgPad(Math.ceil(n / 5) * 5)}.`, 'no'); inp.value = ''; return; }
  const you = hgNorm(n), err = Math.abs(hgDiff(you, HS.brg)), ok = err <= HS_TOL[F.hgDiff] + 0.5;
  HS.done = true;
  if (ok) { state.correct++; state.streak++; if (state.streak > state.bestStreak) state.bestStreak = state.streak; }
  else { state.wrong++; state.streak = 0; }
  renderStats();
  /* lietadlo sa natočí na zadaný kurz; plná čiara = tvoj kurz, prerušovaná = správny */
  document.getElementById('hg-rot').setAttribute('transform', `rotate(${you})`);
  const L = 1200, a = you * Math.PI / 180;
  document.getElementById('hs-lines').innerHTML =
    `<line class="hs-true" x1="${HS.ax.toFixed(1)}" y1="${HS.ay.toFixed(1)}" x2="${HS.tx.toFixed(1)}" y2="${HS.ty.toFixed(1)}"></line>
     <line class="hs-you ${ok ? 'ok' : 'no'}" x1="${HS.ax.toFixed(1)}" y1="${HS.ay.toFixed(1)}" x2="${(HS.ax + Math.sin(a) * L).toFixed(1)}" y2="${(HS.ay - Math.cos(a) * L).toFixed(1)}"></line>`;
  document.getElementById('hs-res').style.display = '';
  document.getElementById('hs-you').textContent = hgPad(you);
  document.getElementById('hs-true').textContent = hgPad(HS.brg);
  const e = Math.round(err);
  hgMsg(ok ? `✓ SPRÁVNE — ${e === 0 ? 'presne na bod' : 'vedľa len o ' + e + '°'}. Enter = ďalší.`
           : `✗ ZLE — si vedľa o ${e}°. Správny kurz je ${hgPad(HS.brg)}. Enter = ďalší.`, ok ? 'ok' : 'no');
  inp.value = '';
  document.getElementById('hs-next').style.display = '';
  document.getElementById('hg-go').disabled = true;
}

function hgMsg(t, cls) {
  const el = document.getElementById('hg-msg');
  if (el) { el.textContent = t; el.className = 'hg-msg ' + (cls || ''); }
}
function hgCommand() {
  const inp = document.getElementById('hg-in');
  const raw = inp.value.trim();
  inp.value = '';
  if (!raw) { if (!HG.run) hgRun(); return; }
  const n = Number(raw);
  if (!/^\d{1,3}$/.test(raw) || n > 360) { hgMsg(`„${raw}“ nie je kurz. Zadaj číslo 005 až 360.`, 'no'); return; }
  if (n % 5 !== 0) { hgMsg(`${hgPad(n)} nie je po 5°. Skús ${hgPad(Math.floor(n / 5) * 5)} alebo ${hgPad(Math.ceil(n / 5) * 5)}.`, 'no'); return; }
  HG.set = hgNorm(n);
  HG.delay = HG_DELAY;
  HG.cmds++;
  const d = hgDiff(HG.hdg, HG.set);
  hgMsg(Math.abs(d) < 1 ? `Kurz ${hgPad(HG.set)} — letíš ním.` : `Točím ${d > 0 ? 'doprava' : 'doľava'} na kurz ${hgPad(HG.set)} (o ${Math.abs(Math.round(d))}°).`, 'ok');
  if (!HG.run) hgRun();
}
function hgRun() {
  if (HG.run || !HG.built) return;
  HG.run = true; HG.last = 0;
  const b = document.getElementById('hg-pause'); if (b) b.textContent = '⏸ PAUZA';
  HG.raf = requestAnimationFrame(hgTick);
}
function hgPause() {
  HG.run = false; cancelAnimationFrame(HG.raf);
  const b = document.getElementById('hg-pause'); if (b) b.textContent = '▶ POKRAČOVAŤ';
}
function hgTick(ts) {
  if (!HG.run) return;
  /* panel zmizol (iný modul) — slučka sa sama zastaví */
  if (!document.getElementById('hg-ac')) { hgStop(); return; }
  const dt = HG.last ? Math.min(0.1, (ts - HG.last) / 1000) : 0;
  HG.last = ts;
  hgStep(dt);
  hgPaint();
  HG.raf = requestAnimationFrame(hgTick);
}
function hgStep(dt) {
  HG.t += dt;
  /* zatáčka: najprv oneskorenie, potom plynulo kratšou stranou */
  if (HG.delay > 0) HG.delay -= dt;
  else {
    const d = hgDiff(HG.hdg, HG.set), step = HG_TURN * dt;
    HG.hdg = Math.abs(d) <= step ? HG.set : hgNorm(HG.hdg + Math.sign(d) * step);
  }
  const v = HG_SPEED[state.filters.hgDiff] * dt, a = HG.hdg * Math.PI / 180;
  HG.x += Math.sin(a) * v; HG.y -= Math.cos(a) * v;
  if (!HG.trail.length || Math.hypot(HG.x - HG.trail[HG.trail.length - 1][0], HG.y - HG.trail[HG.trail.length - 1][1]) > 6) {
    HG.trail.push([HG.x, HG.y]);
    if (HG.trail.length > 140) HG.trail.shift();
  }
  /* zásah */
  const T = HG.target;
  if (T && Math.hypot(HG.x - T.x, HG.y - T.y) <= T.r) {
    HG.hits++; state.correct++; state.streak++;
    if (state.streak > state.bestStreak) state.bestStreak = state.streak;
    hgMsg(`✓ ${T.name} — zásah. Ďalší cieľ je na mape.`, 'ok');
    hgNewTarget();
    renderStats();
  }
  /* vyletel z mapy: počíta sa ako chyba a lietadlo sa samo otočí späť */
  const P = MAP_PROJ, outside = HG.x < 0 || HG.y < 0 || HG.x > P.w || HG.y > P.h;
  if (outside && !HG.out) {
    HG.out = true; state.wrong++; state.streak = 0;
    HG.set = Math.round(hgBearing(HG.x, HG.y, P.w / 2, P.h / 2) / 5) * 5; HG.delay = 0;
    hgMsg(`✗ Vyletel si z mapy — otáčam späť na kurz ${hgPad(HG.set)}.`, 'no');
    renderStats();
  }
  if (!outside) HG.out = false;
}
function hgPaint() {
  const ac = document.getElementById('hg-ac');
  if (!ac) return;
  ac.setAttribute('transform', `translate(${HG.x.toFixed(1)},${HG.y.toFixed(1)})`);
  document.getElementById('hg-rot').setAttribute('transform', `rotate(${HG.hdg.toFixed(1)})`);
  const sv = document.getElementById('hg-setv');
  sv.setAttribute('transform', `rotate(${HG.set})`);
  sv.style.display = Math.abs(hgDiff(HG.hdg, HG.set)) < 1 ? 'none' : '';
  document.getElementById('hg-trail').setAttribute('points', HG.trail.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' '));
  document.getElementById('hg-cur').textContent = hgPad(HG.hdg);
  document.getElementById('hg-set').textContent = hgPad(HG.set);
  document.getElementById('hg-hits').textContent = HG.hits;
  document.getElementById('hg-cmds').textContent = HG.cmds;
  document.getElementById('hg-avg').textContent = HG.hits ? (HG.cmds / HG.hits).toFixed(1) : '—';
  const s = Math.floor(HG.t);
  document.getElementById('hg-time').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
function hgDrawTarget() {
  const g = document.getElementById('hg-tgt'), T = HG.target, F = state.filters;
  if (!g || !T) return;
  document.getElementById('hg-name').textContent = F.hgKind === 'gate' ? T.name : 'PRELEŤ NAD: ' + T.name;
  document.querySelectorAll('.hg-pl.on').forEach(el => el.classList.remove('on'));
  if (F.hgKind === 'gate') {
    const a = T.ang * Math.PI / 180, dx = Math.sin(a) * T.r, dy = -Math.cos(a) * T.r;
    g.innerHTML = `<circle class="hg-zone" cx="${T.x.toFixed(1)}" cy="${T.y.toFixed(1)}" r="${T.r}"></circle>
      <line class="hg-gate" x1="${(T.x - dx).toFixed(1)}" y1="${(T.y - dy).toFixed(1)}" x2="${(T.x + dx).toFixed(1)}" y2="${(T.y + dy).toFixed(1)}"></line>
      <circle class="hg-post" cx="${(T.x - dx).toFixed(1)}" cy="${(T.y - dy).toFixed(1)}" r="5"></circle>
      <circle class="hg-post" cx="${(T.x + dx).toFixed(1)}" cy="${(T.y + dy).toFixed(1)}" r="5"></circle>`;
  } else if (F.hgNames === 'on') {
    /* s názvami na mape sa cieľ zvýrazní; bez názvov ho musíš nájsť sám */
    g.innerHTML = `<circle class="hg-zone" cx="${T.x.toFixed(1)}" cy="${T.y.toFixed(1)}" r="${T.r}"></circle>`;
    const el = [...document.querySelectorAll('.hg-pl')].find(x => x.dataset.n === T.name);
    if (el) el.classList.add('on');
  } else g.innerHTML = '';
}

/* uznané zápisy hraníc: „FL285 – FL660", „285-660", „8000 ft AMSL – FL660", „8000 660"… */
function coLimAccept(lim) {
  const part = p => {
    p = p.trim();
    if (/^GND/i.test(p)) return ['gnd', '0', 'sfc', 'zem'];
    const n = p.replace(/[^0-9]/g, '');
    if (/^FL/i.test(p)) return ['fl' + n, n];
    const tail = /AGL/i.test(p) ? 'agl' : /AMSL/i.test(p) ? 'amsl' : '';
    return [n + 'ft' + tail, n + 'ft', n + tail, n].filter((v, i, a) => a.indexOf(v) === i);
  };
  const ab = lim.split('–'), out = [];
  part(ab[0]).forEach(a => part(ab[1]).forEach(b => out.push(a + ' ' + b)));
  return out;
}
/* uznané zápisy hladiny: celý text, alebo len čísla hladín („FL250", „250", „160 130A") */
function coLvlAccept(txt) {
  const out = [txt];
  const fl = txt.match(/FL\d+(?:\/\d+)?[AB]?/g) || [];
  if (fl.length) { out.push(fl.join(' ')); out.push(fl.join(' ').replace(/FL/g, '')); }
  const w = txt.split(' ')[0];
  if (/^(eastbound|westbound)/.test(txt)) { out.push(w); out.push(w.replace('bound', '')); }
  if (/^(descending|climbing)/.test(txt) && fl.length === 1) { out.push(w + ' ' + fl[0].replace('FL', '')); }
  return out;
}

function buildCoordQuestions() {
  const F = state.filters, m = F.coMode;
  let list = [];
  const Q = (sub, id, o) => list.push(Object.assign({ type: 'coord', sub, id: 'CO_' + id, exact: true }, o));
  if (m === 'cop') {
    Object.keys(CO_COP).filter(c => coNbOk(CO_COP[c])).forEach(c => {
      const nb = CO_COP[c];
      Q('p2n', 'P2N_' + c, { cop: c, nb, correct: CO_NB[nb].short, exact: false,
        pool: Object.keys(CO_NB).filter(k => k !== 'BA' && k !== nb).map(k => CO_NB[k].short),
        accept: [CO_NB[nb].short].concat(CO_NB_ALT[nb]), label: c + '→sused' });
      Q('click', 'CLK_' + c, { cop: c, nb, accept: [c], label: c + '→mapa' });
    });
  } else if (m === 'freq') {
    const us = CO_UNITS.filter(u => u.f), all = us.map(u => u.f);
    us.filter(u => coNbOk(u.g)).forEach(u => {
      const near = all.filter(f => f !== u.f && f !== u.alt).sort((a, b) => Math.abs(parseFloat(a.replace(',', '.')) - parseFloat(u.f.replace(',', '.'))) - Math.abs(parseFloat(b.replace(',', '.')) - parseFloat(u.f.replace(',', '.'))));
      Q('u2f', 'U2F_' + u.n, { unit: u, correct: u.f + ' MHz', pool: near.map(f => f + ' MHz'), accept: coFreqAccept(u), label: u.n + '→' + u.f });
      Q('f2u', 'F2U_' + u.n, { unit: u, correct: u.n, exact: false,
        pool: us.filter(x => x.n !== u.n).sort((a, b) => (a.g === u.g ? 0 : 1) - (b.g === u.g ? 0 : 1)).map(x => x.n), accept: [u.n], label: u.f + '→' + u.n });
    });
  } else if (m === 'vert') {
    CO_UNITS.filter(u => coNbOk(u.g)).forEach(u => {
      const pool = CO_UNITS.filter(x => x.lim !== u.lim).sort((a, b) => (a.g === u.g ? 0 : 1) - (b.g === u.g ? 0 : 1)).map(x => x.lim).filter((v, i, a) => a.indexOf(v) === i);
      Q('u2v', 'U2V_' + u.n, { unit: u, correct: u.lim, pool, accept: coLimAccept(u.lim), label: u.n + '→hranice' });
    });
  } else if (m === 'level') {
    const allLv = [], allCond = [];
    CO_TABLES.forEach(t => t.rows.forEach(r => { if (allLv.indexOf(r[3]) < 0) allLv.push(r[3]); if (r[4] && allCond.indexOf(r[4]) < 0) allCond.push(r[4]); }));
    const seen = {};
    CO_TABLES.filter(t => coNbOk(t.nb)).forEach(t => t.rows.forEach((r, i) => {
      const key = coScenario(t, r), same = t.rows.filter(x => coScenario(t, x) === key);
      const tableCops = t.rows.map(x => x[2]).filter((v, k, a) => a.indexOf(v) === k);
      if (!seen[key]) {
        seen[key] = 1;
        const ok = same.map(x => x[2]);
        Q('cop', 'COP_' + t.id + '_' + i, { t, r, correct: r[2], exact: false, accept: ok,
          pool: tableCops.filter(c => ok.indexOf(c) < 0).concat(Object.keys(CO_COP).filter(c => tableCops.indexOf(c) < 0)), label: t.id + ' ' + (r[1] || r[0]) + '→COP' });
      }
      const lvlOk = t.rows.filter(x => coScenario(t, x) === key && x[2] === r[2]).map(x => x[3]);
      const tableLv = t.rows.map(x => x[3]).filter(v => lvlOk.indexOf(v) < 0);
      Q('lvl', 'LVL_' + t.id + '_' + i, { t, r, correct: r[3], accept: coLvlAccept(r[3]),
        pool: tableLv.concat(allLv.filter(v => lvlOk.indexOf(v) < 0)).filter((v, k, a) => a.indexOf(v) === k), label: t.id + ' ' + r[2] + ' ' + (r[1] || r[0]) + '→FL' });
      if (r[4]) Q('cond', 'CND_' + t.id + '_' + i, { t, r, correct: r[4], accept: coLvlAccept(r[4]),
        pool: allCond.filter(v => v !== r[4]).concat(['— žiadna —']), label: t.id + ' ' + r[2] + '→podmienka' });
    }));
  }
  if (m === 'scen') CO_TABLES.filter(t => coNbOk(t.nb)).forEach(t => t.rows.forEach((r, i) => {
    if (r[2] !== 'ALL') Q('scen', 'SCN_' + t.id + '_' + i, { t, r, accept: [r[2]], label: t.id + ' scenár · ' + (r[1] || r[0]) });
  }));
  state.apAllIds = list.map(q => q.id);
  state.coNote = '';
  if (F.coWeak) {
    const weak = list.filter(q => state.mistakes[q.id] > 0);
    if (weak.length) list = weak;

  }
  list.forEach(q => { CO_LABEL[q.id] = q.label; });
  return shuffle(list);
}

}

  const distinct = k => { const a = []; CO_TABLES.forEach(x => x.rows.forEach(r => { if (a.indexOf(r[k]) < 0) a.push(r[k]); })); return a.sort(); };
  const optsFor = { cop: distinct(2), lvl: distinct(3), cond: ['— žiadna —'].concat(distinct(4).filter(Boolean)),
    lim: CO_UNITS.map(u => u.lim).filter((v, i, a) => a.indexOf(v) === i).sort(), freq: CO_UNITS.filter(u => u.f).map(u => u.f).sort() };
  let cells = 0, good = 0;
  const cell = (key, correct, kind, altOk) => {
    const v = C.vals[key] || '';
    const ok = C.checked && (coCellOk(v, correct, kind) || (altOk && coCellOk(v, altOk, kind)));
    cells++; if (ok) good++;
    const cls = C.checked ? (ok ? 'ok' : 'fixed') : '';
    const shown = correct || '—';
    if (C.checked) return `<td class="co-in ${cls}">${ok ? shown : `<b>${shown}</b>` + (v && v !== '— žiadna —' ? `<s>${v.replace(/</g, '&lt;')}</s>` : '')}</td>`;
    if (easy) return `<td class="co-in"><select data-k="${key}"><option value=""></option>${optsFor[kind].map(o => `<option ${v === o ? 'selected' : ''}>${o}</option>`).join('')}</select></td>`;
    return `<td class="co-in"><input data-k="${key}" value="${v.replace(/"/g, '&quot;')}" autocomplete="off" spellcheck="false"></td>`;
  };
  let table;
  if (isFreq) {
    table = `<table class="co-table"><thead><tr><th>Sector</th><th>Vertical limits</th><th>Freq. (MHz)</th></tr></thead><tbody>${
      CO_UNITS.map((u, i) => `<tr><td><strong>${u.n}</strong></td>${cell('l' + i, u.lim, 'lim')}${u.f ? cell('f' + i, u.f, 'freq', u.alt) : '<td class="co-na">—</td>'}</tr>`).join('')}</tbody></table>`;
  } else {
    table = `<table class="co-table"><thead><tr><th colspan="2">ATS-Route</th><th>COP</th><th>Level Allocation</th><th>Special Conditions</th></tr></thead><tbody>${
      t.rows.map((r, i) => `<tr><td>${r[0] || ''}</td><td>${r[1] || ''}</td>${cell('c' + i, r[2], 'cop')}${cell('v' + i, r[3], 'lvl')}${cell('s' + i, r[4], 'cond')}</tr>`).join('')}</tbody></table>`;
  }
  card.innerHTML = `
    <div class="qmeta">KOORDINÁCIA <span class="sep">·</span> DOPLŇOVAČKA <span class="sep">·</span> ${isFreq ? 'APPENDIX 1 — SECTORISATION' : t.id}</div>
    <div class="map-prompt"><span class="mp-label">${isFreq ? 'Doplň vertikálne hranice a frekvencie' : t.title}</span>
      <div class="mp-sub">${C.checked ? `${good} z ${cells} políčok správne — nesprávne sú doplnené červeným` : (easy ? 'ĽAHKÁ: vyber z ponuky' : 'HARDCORE: píš presne; pri hladine stačí aj „FL250" alebo „eastbound"') + ' · prázdna podmienka = nechaj prázdne'}</div></div>
    <div class="co-fill">${table}</div>
    <div class="blind-actions"><button class="btn" id="co-check" ${C.checked ? 'disabled' : ''}>VYHODNOTIŤ</button><button class="btn ghost" id="co-clear">${C.checked ? 'SKÚSIŤ ZNOVA' : 'VYMAZAŤ'}</button></div>`;
  card.querySelectorAll('[data-k]').forEach(el => { const f = () => { C.vals[el.dataset.k] = el.value; }; el.oninput = f; el.onchange = f; });
  document.getElementById('co-check').onclick = () => { C.checked = true; renderQuestion(); state.correct += 0; };
  document.getElementById('co-clear').onclick = () => { state.coFill = null; renderQuestion(); };
  if (C.checked) { state.correct = good; state.wrong = cells - good; renderStats(); }
}

/* ============================================================
   OPAKOVANIE CEZ DNI · DNEŠNÝ TRÉNING · SKÚŠKA · PREHĽAD · HĽADANIE
   ------------------------------------------------------------
   Každá otázka má „priečinok" (0–5) a deň, kedy má prísť znova.
   Správna odpoveď ju posunie o priečinok ďalej (1, 3, 7, 14, 30 dní),
   nesprávna ju vráti na začiatok a príde hneď zajtra. Z toho sa
   skladá DNEŠNÝ TRÉNING naprieč všetkými modulmi.
   ============================================================ */
const SR_DAYS = [1, 3, 7, 14, 30];
function dayNow() { const d = new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000); }
function srUpdate(id, ok) {
  const r = state.sr[id] || { b: 0, due: 0 };
  if (ok) { r.due = dayNow() + SR_DAYS[Math.min(r.b, SR_DAYS.length - 1)]; r.b = Math.min(r.b + 1, SR_DAYS.length); }
  else { r.b = 0; r.due = dayNow() + 1; }
  state.sr[id] = r;
}
function modOfId(id) {
  const p = id.substring(0, 3);
  return { AC_: 'aircraft', AP_: 'airport', PX_: 'airport', CS_: 'callsign', WP_: 'waypoint', CO_: 'coord' }[p] || '';
}
const MOD_NAME = { aircraft: 'MOD 01 · Typy lietadiel', airport: 'MOD 02 · Letiská', callsign: 'MOD 03 · Volacie znaky', waypoint: 'MOD 04 · Body FRA', heading: 'MOD 05 · Hra na kurzy', coord: 'MOD 06 · Koordinácia' };

/* dočasne prepne filtre, zavolá staviteľa otázok a vráti všetko späť */
function withFilters(tmp, fn) {
  const F = state.filters, old = {}, keep = { ids: state.apAllIds, a: state.apNote, c: state.csNote, o: state.coNote };
  Object.keys(tmp).forEach(k => { old[k] = F[k]; F[k] = tmp[k]; });
  try { return fn(); }
  finally { Object.keys(old).forEach(k => { F[k] = old[k]; }); state.apAllIds = keep.ids; state.apNote = keep.a; state.csNote = keep.c; state.coNote = keep.o; }
}
/* všetky otázky všetkých modulov — základ pre tréning, skúšku a prehľad */
let POOL = null;
function poolAll() {
  if (POOL) return POOL;
  const P = {};
  P.aircraft = withFilters({ wake: 'all', acMode: 'id' }, buildAircraftQuestions);
  P.airport = withFilters({ airportCat: 'all', apMode: 'quiz', apWeak: false }, buildAirportQuestions)
    .concat(withFilters({ apMode: 'prefix', apPx: 'doc', apWeak: false }, buildAirportQuestions));
  /* z volačiek len tie zo simulátora — zvyšných 950 by tréning zahltilo */
  P.callsign = withFilters({ callsignCat: 'top', csLetter: 'all', csKind: 'all', csPack: 0, csDir: 'both', csWeak: false, csOrder: 'rand' }, buildCallsignQuestions);
  P.waypoint = withFilters({ wpMode: 'quiz', wpBorder: 'all', wpGrp: 'all' }, buildWaypointQuestions);
  P.coord = [];
  ['cop', 'freq', 'vert', 'level'].forEach(m => { P.coord = P.coord.concat(withFilters({ coMode: m, coNb: 'all', coWeak: false }, buildCoordQuestions)); });
  P.coord = P.coord.filter(q => q.sub !== 'click');
  return (POOL = P);
}
function poolById() {
  const P = poolAll(), by = {};
  Object.keys(P).forEach(m => P[m].forEach(q => { if (!by[q.id]) by[q.id] = q; }));
  return by;
}
function modProgress(m) {
  const P = poolAll()[m] || [], seen = {}, today = dayNow();
  let total = 0, done = 0, weak = 0, due = 0;
  P.forEach(q => {
    if (seen[q.id]) return; seen[q.id] = 1; total++;
    const r = state.sr[q.id];
    if (r && r.b >= 2) done++;
    if (r && r.due <= today) due++;
    if (state.mistakes[q.id] > 0) weak++;
  });
  return { total, done, weak, due };
}
/* v tréningu a skúške rozhoduje jedna spoločná obtiažnosť, inak nastavenie modulu */
function wantsChoice(q) {
  const F = state.filters;
  if (state.mode === 'daily' || state.mode === 'exam') return F.dAns === 'choice' && q.type !== 'waypoint';
  return (q.type === 'coord' && F.coAns === 'choice') || (q.type === 'aircraft' && F.acAns === 'choice') ||
    ((q.type === 'airport' || q.type === 'prefix') && F.apAns === 'choice') || (q.type === 'callsign' && F.csAns === 'choice');
}

/* ---------- DNEŠNÝ TRÉNING ---------- */
function buildDaily() {
  const P = poolAll(), by = poolById(), today = dayNow(), N = state.filters.dCount;
  const due = Object.keys(state.sr).filter(id => by[id] && state.sr[id].due <= today).sort((a, b) => state.sr[a].due - state.sr[b].due).map(id => by[id]);
  const weak = Object.keys(state.mistakes).filter(id => by[id] && state.mistakes[id] > 0 && due.indexOf(by[id]) < 0).map(id => by[id]);
  /* najviac 70 % tvorí opakovanie, zvyšok je nová látka — inak by si sa nikdy nepohol ďalej */
  let list = due.concat(shuffle(weak)).slice(0, Math.ceil(N * 0.7));
  const fresh = {};
  ['callsign', 'airport', 'coord', 'waypoint', 'aircraft'].forEach(m => {
    let f = shuffle(P[m].filter(q => !state.sr[q.id] && list.indexOf(q) < 0));
    if (m === 'callsign') f.sort((a, b) => (b.data.freq || 1) - (a.data.freq || 1));   // najčastejšie volačky ako prvé
    fresh[m] = f;
  });
  const used = {}; list.forEach(q => { used[q.id] = 1; });
  for (let guard = 0; list.length < N && guard < 400; guard++) {
    const m = ['callsign', 'airport', 'coord', 'waypoint', 'aircraft'][guard % 5], q = fresh[m].shift();
    if (q && !used[q.id]) { used[q.id] = 1; list.push(q); }
  }
  state.dailyInfo = { due: due.length, weak: weak.length, fresh: list.length - Math.min(list.length, due.length + weak.length) };
  return shuffle(list);
}
function startCustom(list, mode) {
  examStop();
  if (typeof hgStop === 'function') hgStop();
  state.mode = mode || 'daily';
  state.queue = shuffle(list); state.index = 0; state.total = state.queue.length;
  state.correct = 0; state.wrong = 0; state.streak = 0; state.bestStreak = 0;
  state.current = state.queue[0] || null;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.mode === state.mode));
  renderFilters(); renderStats(); renderQuestion();
  window.scrollTo(0, 0);
}

/* ---------- SKÚŠKA: na čas, bez nápovedí, vyhodnotenie až na konci ---------- */
function examStop() {
  if (state.exam && state.exam.iv) clearInterval(state.exam.iv);
  state.exam = null;
  document.body.classList.remove('exam-on');
}
function examBuild() {
  const P = poolAll(), N = state.filters.exN, src = {};
  ['aircraft', 'airport', 'callsign', 'coord'].forEach(m => { src[m] = shuffle(P[m]); });
  const list = [], used = {};
  for (let g = 0; list.length < N && g < 1000; g++) {
    const q = src[['callsign', 'airport', 'coord', 'aircraft'][g % 4]].shift();
    if (q && !used[q.id]) { used[q.id] = 1; list.push(q); }
  }
  return shuffle(list);
}
function examStart() {
  examStop();
  state.queue = examBuild(); state.index = 0; state.total = state.queue.length;
  state.correct = 0; state.wrong = 0; state.streak = 0; state.bestStreak = 0;
  state.current = state.queue[0] || null;

  window.scrollTo(0, 0);
}
function examTick() {
  const E = state.exam;

  if (left <= 0 && state.current) { E.timeout = true; state.index = state.queue.length; state.current = null; renderQuestion(); }
}

}
function examAnswerOf(q) { return q.type === 'aircraft' ? q.data.icao + ' — ' + q.data.name : String(q.correct || q.accept[0]); }
function examAsk(q) {

function searchAll(text) {
  const n = normalize(text);
  if (n.length < 2) return '';
  const hit = s => normalize(String(s || '')).indexOf(n) >= 0, out = [];
  const card = (tag, title, body) => `<div><em>${tag}</em><strong>${title}</strong>${body}</div>`;
  AIRCRAFT.filter(a => hit(a.icao) || hit(a.name)).slice(0, 6).forEach(a => out.push(card('MOD 01 · LIETADLO', a.icao + ' — ' + a.name, `WTC ${a.wake} · ${a.engines} · cruise ${a.cruise} · ${a.role}`)));
  AIRPORTS.filter(a => hit(a.icao) || hit(a.city) || hit(a.name)).slice(0, 8).forEach(a => out.push(card('MOD 02 · LETISKO', a.icao + ' — ' + a.city, `${a.name} · ${a.country}`)));
  pxAll().filter(s => normalize(s.p) === n || hit(pxShort(s))).slice(0, 4).forEach(s => out.push(card('MOD 02 · PREFIX', s.p + ' — ' + pxShort(s), 'Oblasť ' + s.p.charAt(0) + ': ' + icaoAreaName(s.p.charAt(0)))));
  CALLSIGNS.filter(c => hit(c.icao) || hit(c.call) || hit(c.airline)).sort((a, b) => b.freq - a.freq).slice(0, 10).forEach(c => out.push(card('MOD 03 · VOLAČKA', c.icao + ' — "' + c.call + '"', (c.airline ? c.airline + ' · ' + c.country : 'prevádzkovateľ neuvedený') + (c.sim ? ' · na simulátore ' + c.freq + '×' : ''))));
  WAYPOINTS.filter(w => hit(w.name)).slice(0, 6).forEach(w => {
    const nb = CO_COP[w.name];
    const rules = nb ? CO_TABLES.filter(t => t.rows.some(r => r[2] === w.name)).map(t => t.rows.filter(r => r[2] === w.name).map(r => `<li>${t.id} · ${r[0] || ''} ${r[1] || ''} → <b>${r[3]}</b>${r[4] ? ' (' + r[4] + ')' : ''}</li>`).join('')).join('') : '';
    out.push(card('MOD 04 · BOD', w.name, `sektor ${SECTOR_NAMES[w.sec]} · ${fmtLat(w.lat)} ${fmtLon(w.lon)}` + (nb ? `<br>koordinačný bod — ${CO_NB[nb].short}<ul>${rules}</ul>` : '')));
  });
  CO_UNITS.filter(u => hit(u.n) || hit(u.f) || hit(u.alt)).slice(0, 8).forEach(u => out.push(card('MOD 06 · STANOVIŠTE', u.n + (u.f ? ' — ' + u.f + ' MHz' : ''), u.lim + ' · ' + CO_NB[u.g].name)));
  return out.length ? `<div class="home-tips search">${out.join('')}</div>` : '<div class="weak-empty" style="padding:10px 2px">— nič som nenašiel —</div>';
}

/* ============================================================

   zatáčka o X stupňov a ktorým smerom je zatáčka kratšia. Každá

const HC = {};
function hcNew() {

    if (big) ticks += `<text x="${(150 + 136 * s).toFixed(1)}" y="${(150 + 136 * c + 4).toFixed(1)}">${hgPad(a)}</text>`;
  }
  const arrow = (h, cls) => `<g transform="rotate(${h} 150 150)" class="${cls}"><line x1="150" y1="150" x2="150" y2="52"></line><path d="M150,40 L158,58 L142,58 Z"></path></g>`;

    <circle cx="150" cy="150" r="122" class="hc-ring"></circle><g class="hc-ticks">${ticks}</g>

}
function hcTexts() {

function hcAnswer(val) {

/* ============================================================
   MOD 06 — SCENÁR
   Jeden let od začiatku do odovzdania: bod → hladina → podmienka →
   stanovište a frekvencia. Stanovište sa určuje z tabuľky vertikálnych
   hraníc podľa hladiny, v ktorej let hranicu preletí.
   ============================================================ */
function coLimRange(lim) {
  const v = p => { p = p.trim(); if (/^GND/i.test(p)) return 0; const n = parseInt(p.replace(/\D/g, ''), 10); return /^FL/i.test(p) ? n : n / 100; };

}

  else if (/^westbound/.test(r[3])) fl = [320, 340, 360, 380][Math.floor(Math.random() * 4)];

  const sameKey = t.rows.filter(x => coScenario(t, x) === coScenario(t, r));
  steps.push({ k: 'BOD', ask: 'Cez ktorý koordinačný bod (COP) tento let pôjde?', correct: r[2], accept: sameKey.map(x => x[2]),
    pool: tableCops.filter(c => c !== r[2] && c !== 'ALL').concat(Object.keys(CO_COP).filter(c => tableCops.indexOf(c) < 0)), ph: 'BOD (5 PÍSMEN)...' });
  const allLv = [], allCond = [];
  CO_TABLES.forEach(x => x.rows.forEach(y => { if (allLv.indexOf(y[3]) < 0) allLv.push(y[3]); if (y[4] && allCond.indexOf(y[4]) < 0) allCond.push(y[4]); }));
  steps.push({ k: 'HLADINA', ask: `Aká je Level Allocation na bode ${r[2]}?`, correct: r[3], accept: coLvlAccept(r[3]),
    pool: t.rows.map(x => x[3]).concat(allLv).filter((v, i, a) => v !== r[3] && a.indexOf(v) === i), ph: 'HLADINA (napr. FL250 / eastbound)...' });
  if (r[4]) steps.push({ k: 'PODMIENKA', ask: 'Aká je Special Condition?', correct: r[4], accept: coLvlAccept(r[4]), pool: allCond.filter(v => v !== r[4]).concat(['— žiadna —']), ph: 'PODMIENKA...' });
  if (S.unit) {
    const lab = u => u.n + ' — ' + u.f + ' MHz', g = S.unit.g;

/* ============================================================

function buildAircraftQuestions() {

  if (state.filters.wake !== 'all') pool = pool.filter(a => a.wake === state.filters.wake);
