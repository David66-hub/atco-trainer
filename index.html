}
function buildAirportQuestions() {
  const F = state.filters, m = F.apMode;
  let list = [];
  if (m === 'prefix') {
    list = buildPrefixQuestions();
  } else {
    let pool = AIRPORTS;
    if (F.airportCat !== 'all') pool = pool.filter(a => a.cat === F.airportCat);
    /* v režimoch s mapou len letiská, ktoré sa dajú na mape ukázať */
    if (m === 'map' || m === 'click') pool = pool.filter(airportOnMap);
    pool.forEach(ap => {
      if (m === 'click') {
        list.push({ type: 'airport', subtype: 'icao-to-city', click: true, id: 'AP_KI_' + ap.icao, data: ap, accept: [ap.icao] });
        list.push({ type: 'airport', subtype: 'city-to-icao', click: true, id: 'AP_KC_' + ap.icao, data: ap, accept: [ap.icao] });
        return;
      }
      list.push({ type: 'airport', subtype: 'icao-to-city', id: 'AP_I2C_' + ap.icao, data: ap,
        accept: [ap.city] });
      list.push({ type: 'airport', subtype: 'city-to-icao', id: 'AP_C2I_' + ap.icao, data: ap,
        accept: [ap.icao] });
    });
  }
  state.apAllIds = list.map(q => q.id);
  state.apNote = '';
  /* LEN SLABÉ MIESTA: otázky, ktoré máš zapísané ako chybu */
  if (F.apWeak) {
    const weak = list.filter(q => state.mistakes[q.id] > 0);
    if (weak.length) list = weak;
    else { F.apWeak = false; state.apNote = 'V tomto výbere nemáš žiadne slabé miesta — idú všetky otázky.'; }
  }
  return shuffle(list);
}
function buildCallsignQuestions() {
  const F = state.filters, pool = csPool();
  /* jedna otázka na kód a jedna na volačku — duplicity z dokumentu
     sa zlúčia a uzná sa ktorákoľvek platná odpoveď */
  let list = [];
  const seen = {};
  pool.forEach(cs => {
    if (F.csDir !== 'c2i' && !seen['I' + cs.icao]) {
      seen['I' + cs.icao] = 1;
      const g = CS_BY_ICAO[cs.icao];
      list.push({ type: 'callsign', subtype: 'icao-to-call', id: 'CS_I2C_' + cs.icao, data: cs, group: g,
        accept: g.map(c => c.call) });
    }
    if (F.csDir !== 'i2c' && !seen['C' + cs.call]) {
      seen['C' + cs.call] = 1;
      const g = CS_BY_CALL[cs.call];
      list.push({ type: 'callsign', subtype: 'call-to-icao', id: 'CS_C2I_' + cs.icao, data: cs, group: g,
        accept: g.map(c => c.icao) });
    }
  });
  state.apAllIds = list.map(q => q.id);
  state.csNote = '';
  if (F.csWeak) {
    const weak = list.filter(q => state.mistakes[q.id] > 0);
    if (weak.length) list = weak;
    else { F.csWeak = false; state.csNote = 'V tomto výbere nemáš žiadne slabé miesta — idú všetky otázky.'; }
  }
  if (F.csOrder !== 'freq') return shuffle(list);
  /* váha otázky = najvyššia frekvencia v jej skupine; veľmi časté
     volačky (20+ a 60+) sa v cvičení objavia dva- až trikrát */
  list.forEach(q => { q.w = Math.max.apply(null, q.group.map(c => c.freq)); });
  const extra = [];
  list.forEach(q => {
    const n = q.w >= 60 ? 2 : q.w >= 20 ? 1 : 0;
    for (let k = 1; k <= n; k++) extra.push(Object.assign({}, q, { w: q.w / (3 * k), again: true }));
  });
  /* najprv všetko, čo je v tabuľke zo simulátora (vážene podľa počtu),
     až potom zvyšok dokumentu v náhodnom poradí */
  const inSim = q => q.group.some(c => c.sim);
  return csWeightedOrder(list.filter(inSim).concat(extra)).concat(shuffle(list.filter(q => !inSim(q))));
}
/* Volačiek je vyše tisíc a mnohé sa líšia jediným písmenom
   (BEXJET / BEEJET). Tolerancia preklepov preto nesmie uznať odpoveď,
   ktorá je presne INÁ volačka alebo iný kód z dokumentu. */
function callsignClash(val, q) {
  if (q.type !== 'callsign') return false;
  const u = normalize(val);
  if (q.accept.some(a => normalize(a) === u)) return false;
  const map = q.subtype === 'icao-to-call' ? CS_BY_CALL : CS_BY_ICAO;
  return Object.keys(map).some(k => normalize(k) === u);
}

/* ============================================================
   MOD 04 — HRANIČNÉ BODY A SLEPÁ MAPA
   ------------------------------------------------------------
   „Hraničný bod" sa počíta GEOMETRICKY a nie z poľa `type`:
   písmená E/X (Entry/Exit) sú v dátach vyplnené len pri 10 bodoch
   a len na severe a východe — západ a juh ich nemajú vôbec. Filter
   postavený na nich by dal krivý a neúplný výber. Vzdialenosť od
   obrysu FIR je úplná a overiteľná: 42 bodov leží do 2 NM od
   hranice a ďalej je zreteľná medzera.
   ============================================================ */

const WP_BORDER_NM = 2;

/* najkratšia vzdialenosť bodu od HRANY obrysu (nie od vrcholu) */
function wpDistToBoundary(p) {
  const O = FIR_OUTLINE;
  const k = Math.cos(p.lat * Math.PI / 180);
  let best = Infinity;
  for (let i = 0; i < O.length; i++) {
    const a = O[i], b = O[(i + 1) % O.length];
    const ax = (a[0] - p.lon) * 60 * k, ay = (a[1] - p.lat) * 60;
    const bx = (b[0] - p.lon) * 60 * k, by = (b[1] - p.lat) * 60;
    const dx = bx - ax, dy = by - ay, L = dx * dx + dy * dy;
    let t = L ? -((ax * dx + ay * dy) / L) : 0;
    t = Math.max(0, Math.min(1, t));
    best = Math.min(best, Math.hypot(ax + t * dx, ay + t * dy));
  }
  return best;
}

/* výsledok sa počíta raz a drží na bode — mapa sa prekresľuje často */
function wpIsBorder(w) {
  if (w._bd === undefined) w._bd = wpDistToBoundary(w);
  return w._bd <= WP_BORDER_NM;
}

/* Poloha bodu POZDĹŽ hranice, meraná ako prejdená dĺžka obrysu.
   Triedenie podľa azimutu od stredu tu nestačí: FIR je pretiahnutý
   a členitý, takže pri zálivoch dva susedné body dostanú veľmi
   odlišný uhol a číslovanie preskakuje (KEKED → KENIN a pod.). */
function wpArcPos(p) {
  const O = FIR_OUTLINE;
  const k = Math.cos(p.lat * Math.PI / 180);
  let cum = 0, best = Infinity, bestPos = 0;
  for (let i = 0; i < O.length; i++) {
    const a = O[i], b = O[(i + 1) % O.length];
    const ax = (a[0] - p.lon) * 60 * k, ay = (a[1] - p.lat) * 60;
    const bx = (b[0] - p.lon) * 60 * k, by = (b[1] - p.lat) * 60;
    const dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy;
    const segLen = Math.sqrt(L2);
    let t = L2 ? -((ax * dx + ay * dy) / L2) : 0;
    t = Math.max(0, Math.min(1, t));
    const d = Math.hypot(ax + t * dx, ay + t * dy);
    if (d < best) { best = d; bestPos = cum + t * segLen; }
    cum += segLen;
  }
  return { pos: bestPos, total: cum };
}

/* ============================================================
   SLEPÁ MAPA — všetky body naraz, ku každému políčko.
   Cieľom je prejsť hranicu ako celok, nie hádať bod po bode.
   ============================================================ */
function blindPool() {
  const pool = filterBySector(WAYPOINTS).slice();
  if (!pool.length) return pool;
  pool.forEach(w => { if (w._arc === undefined) w._arc = wpArcPos(w).pos; });
  pool.sort((a, b) => a._arc - b._arc);
  if (pool.length < 3) return pool;

  const total = wpArcPos(pool[0]).total;
  /* Medzery medzi susednými bodmi po obvode, vrátane tej cez koniec. */
  const gap = i => (i === pool.length - 1)
    ? (total - pool[i]._arc + pool[0]._arc)
    : (pool[i + 1]._arc - pool[i]._arc);
  let maxI = 0, maxG = 0, steps = [];
  for (let i = 0; i < pool.length; i++) { const g = gap(i); steps.push(g); if (g > maxG) { maxG = g; maxI = i; } }
  const median = steps.slice().sort((a, b) => a - b)[Math.floor(steps.length / 2)];

  /* Sektorový filter vyberá body, ktoré na hranici NIE SÚ súvislé
     (EAST leží v dvoch úsekoch, CENTRAL v troch). Číslovanie preto
     začne za najväčšou medzerou — tá potom padne medzi posledné a prvé
     číslo namiesto doprostred radu. Pri súvislom výbere sa začína na
     severe. Prah 3,5× mediánu: pri 2,5× sa pravidlo zaplo aj pre celú
     FIR a číslovanie začínalo na juhovýchode. */
  let startIdx;
  if (maxG > median * 3.5) startIdx = (maxI + 1) % pool.length;
  else { startIdx = 0; for (let i = 1; i < pool.length; i++) if (pool[i].lat > pool[startIdx].lat) startIdx = i; }
  return pool.slice(startIdx).concat(pool.slice(0, startIdx));
}

function buildBlindSVG(points, answers, checked) {
  const P = MAP_PROJ;
  const { firPath, cities } = mapBaseParts();
  const placed = [];
  const collides = (lx, ly) => placed.some(p => Math.abs(p.x - lx) < 22 && Math.abs(p.y - ly) < 9);
  const out = [];
  points.forEach((c, i) => {
    const x = projX(c.lon), y = projY(c.lat);
    const n = i + 1;
    let cls = 'blind-dot';
    if (checked) cls += (answers[i] || '').trim().toUpperCase() === c.name ? ' ok' : ' no';
    out.push(`<circle class="${cls}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6"></circle>`);
    const tries = [[x+9,y-6],[x+9,y+12],[x-9,y-6],[x-9,y+12],[x,y-12],[x,y+17]];
    let ch = tries[0];
    for (const t of tries) { if (!collides(t[0], t[1])) { ch = t; break; } }
    placed.push({ x: ch[0], y: ch[1] });
    out.push(`<text class="blind-num" x="${ch[0].toFixed(1)}" y="${ch[1].toFixed(1)}">${n}</text>`);
    if (checked)
      out.push(`<text class="blind-ans" x="${ch[0].toFixed(1)}" y="${(ch[1]+10).toFixed(1)}">${c.name}</text>`);
  });
  return `<svg viewBox="0 0 ${P.w} ${P.h.toFixed(0)}" xmlns="http://www.w3.org/2000/svg" id="map-svg">
    <rect x="0" y="0" width="${P.w}" height="${P.h.toFixed(0)}" fill="#fbfdfc"></rect>
    <path d="${firPath}" fill="#eef6f0" stroke="var(--border-bright)" stroke-width="1.5"></path>
    ${cities}${out.join('')}
  </svg>`;
}

function blindCountLabel(filled, total) {
  return `vyplnené ${filled} z ${total} — vyhodnotiť môžeš kedykoľvek, zvyšok sa doplní`;
}

function renderWaypointBlind(card) {
  const pool = blindPool();
  const B = state.blind || (state.blind = { answers: [], checked: false });
  if (B.answers.length !== pool.length) { B.answers = pool.map(() => ''); B.checked = false; }
  document.getElementById('qnum').textContent = '•';
  document.getElementById('qtotal').textContent = pool.length + ' bodov';

  const filled = B.answers.filter(a => a.trim()).length;
  const score = B.checked
    ? pool.reduce((n, w, i) => n + ((B.answers[i] || '').trim().toUpperCase() === w.name ? 1 : 0), 0)
    : 0;

  const inputs = pool.map((w, i) => {
    const v = (B.answers[i] || '').trim();
    const ok = B.checked && v.toUpperCase() === w.name;
    /* Po vyhodnotení sa do políčka doplní SPRÁVNY názov — aj tam, kde
       ostalo prázdne, aj tam, kde bola chyba. Pôvodná odpoveď zostane
       vedľa prečiarknutá, inak by si videl len riešenie a nie svoju chybu. */
    const shown = B.checked ? (ok ? v : w.name) : v;
    const cls = B.checked ? (ok ? 'blind-in ok' : 'blind-in fixed') : 'blind-in';
    const was = (B.checked && !ok && v) ? `<span class="blind-was">${v.toUpperCase().replace(/</g,'&lt;')}</span>` : '';
    return `<div class="blind-cell">
      <span class="blind-n">${i + 1}</span>
      <input class="${cls}" data-bi="${i}" value="${shown.replace(/"/g,'&quot;')}"
             ${B.checked ? 'disabled' : ''} placeholder="${state.filters.wpDiff === 'hard' ? '' : w.name.charAt(0) + '····'}" autocomplete="off" spellcheck="false" maxlength="10">
      ${was}
    </div>`;
  }).join('');

  card.innerHTML = `
    <div class="qmeta">FRA SIGNIFICANT POINTS <span class="sep">·</span> SLEPÁ MAPA — POMENUJ KAŽDÝ BOD</div>
    <div class="map-prompt"><span class="mp-label">${
      B.checked ? `${score} z ${pool.length} správne — zvyšok je nižšie doplnený červeným`
                : blindCountLabel(filled, pool.length)
    }</span></div>
    <div class="map-wrap">${buildBlindSVG(pool, B.answers, B.checked)}</div>
    <div class="blind-grid">${inputs}</div>
    <div class="blind-actions">
      <button class="btn" id="blind-check" ${B.checked || !pool.length ? 'disabled' : ''}>VYHODNOTIŤ</button>
      <button class="btn ghost" id="blind-reset">${B.checked ? 'SKÚSIŤ ZNOVA' : 'VYMAZAŤ'}</button>
    </div>`;

  card.querySelectorAll('[data-bi]').forEach(inp => {
    inp.oninput = () => { B.answers[+inp.dataset.bi] = inp.value; blindRefreshCount(pool.length); };
    inp.onkeydown = e => {
      if (e.key !== 'Enter') return;
      const next = card.querySelector(`[data-bi="${+inp.dataset.bi + 1}"]`);
      if (next) next.focus(); else { const c = document.getElementById('blind-check'); if (c) c.focus(); }
    };
  });
  const chk = document.getElementById('blind-check');
  if (chk) chk.onclick = () => { B.checked = true; renderQuestion(); };
  const rst = document.getElementById('blind-reset');
  if (rst) rst.onclick = () => { state.blind = { answers: pool.map(() => ''), checked: false }; renderQuestion(); };
}

/* Prepočet počítadla bez prekreslenia celej karty — inak by input
   pri každom písmene stratil kurzor. */
function blindRefreshCount(total) {
  const B = state.blind; if (!B) return;
  const filled = B.answers.filter(a => a.trim()).length;
  const lbl = document.querySelector('#qcard .mp-label');
  if (lbl) lbl.textContent = blindCountLabel(filled, total);
}

function filterBySector(pool) {
  /* Filter hraničných bodov je ZÁMERNE tu, a nie v jednotlivých
     režimoch — takto platí naraz pre všetky cvičenia MOD 04. */
  if (state.filters.wpBorder === 'border') pool = pool.filter(wpIsBorder);
  const g = state.filters.wpGrp;
  if (g === 'all' || !g) return pool;
  if (g === 'NAV') return pool.filter(w => w.kind === 'nav');
  // W / C / E sector codes
  return pool.filter(w => w.sec === g);
}
function buildWaypointQuestions() {
  const pool = filterBySector(WAYPOINTS);
  /* 'find' = meno je zadanie a hľadá sa bod, 'name' = bod je zadanie a píše sa meno */
  const sub = state.filters.wpMode === 'name' ? 'name' : 'find';
  return shuffle(pool).map(w => ({ type: 'waypoint', subtype: sub, id: 'WP_' + w.name, data: w, accept: [w.name] }));
}
function buildQueue() {
  switch(state.mode) {
    case 'home':     return [];   // úvod nemá otázky
    case 'daily':    return buildDaily();
    case 'exam':     return [];   // skúšku spúšťa až tlačidlo
    case 'aircraft': return buildAircraftQuestions();
    case 'airport':  return buildAirportQuestions();
    case 'callsign': return buildCallsignQuestions();
    case 'waypoint': return buildWaypointQuestions();
    case 'heading':  return [];   // MOD 05 nemá otázky, beží ako hra
    case 'coord':    return (state.filters.coMode === 'fill' || state.filters.coMode === 'study') ? [] : buildCoordQuestions();
  }
}

/* Pick the candidate dots shown for a given target.
   EASY = target + 4 nearest neighbours (5 total).
   HARD = every point currently in the filtered pool. */
function waypointCandidates(target) {
  if (state.filters.wpDiff === 'hard') {
    return filterBySector(WAYPOINTS);
  }
  // easy: nearest 4 by projected distance + target (distractors from full map = realistic)
  const others = WAYPOINTS.filter(w => w.name !== target.name).map(w => {
    const dx = projX(w.lon) - projX(target.lon);
    const dy = projY(w.lat) - projY(target.lat);
    return { w, d: dx*dx + dy*dy };
  }).sort((a,b) => a.d - b.d).slice(0, 4).map(o => o.w);
  return shuffle([target, ...others]);
}

/* ============================================================
   HINT GENERATORS - progressive hints for each question type
   ============================================================ */
function generateHints(q) {
  if (q.type === 'acpair') return [];
  if (q.type === 'coord') return coHints(q);
  if (q.type === 'aircraft') return q.data.hints.slice();
  if (q.type === 'airport') {
    const ap = q.data;
    if (q.subtype === 'icao-to-city') {
      return [
        `Krajina: ${ap.country}`,
        `${ap.hint}`,
        `Začína na "${ap.city.charAt(0)}", ${ap.city.length} písmen.`,
        `Letisko: ${ap.name}`,
      ];
    } else {
      const firstLetter = ap.icao.charAt(0);
      const regionMap = { L: 'južná/stredná Európa', E: 'severná/západná Európa', K: 'USA', U: 'CIS/Ukrajina', O: 'Stredný východ' };
      const region = regionMap[firstLetter] || '';
      return [
        `Krajina: ${ap.country}${region ? ' (' + region + ')' : ''}`,
        `${ap.hint}`,
        `Začína na "${ap.icao.substring(0,2)}".`,
        `Posledné dve: "${ap.icao.substring(2,4)}".`,
      ];
    }
  }
  if (q.type === 'prefix') {
    const st = q.data, L = st.p.charAt(0), nm = pxShort(st);
    if (q.subtype === 'code-to-state') return [
      `1. písmeno ${L} = oblasť: ${icaoAreaName(L)}`,
      `Štát začína na „${nm.charAt(0)}“, ${nm.length} znakov.`,
    ];
    return [
      `Oblasť: ${icaoAreaName(L)}`,
      `Prvé písmeno prefixu: ${L}`,
    ];
  }
  if (q.type === 'callsign') {
    /* Nápovedy idú od najslabšej po najsilnejšiu: krajina → tvar slova →
       prevádzkovateľ → obrázok. Pri volačkách bez údajov z Wikipédie
       ostávajú len nápovedy z písmen. */
    const cs = q.data, out = [];
    const flat = cs.call.replace(/\s/g, '');
    if (cs.country) out.push(`Krajina prevádzkovateľa: ${cs.country}${cs.type ? ' · typ: ' + cs.type : ''}`);
    if (q.subtype === 'icao-to-call') {
      const words = cs.call.split(' ').length;
      out.push(`Volačka má ${words === 1 ? 'jedno slovo' : words + ' slová'}, spolu ${flat.length} písmen.`);
      out.push(cs.logical
        ? `Písmená kódu ${cs.icao} sú vo volačke schované v tomto poradí.`
        : `Kód ${cs.icao} sa vo volačke nenachádza — volačka je iné slovo.`);
      out.push(`Volačka začína na „${cs.call.charAt(0)}“.`);
      if (cs.hint) out.push(cs.hint);
      if (cs.airline) out.push(`Prevádzkovateľ: ${cs.airline}`);
      if (flat.length > 4) out.push(`Prvé tri písmená: „${flat.substring(0, 3)}“.`);
    } else {
      out.push(cs.logical
        ? 'Kód poskladáš z písmen volačky — idú v nej za sebou v tom istom poradí.'
        : 'Kód sa z volačky vyčítať nedá — vychádza z mena prevádzkovateľa.');
      if (cs.hint) out.push(cs.hint);
      if (cs.airline) out.push(`Prevádzkovateľ: ${cs.airline}`);
      out.push(`Kód začína na „${cs.icao.charAt(0)}“.`);
      out.push(`Kód končí na „${cs.icao.charAt(2)}“.`);
    }
    const photo = csPhotoSlot(cs);
    if (photo) out.push('Obrázok prevádzkovateľa:' + photo);
    return out;
  }
  if (q.type === 'waypoint' && q.subtype === 'name') {
    const w = q.data;
    const typeFull = { A:'Príletový', D:'Odletový', E:'Vstupný', I:'Vnútorný', X:'Výstupný' };
    const typeList = (w.type||'').split('').filter(c=>typeFull[c]).map(c=>typeFull[c]).join(', ') || '—';
    const near = nearestPoints(w, 1)[0];
    return [
      `Sektor: ${SECTOR_NAMES[w.sec] || '—'}`,
      `Typ bodu: ${typeList}`,
      `Najbližší bod: ${near ? near.name : '—'}`,
      `Začína na „${w.name.charAt(0)}“, ${w.name.length} písmen.`,
    ];
  }
  return [];
}

/* ============================================================
   PHOTO LOADER - Wikipedia REST API summary endpoint
   Returns the infobox thumbnail (CORS-enabled, stable)
   ============================================================ */
const photoCache = {};
async function loadAircraftPhoto(ac) {
  const box = document.getElementById('ac-photo');
  if (!box) return;
  const setImg = (src) => {
    box.innerHTML = `
      <img src="${src}" alt="aircraft" onerror="this.parentElement.innerHTML='<div class=&quot;photo-loading&quot;>IMAGERY UNAVAILABLE</div>'">
      <div class="photo-corner"><span>▲ INBOUND TRAFFIC</span><span>VIS REC</span></div>
    `;
  };
  if (photoCache[ac.icao]) { setImg(photoCache[ac.icao]); return; }
  try {
    const url = `https://en.wikipedia.org/api/rest_v1/page/summary/${ac.wiki}`;
    const r = await fetch(url, { headers: { 'Accept': 'application/json' } });
    if (!r.ok) throw new Error('http ' + r.status);
    const d = await r.json();
    const src = (d.originalimage && d.originalimage.source) || (d.thumbnail && d.thumbnail.source);
    if (!src) throw new Error('no image in summary');
    photoCache[ac.icao] = src;
    setImg(src);
  } catch (e) {
    box.innerHTML = `<div class="photo-loading">IMAGERY UNAVAILABLE<br><span style="font-size:9px;color:var(--text-faint)">${ac.wiki}</span></div>`;
  }
}

/* ============================================================
   RENDER QUESTION
   ============================================================ */
function renderQuestion() {
  const q = state.current;
  const card = document.getElementById('qcard');
  card.dataset.mode = state.mode;
  document.body.classList.toggle('on-home', state.mode === 'home');
  /* MOD 02 s mapou (aj ŠTÚDIUM): mapa vľavo, text vpravo — všetko na jednej obrazovke */
  const apm = state.filters.apMode;
  const com = state.filters.coMode;
  const split = state.mode === 'waypoint' || (state.mode === 'coord' && (com === 'study' || (!!q && (com === 'cop' || com === 'level' || com === 'scen')))) || state.mode === 'heading' || (state.mode === 'airport' && (apm === 'study' || (!!q && (apm === 'map' || apm === 'click'))));
  card.classList.toggle('split', split);
  document.querySelector('.app').classList.toggle('wide', split);
  fsSync();
  /* MOD 05 — hra na kurzy má vlastnú kartu a vlastnú slučku */
  if (state.mode === 'heading') { document.querySelector('.controls').style.display = ''; renderHeadingGame(card); return; }
  /* na úvode nie je čo nastavovať ani preskakovať */
  document.querySelector('.controls').style.display = state.mode === 'home' ? 'none' : '';
  if (state.mode === 'home') { document.getElementById('mode-label').textContent = 'ÚVOD'; renderHome(card); return; }
  document.body.classList.toggle('exam-on', state.mode === 'exam' && !!state.exam && !!q);
  if (state.mode === 'exam' && !state.exam) { renderExamStart(card); return; }
  if (state.mode === 'exam' && !q) { renderExamResult(card); return; }
  /* MOD 06 — doplňovačka a štúdium nemajú frontu otázok */
  if (state.mode === 'coord' && com === 'fill') { renderCoFill(card); return; }
  if (state.mode === 'coord' && com === 'study') { renderCoStudy(card); return; }
  document.getElementById('qnum').textContent = state.index + 1;
  document.getElementById('qtotal').textContent = state.total;
  document.getElementById('mode-label').textContent =
    state.mode === 'home' ? 'ÚVOD' : state.mode === 'daily' ? 'DNEŠNÝ TRÉNING' : state.mode === 'exam' ? 'SKÚŠKA' :
    state.mode === 'aircraft' ? 'AIRCRAFT TYPE' :
    state.mode === 'airport' ? 'AIRPORTS / ICAO' :
    state.mode === 'callsign' ? 'CALLSIGNS' : state.mode === 'coord' ? 'KOORDINÁCIA / FREKVENCIE' : 'FRA BODY / MAPA';
  state.hintsUsed = 0;

  /* MOD 03 ZOZNAM — čítanie a zakrývanie, bez otázok */
  if (state.mode === 'callsign' && state.filters.csMode === 'list') {
    renderCsList(card);
    return;
  }
  /* MOD 02 ŠTÚDIUM — oblasti ICAO na mape, bez otázok */
  if (state.mode === 'airport' && state.filters.apMode === 'study') {
    renderAirportStudy(card);
    return;
  }
  // STUDY / EXPLORE mode for waypoints — no question, just an interactive map
  if (state.mode === 'waypoint' && state.filters.wpMode === 'study') {
    renderWaypointStudy(card);
    return;
  }
  /* SLEPÁ MAPA — tiež bez fronty otázok: celý výber naraz. */
  if (state.mode === 'waypoint' && state.filters.wpMode === 'blind') {
    renderWaypointBlind(card);
    return;
  }

  if (!q) {
    if (state.mode === 'daily' && state.total) { state.dailyDone = dayNow(); apSaveProgress(); }
    const pct = Math.round((state.correct / Math.max(1,state.total)) * 100);
    card.innerHTML = `
      <div class="session-done">
        <h2>SESSION COMPLETE</h2>
        <p>Správne: ${state.correct} / ${state.total} · Najlepší streak: ${state.bestStreak}</p>
        <div class="score-big">${pct}%</div>
        <p style="margin-top:18px"><button class="btn" id="restart-btn">RESTART ▶</button></p>
      </div>`;
    document.getElementById('restart-btn').onclick = () => startMode(state.mode);
    return;
  }

  let body = '';
  let placeholder = '';

  /* MOD 02 — klik do mapy má vlastnú kartu bez inputu */
  if (q.click) { renderClickQuestion(q, card); return; }
  if (q.type === 'acpair') { renderAcPair(q, card); return; }
  if (q.type === 'coord' && q.sub === 'scen') { renderCoScen(q, card); return; }
  if (q.type === 'coord' && q.sub === 'click') { renderCoClick(q, card); return; }
  if (q.type === 'coord') { const cb = coBody(q); body = cb.body; placeholder = cb.placeholder; }
  /* MOD 03 — kartičky */
  if (q.type === 'callsign' && state.filters.csMode === 'cards') { renderCsCard(q, card); return; }

  if (q.type === 'aircraft') {
    const a = q.data;
    body = `
      <div class="qmeta">IDENT TYPE <span class="sep">·</span> ENTER ICAO TYPE DESIGNATOR <em style="color:var(--text-faint);font-style:normal">(e.g. B738)</em> OR COMMON NAME</div>
      <div class="aircraft-display">
        <div class="aircraft-photo" id="ac-photo">
          <div class="photo-loading">LOADING IMAGERY...</div>
        </div>
        <div class="aircraft-info-side">
          <div class="ac-target">
            <small>QUICK RECOGNITION DATA</small>
            ▼ UNKNOWN TRAFFIC
          </div>
          <div class="ac-row">
            <div class="ac-chip"><strong>WTC</strong>${a.wake}</div>
            <div class="ac-chip"><strong>ENG</strong>${a.enginesCount}</div>
            <div class="ac-chip"><strong>CRS</strong>${a.cruise}</div>
          </div>
          <div class="ac-row">
            <div class="ac-chip"><strong>ROLE</strong>${a.role}</div>
          </div>
        </div>
      </div>`;
    placeholder = 'TYPE DESIGNATOR OR NAME...';
  }

  if (q.type === 'airport') {
    /* režim MAPA: tá istá otázka, ale nad ňou svieti poloha letiska */
    const onMap = state.mode === 'airport' && state.filters.apMode === 'map';
    const map = onMap ? airportMapHTML(q.data) : '';
    const tag = onMap ? 'MAPA <span class="sep">·</span> ' : '';
    if (q.subtype === 'icao-to-city') {
      body = `<div class="qmeta">AIRPORT ID <span class="sep">·</span> ${tag}ICAO → CITY</div>
              ${map}
              <div class="big-prompt${onMap ? ' small' : ''}">${q.data.icao}</div>
              <div class="prompt-hint">— ${onMap ? 'KTORÉ MESTO SVIETI NA MAPE?' : 'WHICH CITY?'} —</div>`;
      placeholder = 'CITY NAME...';
    } else {
      body = `<div class="qmeta">AIRPORT ID <span class="sep">·</span> ${tag}CITY → ICAO</div>
              ${map}
              <div class="big-prompt small">${q.data.city}</div>
              <div class="prompt-hint">— ${apCityNote(q.data) || 'ICAO KÓD?'} —</div>`;
      placeholder = 'ICAO CODE (4 LETTERS)...';
    }
  }

  if (q.type === 'prefix') {
    const st = q.data;
    if (q.subtype === 'code-to-state') {
      body = `<div class="qmeta">ICAO PREFIX <span class="sep">·</span> KÓD → ŠTÁT</div>
              <div class="big-prompt">${st.p}</div>
              <div class="prompt-hint">— KTORÝ ŠTÁT MÁ TENTO PREFIX? —</div>`;
      placeholder = 'ŠTÁT...';
    } else {
      body = `<div class="qmeta">ICAO PREFIX <span class="sep">·</span> ŠTÁT → KÓD</div>
              <div class="big-prompt small">${pxAsk(st)}</div>
              <div class="prompt-hint">— PRVÉ DVE PÍSMENÁ INDIKÁTORA? —</div>`;
      placeholder = 'PREFIX (2 PÍSMENÁ)...';
    }
  }

  if (q.type === 'callsign') {
    if (q.subtype === 'icao-to-call') {
      body = `<div class="qmeta">OPERATOR CALL <span class="sep">·</span> ICAO → TELEPHONY</div>
              <div class="big-prompt">${q.data.icao}</div>
              <div class="prompt-hint">— RADIO CALLSIGN? —</div>`;
      placeholder = 'CALLSIGN (e.g. SPEEDBIRD)...';
    } else {
      body = `<div class="qmeta">OPERATOR CALL <span class="sep">·</span> TELEPHONY → ICAO</div>
              <div class="big-prompt small">"${q.data.call}"</div>
              <div class="prompt-hint">— ICAO 3-LETTER OPERATOR CODE? —</div>`;
      placeholder = 'ICAO 3-LETTER CODE...';
    }
  }

  if (q.type === 'waypoint') {
    if (q.subtype === 'name') renderWaypointNameQuestion(q, card);
    else renderWaypointQuestion(q, card);
    return;
  }

  /* MOD 02 — výber z možností namiesto písania */
  if (wantsChoice(q)) {
    renderChoiceQuestion(q, card, body);
    return;
  }

  card.innerHTML = `
    ${body}
    <div class="hint-row empty" id="hint-row">
      <span class="hint-label">HINT</span>
      <span class="hint-text">— press [?] for a hint —</span>
      <button class="btn-hint" id="btn-hint">? HINT</button>
    </div>
    <div class="input-row">
      <input type="text" id="answer" placeholder="${placeholder}" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <button class="btn" id="submit-btn">SUBMIT ▶</button>
    </div>
    <div class="feedback" id="feedback"></div>
  `;

  if (q.type === 'aircraft') loadAircraftPhoto(q.data);
  apRetryBadge(q);

  const input = document.getElementById('answer');
  input.focus();
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') submitAnswer();
  });
  document.getElementById('submit-btn').onclick = submitAnswer;
  document.getElementById('btn-hint').onclick = useHint;
}

/* ============================================================
   MAP / WAYPOINT QUESTION RENDERER
   ============================================================ */
/* shared map base: border path + city anchors (used by quiz & study renderers) */
function mapBaseParts() {
  const firPath = smoothClosedPath(FIR_OUTLINE.map(([lo,la]) => [projX(lo), projY(la)]));
  const cities = WP_CITIES.map(c => {
    const x = projX(c.lon), y = projY(c.lat);
    return `<g>
      <path class="wp-city" d="M ${x},${y-6} L ${x+5},${y} L ${x},${y+6} L ${x-5},${y} Z"></path>
      <text class="wp-anchor-label" x="${x+9}" y="${y+3}">${c.name}</text>
    </g>`;
  }).join('');
  return { firPath, cities };
}

function buildMapSVG(target, candidates, opts) {
  opts = opts || {};
  const P = MAP_PROJ;
  const { firPath, cities } = mapBaseParts();

  // dots
  let dots = candidates.map(c => {
    const x = projX(c.lon).toFixed(1), y = projY(c.lat).toFixed(1);
    const isNav = c.kind === 'nav';
    if (isNav) {
      // navaid = hexagon marker to show it's a facility, not a fix
      const r = 7;
      const hex = [];
      for (let i=0;i<6;i++){ const a=Math.PI/6 + i*Math.PI/3; hex.push(`${(+x+r*Math.cos(a)).toFixed(1)},${(+y+r*Math.sin(a)).toFixed(1)}`); }
      return `<polygon class="wp-dot nav cand wp-hit" data-name="${c.name}" points="${hex.join(' ')}"></polygon>
              <circle class="wp-hit" data-name="${c.name}" cx="${x}" cy="${y}" r="16" fill="transparent"></circle>`;
    }
    return `<circle class="wp-dot cand wp-hit" data-name="${c.name}" cx="${x}" cy="${y}" r="6"></circle>
            <circle class="wp-hit" data-name="${c.name}" cx="${x}" cy="${y}" r="16" fill="transparent"></circle>`;
  }).join('');

  return `<svg viewBox="0 0 ${P.w} ${P.h.toFixed(0)}" xmlns="http://www.w3.org/2000/svg" id="map-svg">
    <rect x="0" y="0" width="${P.w}" height="${P.h.toFixed(0)}" fill="#fbfdfc"></rect>
    <path d="${firPath}" fill="#eef6f0" stroke="var(--border-bright)" stroke-width="1.5"></path>
    ${cities}
    ${dots}
  </svg>`;
}

/* Catmull-Rom spline through points -> smooth closed SVG path (cubic Béziers).
   Makes the hand-placed border vertices render as soft curves, not straight chords. */
function smoothClosedPath(pts, k) {
  k = (k == null) ? 0.5 : k; // tension
  const n = pts.length;
  if (n < 3) return 'M ' + pts.map(p => p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L ') + ' Z';
  let d = `M ${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i - 1 + n) % n];
    const p1 = pts[i];
    const p2 = pts[(i + 1) % n];
    const p3 = pts[(i + 2) % n];
    const c1x = p1[0] + (p2[0] - p0[0]) * k / 3;
    const c1y = p1[1] + (p2[1] - p0[1]) * k / 3;
    const c2x = p2[0] - (p3[0] - p1[0]) * k / 3;
    const c2y = p2[1] - (p3[1] - p1[1]) * k / 3;
    d += ` C ${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d + ' Z';
}

/* ============================================================
   STUDY / EXPLORE MODE — free interactive map, no scoring
   ============================================================ */
function buildStudySVG(points, selName) {
  const P = MAP_PROJ;
  const { firPath, cities } = mapBaseParts();

  // collision-nudged label placement so names don't pile up
  const placed = [];
  const collides = (lx, ly) => placed.some(p => Math.abs(p.x - lx) < 30 && Math.abs(p.y - ly) < 9);

  const dots = [], labels = [];
  points.forEach(c => {
    const x = projX(c.lon), y = projY(c.lat);
    const xs = x.toFixed(1), ys = y.toFixed(1);
    const sCls = 's-' + (c.sec || 'W');
    const selCls = (c.name === selName) ? ' s-sel' : '';
    if (c.kind === 'nav') {
      const r = 7, hex = [];
      for (let i=0;i<6;i++){ const a=Math.PI/6 + i*Math.PI/3; hex.push(`${(x+r*Math.cos(a)).toFixed(1)},${(y+r*Math.sin(a)).toFixed(1)}`); }
      dots.push(`<polygon class="wp-dot ${sCls}${selCls} wp-hit" data-name="${c.name}" points="${hex.join(' ')}"></polygon>`);
    } else {
      dots.push(`<circle class="wp-dot ${sCls}${selCls} wp-hit" data-name="${c.name}" cx="${xs}" cy="${ys}" r="5"></circle>`);
    }
    dots.push(`<circle class="wp-hit" data-name="${c.name}" cx="${xs}" cy="${ys}" r="14" fill="transparent"></circle>`);
    // place label
    const tries = [[x+8,y-5,'start'],[x+8,y+11,'start'],[x-8,y-5,'end'],[x-8,y+11,'end'],[x,y-11,'middle'],[x,y+16,'middle']];
    let ch = tries[0];
    for (const t of tries) { if (!collides(t[0], t[1])) { ch = t; break; } }
    placed.push({ x: ch[0], y: ch[1] });
    labels.push(`<text class="wp-label-study" x="${ch[0].toFixed(1)}" y="${ch[1].toFixed(1)}" text-anchor="${ch[2]}">${c.name}</text>`);
  });

  return `<svg viewBox="0 0 ${P.w} ${P.h.toFixed(0)}" xmlns="http://www.w3.org/2000/svg" id="map-svg">
    <rect x="0" y="0" width="${P.w}" height="${P.h.toFixed(0)}" fill="#fbfdfc"></rect>
    <path d="${firPath}" fill="#eef6f0" stroke="var(--border-bright)" stroke-width="1.5"></path>
    ${cities}
    ${dots.join('')}
    ${labels.join('')}
  </svg>`;
}

function revealOtherPoints(svg, target, cands, pickedName) {
  const NS = 'http://www.w3.org/2000/svg';
  // Only the OTHER candidates that were on screen for guessing (≈4 in easy mode).
  // The correct one (green) and the wrong pick (red) are already coloured/labelled.
  const others = cands.filter(c => c.name !== target.name && c.name !== pickedName);

  // collision-aware label placement: track occupied boxes (incl. the correct label)
  const placed = [{ x: projX(target.lon)+9, y: projY(target.lat)-8 }];
  const collides = (lx, ly) => placed.some(p => Math.abs(p.x - lx) < 34 && Math.abs(p.y - ly) < 11);

  others.forEach(w => {
    const x = projX(w.lon), y = projY(w.lat);
    // recolour the candidate dot to black so it's clearly "one of the others"
    const d = svg.querySelector('.wp-dot[data-name="'+w.name+'"]');
    if (d) { d.classList.remove('cand'); d.classList.remove('nav'); d.classList.add('other'); }

    // try several offsets so labels stay readable and don't overlap each other
    const tries = [
      [x+9, y-6, 'start'], [x+9, y+12, 'start'],
      [x-9, y-6, 'end'],   [x-9, y+12, 'end'],
      [x, y-12, 'middle'], [x, y+18, 'middle'],
    ];
    let chosen = tries[0];
    for (const t of tries) { if (!collides(t[0], t[1])) { chosen = t; break; } }
    placed.push({ x: chosen[0], y: chosen[1] });

    const t = document.createElementNS(NS,'text');
    t.setAttribute('class','wp-label-other');
    t.setAttribute('x', chosen[0].toFixed(1));
    t.setAttribute('y', chosen[1].toFixed(1));
    t.setAttribute('text-anchor', chosen[2]);
    t.textContent = w.name;
    svg.appendChild(t);
  });
}

function onWaypointPick(pickedName, target, svg, cands) {
  // lock further clicks
  svg.querySelectorAll('.wp-hit').forEach(el => { el.style.pointerEvents = 'none'; el.style.cursor = 'default'; });
  const ok = pickedName === target.name;
  const q = state.current;

  // colour the picked dot
  const pickedDot = svg.querySelector('.wp-dot[data-name="'+pickedName+'"]');
  if (pickedDot) { pickedDot.classList.remove('cand'); pickedDot.classList.add(ok ? 'correct' : 'wrong'); }
  // always highlight correct one + label it
  const correctDot = svg.querySelector('.wp-dot[data-name="'+target.name+'"]');
  if (correctDot) {
    correctDot.classList.remove('cand');
    correctDot.classList.add('reveal-correct');
    const cx = correctDot.getAttribute('cx') || (projX(target.lon).toFixed(1));
    const cy = correctDot.getAttribute('cy') || (projY(target.lat).toFixed(1));
    const lbl = document.createElementNS('http://www.w3.org/2000/svg','text');
    lbl.setAttribute('class','wp-label-reveal');
    lbl.setAttribute('x', (+cx + 9)); lbl.setAttribute('y', (+cy - 8));
    lbl.textContent = target.name;
    svg.appendChild(lbl);
  }
  // reveal every other FRA point in black so the user learns the rest of the map
  revealOtherPoints(svg, target, cands, pickedName);

  // scoring (reuse global counters)
  if (ok) {
    state.correct++; state.streak++;
    if (state.streak > state.bestStreak) state.bestStreak = state.streak;
  } else {
    state.wrong++; state.streak = 0;
    state.mistakes[q.id] = (state.mistakes[q.id] || 0) + 1;
  }
  renderStats(); renderWeak();
  apAfterAnswer(q, ok);

  const fb = document.getElementById('feedback');
  let banner = ok ? `✓ <strong>SPRÁVNE</strong>` : `✗ <strong>ZLE</strong> · klikol si: <span class="answer">${pickedName}</span>`;
  fb.className = 'feedback show ' + (ok ? 'ok' : 'no');
  fb.innerHTML = `

      <span>${banner}</span>
      <button class="btn" id="next-btn">ĎALŠÍ ▶</button>
    </div>
    ${waypointRevealHTML(target)}
  `;

    const nb = document.getElementById('next-btn');
    if (nb) { nb.focus(); nb.onclick = nextQuestion; }
    document.addEventListener('keydown', onEnterNext, { once: true });
  }, 50);
}

/* ============================================================
   MOD 04 — POMENUJ BOD (obrátený kvíz)
   Mapa rozsvieti jeden bod a meno sa píše z hlavy. Opak
   hľadania, kde meno dostaneš a klikáš do mapy.
   ============================================================ */

/* n najbližších bodov k cieľu — merané v projekcii, nie na guli,
   takže to zodpovedá tomu, čo je blízko na obrazovke. */
function nearestPoints(target, n) {
  return WAYPOINTS
    .filter(w => w.name !== target.name)
    .map(w => {
      const dx = projX(w.lon) - projX(target.lon);
      const dy = projY(w.lat) - projY(target.lat);
      return { w, d: dx*dx + dy*dy };
    })
    .sort((a,b) => a.d - b.d)
    .slice(0, n)
    .map(o => o.w);
}

/* Okolie rozsvieteného bodu.
   ĽAHKÁ    = 6 najbližších bodov aj s menami — orientuješ sa podľa toho, čo už vieš
   HARDCORE = celý filtrovaný výber, bez mien */
function nameContext(target) {
  if (state.filters.wpDiff === 'hard') {
    return filterBySector(WAYPOINTS).filter(w => w.name !== target.name);
  }
  return nearestPoints(target, 6);
}

/* Rozmiestňovač menoviek — rovnaký vzor ako v študijnom režime:
   skús šesť pozícií okolo bodu a vezmi prvú, ktorá do ničoho nenarazí. */
function labelPlacer() {
  const placed = [];
  return {
    push(x, y) {
      const tries = [
        [x+8, y-5, 'start'], [x+8, y+11, 'start'],
        [x-8, y-5, 'end'],   [x-8, y+11, 'end'],
        [x, y-11, 'middle'], [x, y+16, 'middle'],
      ];
      let ch = tries[0];
      for (const t of tries) {
        if (!placed.some(pp => Math.abs(pp.x - t[0]) < 32 && Math.abs(pp.y - t[1]) < 10)) { ch = t; break; }
      }
      placed.push({ x: ch[0], y: ch[1] });
      return ch;
    },
    block(x, y) { placed.push({ x, y }); },
  };
}

function hexPoints(x, y, r) {
  const pts = [];
  for (let i = 0; i < 6; i++) { const a = Math.PI/6 + i*Math.PI/3; pts.push(`${(x+r*Math.cos(a)).toFixed(1)},${(y+r*Math.sin(a)).toFixed(1)}`); }
  return pts.join(' ');
}

function buildNameSVG(target, context, showLabels) {
  const P = MAP_PROJ;
  const { firPath, cities } = mapBaseParts();
  const tx = projX(target.lon), ty = projY(target.lat);

  const place = labelPlacer();
  place.block(tx + 9, ty - 8); // miesto pre menovku cieľa po odpovedi

  const dots = [], labels = [];
  context.forEach(c => {
    const x = projX(c.lon), y = projY(c.lat);
    dots.push(c.kind === 'nav'
      ? `<polygon class="wp-dot ctx" data-name="${c.name}" points="${hexPoints(x, y, 5)}"></polygon>`
      : `<circle class="wp-dot ctx" data-name="${c.name}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4"></circle>`);
    if (showLabels) {
      const ch = place.push(x, y);
      labels.push(`<text class="wp-label-ctx" x="${ch[0].toFixed(1)}" y="${ch[1].toFixed(1)}" text-anchor="${ch[2]}">${c.name}</text>`);
    }
  });

  /* rozsvietený cieľ: nitkový kríž, stály prstenec a jeden pulzujúci.
     Pulz je cez SMIL, nie cez CSS — animácia polomeru cez CSS vo Firefoxe
     nefunguje, SMIL áno vo všetkých troch prehliadačoch. */
  const cross = `<path class="wp-cross" d="M ${(tx-32).toFixed(1)},${ty.toFixed(1)} h 17 M ${(tx+15).toFixed(1)},${ty.toFixed(1)} h 17
                    M ${tx.toFixed(1)},${(ty-32).toFixed(1)} v 17 M ${tx.toFixed(1)},${(ty+15).toFixed(1)} v 17"></path>`;
  const rings = `
    <circle class="wp-ring" cx="${tx.toFixed(1)}" cy="${ty.toFixed(1)}" r="12"></circle>
    <circle class="wp-ring" cx="${tx.toFixed(1)}" cy="${ty.toFixed(1)}" r="12">
      <animate attributeName="r" values="11;27" dur="2s" repeatCount="indefinite"></animate>
      <animate attributeName="opacity" values="0.9;0" dur="2s" repeatCount="indefinite"></animate>
    </circle>`;
  const tgt = target.kind === 'nav'
    ? `<polygon id="tgt-dot" class="wp-dot tgt" points="${hexPoints(tx, ty, 8)}"></polygon>`
    : `<circle id="tgt-dot" class="wp-dot tgt" cx="${tx.toFixed(1)}" cy="${ty.toFixed(1)}" r="7"></circle>`;

  return `<svg viewBox="0 0 ${P.w} ${P.h.toFixed(0)}" xmlns="http://www.w3.org/2000/svg" id="map-svg">
    <rect x="0" y="0" width="${P.w}" height="${P.h.toFixed(0)}" fill="#fbfdfc"></rect>
    <path d="${firPath}" fill="#eef6f0" stroke="var(--border-bright)" stroke-width="1.5"></path>
    ${cities}
    ${dots.join('')}
    ${labels.join('')}
    ${cross}
    ${rings}
    ${tgt}
  </svg>`;
}

/* Po odpovedi domenuj okolie, aby si si odniesol aj susedov.
   V ľahkej sú menovky už na mape — len stmavnú. V hardcore je na mape
   celý sektor, tak sa dokreslí len šesť najbližších. */
function labelNeighbours(svg, target) {
  const existing = svg.querySelectorAll('.wp-label-ctx');
  if (existing.length) {
    existing.forEach(el => el.setAttribute('class', 'wp-label-other'));
    return;
  }
  const NS = 'http://www.w3.org/2000/svg';
  const place = labelPlacer();
  place.block(projX(target.lon) + 9, projY(target.lat) - 8);
  nearestPoints(target, 6).forEach(w => {
    const x = projX(w.lon), y = projY(w.lat);
    const ch = place.push(x, y);
    const t = document.createElementNS(NS,'text');
    t.setAttribute('class','wp-label-other');
    t.setAttribute('x', ch[0].toFixed(1));
    t.setAttribute('y', ch[1].toFixed(1));
    t.setAttribute('text-anchor', ch[2]);
    t.textContent = w.name;
    svg.appendChild(t);
  });
}

function submitWaypointName() {
  const input = document.getElementById('answer');
  if (!input || input.disabled) return;
  const val = input.value.trim();
  if (!val) return;

  const q = state.current, target = q.data;
  /* Tolerancia preklepov sa tu zámerne nepoužíva: názvy bodov sa líšia
     aj jedným písmenom (KELEL / KEFIR) a v prevádzke musia sedieť presne. */
  const ok = normalize(val) === normalize(target.name);
  /* ak si napísal iný skutočný bod, oplatí sa to povedať nahlas */
  const other = ok ? null : WAYPOINTS.find(w => normalize(w.name) === normalize(val));

  if (ok) {
    state.correct++; state.streak++;
    if (state.streak > state.bestStreak) state.bestStreak = state.streak;
  } else {
    state.wrong++; state.streak = 0;
    state.mistakes[q.id] = (state.mistakes[q.id] || 0) + 1;
  }
  renderStats(); renderWeak();
  apAfterAnswer(q, ok);

  input.disabled = true;
  const sb = document.getElementById('submit-btn');
  if (sb) { sb.disabled = true; sb.style.opacity = '0.4'; }
  const hb = document.getElementById('btn-hint'); if (hb) hb.disabled = true;

  /* mapa: pulz zhasne, bod sa prefarbí a dostane menovku */
  const svg = document.getElementById('map-svg');
  if (svg) {
    svg.querySelectorAll('.wp-ring').forEach(r => r.remove());
    const dot = svg.querySelector('#tgt-dot');
    if (dot) { dot.classList.remove('tgt'); dot.classList.add(ok ? 'reveal-correct' : 'wrong'); }
    const NS = 'http://www.w3.org/2000/svg';
    const lbl = document.createElementNS(NS,'text');
    lbl.setAttribute('class', ok ? 'wp-label-reveal' : 'wp-label-wrong');
    lbl.setAttribute('x', (projX(target.lon) + 10).toFixed(1));
    lbl.setAttribute('y', (projY(target.lat) - 9).toFixed(1));
    lbl.textContent = target.name;
    svg.appendChild(lbl);
    labelNeighbours(svg, target);
  }

  const typed = val.toUpperCase().replace(/</g, '&lt;');
  let banner;
  if (ok) banner = `✓ <strong>SPRÁVNE</strong>`;
  else if (other) banner = `✗ <strong>ZLE</strong> · ${other.name} je iný bod — tento je ${target.name}.`;
  else banner = `✗ <strong>ZLE</strong> · napísal si: <span class="answer">${typed}</span> — správne: <span class="answer">${target.name}</span>`;

  const fb = document.getElementById('feedback');
  fb.className = 'feedback show ' + (ok ? 'ok' : 'no');
  fb.innerHTML = `
    <div class="feedback-banner">
      <span>${banner}</span>
      <button class="btn" id="next-btn">ĎALŠÍ ▶</button>
    </div>
    ${waypointRevealHTML(target)}
  `;

  setTimeout(() => {
    const nb = document.getElementById('next-btn');
    if (nb) { nb.focus(); nb.onclick = nextQuestion; }
    document.addEventListener('keydown', onEnterNext, { once: true });
  }, 50);
}

function fmtLat(d){ const h=d>=0?'N':'S'; d=Math.abs(d); const deg=Math.floor(d); const m=Math.floor((d-deg)*60); const s=Math.round(((d-deg)*60-m)*60); return `${deg}°${String(m).padStart(2,'0')}'${String(s).padStart(2,'0')}"${h}`; }
function fmtLon(d){ const h=d>=0?'E':'W'; d=Math.abs(d); const deg=Math.floor(d); const m=Math.floor((d-deg)*60); const s=Math.round(((d-deg)*60-m)*60); return `${String(deg).padStart(3,'0')}°${String(m).padStart(2,'0')}'${String(s).padStart(2,'0')}"${h}`; }

function useHint() {
  const q = state.current;
  const hints = generateHints(q);
  if (state.hintsUsed >= hints.length) return;
  const row = document.getElementById('hint-row');
  const txt = row.querySelector('.hint-text');
  row.classList.remove('empty');
  txt.innerHTML = `<strong style="color:var(--amber)">[${state.hintsUsed + 1}/${hints.length}]</strong> ${hints[state.hintsUsed]}`;
  state.hintsUsed++;
  const btn = document.getElementById('btn-hint');
  if (state.hintsUsed >= hints.length) {
    btn.disabled = true;
    btn.textContent = 'NO MORE HINTS';
  } else {
    btn.textContent = `? HINT (${hints.length - state.hintsUsed} LEFT)`;
  }
}

function renderStats() {
  document.getElementById('stat-correct').textContent = state.correct;
  document.getElementById('stat-wrong').textContent = state.wrong;

}

function renderWeak() {
  const el = document.getElementById('weak-list');
  const items = Object.entries(state.mistakes)
    .filter(([_, n]) => n >= 3).sort((a,b) => b[1] - a[1]);
  if (!items.length) {
    el.innerHTML = '<span class="weak-empty">— no weak spots yet —</span>';
    return;
  }
  el.innerHTML = items.map(([id, n]) => `<span class="weak-item">${labelForId(id)} · ×${n}</span>`).join('');
}

function labelForId(id) {
  if (id.indexOf('AC_CMP_') === 0) return id.slice(7).replace('_', ' vs ');
  if (id.indexOf('CO_') === 0) return CO_LABEL[id] || id.slice(3);
  if (id.indexOf('AP_K') === 0) {
    const ap = AIRPORTS.find(a => a.icao === id.slice(6));
    return ap ? `${id.charAt(4) === 'I' ? ap.icao : ap.city}→mapa` : id;
  }
  if (id.indexOf('PX_') === 0) {
    const st = pxAll().find(x => x.p === id.slice(7));
    if (!st) return id;
    return id.indexOf('PX_C2S_') === 0 ? `${st.p}→${pxShort(st)}` : id.indexOf('PX_S2C_') === 0 ? `${pxShort(st)}→${st.p}` : `${st.p}→mapa`;
  }
  if (id.startsWith('AC_')) {
    const ac = AIRCRAFT.find(a => 'AC_' + a.icao === id);
    return ac ? ac.icao : id;
  }
  if (id.startsWith('AP_I2C_')) {
    const ic = id.slice(7);
    const ap = AIRPORTS.find(a => a.icao === ic);
    return ap ? `${ap.icao}→${ap.city}` : id;
  }
  if (id.startsWith('AP_C2I_')) {
    const ic = id.slice(7);
    const ap = AIRPORTS.find(a => a.icao === ic);
    return ap ? `${ap.city}→${ap.icao}` : id;
  }
  if (id.startsWith('CS_I2C_')) {
    const ic = id.slice(7);
    const cs = CALLSIGNS.find(c => c.icao === ic);
    return cs ? `${cs.icao}→${cs.call}` : id;
  }
  if (id.startsWith('CS_C2I_')) {
    const ic = id.slice(7);
    const cs = CALLSIGNS.find(c => c.icao === ic);
    return cs ? `"${cs.call}"→${cs.icao}` : id;
  }
  return id;
}

    if (ex) {
      h += br + lab('POČET OTÁZOK:') + [20, 30, 50].map(n => chip(F.exN===n, 'exn', n, n)).join('');
      h += br + lab('ČAS:') + [5, 10, 15].map(n => chip(F.exMin===n, 'exmin', n, n + ' minút')).join('');
    } else {
      h += br + lab('POČET OTÁZOK:') + [15, 25, 40].map(n => chip(F.dCount===n, 'dcount', n, n)).join('');
      const I = state.dailyInfo;
      if (I) h += br + lab('ZLOŽENIE:') + `<span class="ap-progress">na opakovanie ${I.due} · slabé miesta ${I.weak} · nová látka ${I.fresh}</span>`;
    }

    const on = (attr, fn) => el.querySelectorAll('[data-' + attr + ']').forEach(b => { b.onclick = () => { fn(b.dataset[attr]); startMode(state.mode); }; });

    on('exn', v => { F.exN = +v; }); on('exmin', v => { F.exMin = +v; }); on('dcount', v => { F.dCount = +v; });
  } else if (state.mode === 'coord') {
    const F = state.filters, m = F.coMode;
    const lab = (t) => `<span style="font-size:10px;letter-spacing:0.15em;color:var(--text-faint);align-self:center;margin:0 6px 0 0">${t}</span>`;
    const chip = (on, attr, val, txt) => `<button class="filter-chip ${on ? 'on' : ''}" data-${attr}="${val}">${txt}</button>`;
    const br = '<span class="filter-break"></span>';
    let h = lab('REŽIM:') + chip(m==='cop', 'comode', 'cop', 'BODY NA MAPE') + chip(m==='freq', 'comode', 'freq', 'FREKVENCIE') +
      chip(m==='vert', 'comode', 'vert', 'VERTIKÁLNE HRANICE') + chip(m==='level', 'comode', 'level', 'HLADINY NA BODOCH') +
      chip(m==='scen', 'comode', 'scen', 'SCENÁR') + chip(m==='fill', 'comode', 'fill', 'DOPLŇOVAČKA') + chip(m==='study', 'comode', 'study', 'ŠTÚDIUM');
    if (m !== 'study') h += br + lab('OBTIAŽNOSŤ:') +
      chip(F.coAns==='choice', 'coans', 'choice', m === 'fill' ? 'ĽAHKÁ (výber z ponuky)' : 'ĽAHKÁ (výber zo 6 možností)') +
      chip(F.coAns==='type', 'coans', 'type', 'HARDCORE (písanie)');
    if (m === 'fill') {
      h += br + lab('TABUĽKA:') + chip(F.coTable==='FREQ', 'cotable', 'FREQ', 'FREKVENCIE') +
        CO_TABLES.map(t => chip(F.coTable===t.id, 'cotable', t.id, t.id + ' ' + CO_NB[t.from].short.split(' ')[0] + ' → ' + CO_NB[t.to].short.split(' ')[0])).join('');
    } else {
      h += br + lab('SUSED:') + chip(F.coNb==='all', 'conb', 'all', 'VŠETCI') +
        (m === 'freq' || m === 'vert' ? chip(F.coNb==='BA', 'conb', 'BA', 'Bratislava') : '') +
        ['WA', 'LV', 'BU', 'WI', 'PR'].map(k => chip(F.coNb===k, 'conb', k, CO_NB[k].short)).join('');
    }
    if (m !== 'study' && m !== 'fill') {
      const weakN = (state.apAllIds || []).filter(id => state.mistakes[id] > 0).length;
      h += br + lab('OPAKOVANIE:') + chip(F.coWeak, 'coweak', '1', `LEN SLABÉ MIESTA (${weakN})`) +
        `<span class="ap-progress" id="ap-progress">${apProgressText()}</span>` + chip(false, 'coclear', '1', 'VYMAZAŤ POKROK');
      if (state.coNote) h += `<span class="ap-note">${state.coNote}</span>`;
    }
    el.innerHTML = h;
    const on = (attr, fn) => el.querySelectorAll('[data-' + attr + ']').forEach(b => { b.onclick = () => fn(b.dataset[attr]); });
    const go = () => startMode(state.mode);
    on('comode', v => { F.coMode = v; if (F.coNb === 'BA' && v !== 'freq' && v !== 'vert') F.coNb = 'all'; go(); });
    on('coans', v => { F.coAns = v; state.coFill = null; go(); });
    on('conb', v => { F.coNb = v; go(); });
    on('cotable', v => { F.coTable = v; state.coFill = null; go(); });
    on('coweak', () => { F.coWeak = !F.coWeak; go(); });
    on('coclear', () => { if (!confirm('Vymazať uložený pokrok a slabé miesta MOD 06?')) return; apClearProgress(apIsMod06); F.coWeak = false; go(); });
  } else if (state.mode === 'heading') {
    const F = state.filters;
    const lab = (t) => `<span style="font-size:10px;letter-spacing:0.15em;color:var(--text-faint);align-self:center;margin:0 6px 0 0">${t}</span>`;
    const chip = (on, attr, val, txt) => `<button class="filter-chip ${on ? 'on' : ''}" data-${attr}="${val}">${txt}</button>`;
    const br = '<span class="filter-break"></span>';
    const mv = F.hgMode === 'move';
    const cl = F.hgMode === 'calc';
    let h = lab('REŽIM:') + chip(F.hgMode==='static', 'hgmode', 'static', 'STATICKÝ') + chip(mv, 'hgmode', 'move', 'POHYBLIVÝ') + chip(cl, 'hgmode', 'calc', 'POČTY S KURZOM');
    h += br + lab('OBTIAŽNOSŤ:') + chip(F.hgDiff==='easy', 'hgdiff', 'easy', cl ? 'ĽAHKÁ (po 10°, s pravidlom)' : mv ? 'ĽAHKÁ (pomalšie, široká bránka)' : 'ĽAHKÁ (uzná aj o 5° vedľa)') +
      chip(F.hgDiff==='hard', 'hgdiff', 'hard', cl ? 'HARDCORE (po 5°, bez pravidla)' : mv ? 'HARDCORE (rýchlo, úzka bránka)' : 'HARDCORE (len presný kurz)');
    if (cl) h += br + lab('TYP ÚLOHY:') + chip(F.hcKind==='all', 'hckind', 'all', 'VŠETKY') + chip(F.hcKind==='recip', 'hckind', 'recip', 'OPAČNÝ KURZ') + chip(F.hcKind==='turn', 'hckind', 'turn', 'ZATÁČKA O X°') + chip(F.hcKind==='short', 'hckind', 'short', 'KRATŠIA ZATÁČKA');
    if (mv) {
      h += br + lab('CIEĽ:') + chip(F.hgKind==='gate', 'hgkind', 'gate', 'BRÁNKY') + chip(F.hgKind==='city', 'hgkind', 'city', 'MIESTA') + chip(F.hgKind==='fra', 'hgkind', 'fra', 'BODY FRA');
      if (F.hgKind !== 'gate') h += br + lab('NÁZVY NA MAPE:') + chip(F.hgNames==='on', 'hgnames', 'on', 'ZAPNUTÉ') + chip(F.hgNames==='off', 'hgnames', 'off', 'VYPNUTÉ (ťažšie)');
    }
    if (!cl) h += br + lab('RUŽICA:') + chip(F.hgRose==='off', 'hgrose', 'off', 'VYPNUTÁ') + chip(F.hgRose==='on', 'hgrose', 'on', 'ZAPNUTÁ (pomôcka)');
    el.innerHTML = h;
    ['hgmode', 'hgdiff', 'hgkind', 'hgnames', 'hgrose', 'hckind'].forEach(attr => {
      const key = { hckind: 'hcKind', hgmode: 'hgMode', hgdiff: 'hgDiff', hgkind: 'hgKind', hgnames: 'hgNames', hgrose: 'hgRose' }[attr];
      el.querySelectorAll('[data-' + attr + ']').forEach(b => { b.onclick = () => { F[key] = b.dataset[attr]; startMode(state.mode); }; });
    });
  }
  renderModeHelp();
  layoutFilters();
}

/* Filtre sa skladajú ako rad štítkov a tlačidiel; tu sa preskupia do
   tabuľky: v ľavom stĺpci názov riadku, v pravom jeho voľby. Presúvajú
   sa existujúce prvky, takže ich ovládanie ostáva funkčné. */
function layoutFilters() {
  const el = document.getElementById('filters');
  const nodes = Array.prototype.slice.call(el.children);
  const table = document.createElement('div');
  table.className = 'f-table';
  let help = null, opts = null;
  nodes.forEach(n => {
    if (n.classList.contains('mode-help')) { help = n; return; }
    if (n.classList.contains('filter-break')) return;
    const isLabel = n.tagName === 'SPAN' && !n.className && /:\s*$/.test(n.textContent);
    if (isLabel || !opts) {
      const row = document.createElement('div'); row.className = 'f-row';
      const lab = document.createElement('div'); lab.className = 'f-lab';
      lab.textContent = isLabel ? n.textContent.replace(/:\s*$/, '') : '';
      opts = document.createElement('div'); opts.className = 'f-opts';
      row.appendChild(lab); row.appendChild(opts); table.appendChild(row);
      if (isLabel) return;
    }
    opts.appendChild(n);
  });
  el.innerHTML = '';
  if (help) el.appendChild(help);
  if (table.children.length) el.appendChild(table);
}

    `;
    if (ap.region || ap.hint) extra = `<div class="reveal-ops"><strong>NOTE</strong>${ap.region ? ap.region + ' — ' : ''}${ap.hint || ''}</div>`;
    extra += icaoBreakdownHTML(ap);
  }

  if (q.type === 'callsign') {
    const cs = q.data;
    header = `
      <div class="reveal-title">${cs.icao} — "${cs.call}"</div>
      <div class="reveal-sub">${cs.airline
        ? `${cs.airline.toUpperCase()} <span style="color:var(--text-faint)">·</span> ${cs.country}${cs.type ? ' · ' + cs.type.toUpperCase() : ''}`

/* ============================================================
   SUBMIT FLOW
   ============================================================ */
function submitAnswer() {
  const input = document.getElementById('answer');
  if (!input || input.disabled) return;
  const val = input.value;
  if (!val.trim()) return;

  const q = state.current;
  /* q.exact: čísla (frekvencie, hladiny) sa neposudzujú s toleranciou preklepov */
  const ok = q.exact ? q.accept.some(a => normalize(a) === normalize(val)) : (matches(val, q.accept) && !callsignClash(val, q));
  const fb = document.getElementById('feedback');
  if (state.mode === 'exam' && state.exam) { examRecord(q, ok, val.toUpperCase()); return; }

  if (ok) {
    state.correct++;
    state.streak++;
    if (state.streak > state.bestStreak) state.bestStreak = state.streak;
  } else {
    state.wrong++;
    state.streak = 0;
    state.mistakes[q.id] = (state.mistakes[q.id] || 0) + 1;
  }
  renderStats();
  renderWeak();

  input.disabled = true;
  if (q.type === 'coord' || q.type === 'aircraft' || q.type === 'airport' || q.type === 'prefix' || q.type === 'callsign') apAfterAnswer(q, ok);
  const sb = document.getElementById('submit-btn');
  sb.disabled = true; sb.style.opacity = '0.4';
  const hb = document.getElementById('btn-hint'); if (hb) hb.disabled = true;

  let bannerText;
  if (ok) bannerText = `✓ <strong>CORRECT</strong>`;
  else bannerText = `✗ <strong>WRONG</strong> · YOUR ANSWER: <span class="answer">${val.toUpperCase()}</span>`;

  fb.className = 'feedback show ' + (ok ? 'ok' : 'no');
  fb.innerHTML = `
    <div class="feedback-banner">
      <span>${bannerText}</span>
      <button class="btn" id="next-btn">NEXT ▶</button>
    </div>
    ${renderReveal(q)}
  `;

  setTimeout(() => {
    const nb = document.getElementById('next-btn');
    if (nb) { nb.focus(); nb.onclick = nextQuestion; }
    document.addEventListener('keydown', onEnterNext, { once: true });
  }, 50);
}

function onEnterNext(e) {
  if (e.key === 'Enter') { e.preventDefault(); nextQuestion(); }
}

function nextQuestion() {
  state.index++;
  state.current = state.queue[state.index] || null;
  renderQuestion();
}

function startMode(mode) {
  examStop();
  if (typeof hgStop === 'function') hgStop();   // hra z MOD 05 nesmie bežať na pozadí
  state.mode = mode;
  state.queue = buildQueue();
  state.index = 0;
  state.total = state.queue.length;
  state.correct = 0; state.wrong = 0;
  state.streak = 0; state.bestStreak = 0;
  state.current = state.queue[0] || null;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.mode === mode);
  });
  renderFilters();
  renderStats();
  renderQuestion();
}

/* CLOCK */
function tickClock() {
  const d = new Date();
  const h = String(d.getUTCHours()).padStart(2,'0');
  const m = String(d.getUTCMinutes()).padStart(2,'0');
  const s = String(d.getUTCSeconds()).padStart(2,'0');
  document.getElementById('clock').textContent = `${h}:${m}:${s} UTC`;
}
setInterval(tickClock, 1000); tickClock();

document.querySelectorAll('.tab').forEach(t => { t.onclick = () => startMode(t.dataset.mode); });
document.getElementById('btn-skip').onclick = () => {
  if (state.mode === 'exam') { if (state.exam && state.current) examRecord(state.current, false, '— preskočené —'); return; }
  if (state.mode === 'heading' && state.filters.hgMode === 'static') { hsRender(document.getElementById('qcard')); return; }
  if (state.mode === 'heading' && state.filters.hgMode === 'calc') { hcRender(document.getElementById('qcard')); return; }
  if (state.mode === 'heading') { hgNewTarget(); hgMsg('Cieľ preskočený — nový je na mape.', 'hint'); document.getElementById('hg-in').focus(); return; }
  if (state.mode === 'airport' && state.filters.apMode === 'study') return;
  if (state.mode === 'callsign' && state.filters.csMode === 'list') return;
  if (state.mode === 'coord' && (state.filters.coMode === 'fill' || state.filters.coMode === 'study')) return;
  if (state.mode === 'waypoint' && (state.filters.wpMode === 'study' || state.filters.wpMode === 'blind')) return; // no skipping in study / blind map
  if (!state.current) return;
  state.mistakes[state.current.id] = (state.mistakes[state.current.id] || 0) + 1;
  state.streak = 0;
  renderStats(); renderWeak();
  nextQuestion();
};
document.getElementById('btn-reset').onclick = () => startMode(state.mode);

/* ============================================================
   POZADIE — rozmazaný radar
   Otáčajúci sa lúč, kruhy dosahu a ciele, ktoré sa pomaly hýbu a
   rozsvietia sa, keď cez ne lúč prejde. Kreslí sa v polovičnom
   rozlíšení a CSS ho rozmaže, takže nezaťažuje a neruší text.
   Pri vypnutých animáciách v systéme sa nakreslí len jeden obraz.
   ============================================================ */
(function radarBackground() {
  const c = document.createElement('canvas');
  c.id = 'radar-bg';
  document.body.insertBefore(c, document.body.firstChild);
  const g = c.getContext('2d');
  if (!g) return;
  const still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, cx = 0, cy = 0, R = 0, ang = 0, last = 0;
  const TAU = Math.PI * 2, blips = [];
  function spawn(b) {
    const a = Math.random() * TAU, r = R * (0.12 + Math.random() * 0.82);
    b.x = cx + Math.cos(a) * r; b.y = cy + Math.sin(a) * r;
    b.h = Math.random() * TAU; b.v = 3 + Math.random() * 6; b.lit = Math.random() * 0.6; b.tr = []; b.acc = 0;
    return b;
  }
  function size() {
    W = c.width = Math.max(320, Math.ceil(window.innerWidth / 2));
    H = c.height = Math.max(240, Math.ceil(window.innerHeight / 2));
    cx = W * 0.5; cy = H * 0.52; R = Math.hypot(W, H) * 0.58;
    if (!blips.length) for (let i = 0; i < 16; i++) blips.push(spawn({}));
  }
  function draw(dt) {
    const bg = g.createRadialGradient(cx, cy, 0, cx, cy, R);
    bg.addColorStop(0, '#0d2a20'); bg.addColorStop(0.6, '#081a14'); bg.addColorStop(1, '#040d0a');
    g.fillStyle = bg; g.fillRect(0, 0, W, H);
    /* kruhy dosahu a osi */
    g.lineWidth = 1;
    for (let i = 1; i <= 6; i++) {
      g.strokeStyle = 'rgba(90,220,160,' + (i % 2 ? 0.10 : 0.16) + ')';
      g.beginPath(); g.arc(cx, cy, R * i / 6, 0, TAU); g.stroke();
    }
    g.strokeStyle = 'rgba(90,220,160,0.08)';
    for (let k = 0; k < 6; k++) {
      const a = k * Math.PI / 6;
      g.beginPath(); g.moveTo(cx - Math.cos(a) * R, cy - Math.sin(a) * R); g.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R); g.stroke();
    }
    /* lúč: žiara, ktorá sa ťahá za čelom lúča */
    if (g.createConicGradient) {
      const sw = g.createConicGradient(ang, cx, cy);
      sw.addColorStop(0, 'rgba(70,235,160,0)'); sw.addColorStop(0.78, 'rgba(70,235,160,0)');
      sw.addColorStop(0.97, 'rgba(70,235,160,0.20)'); sw.addColorStop(1, 'rgba(150,255,205,0.42)');
      g.fillStyle = sw; g.beginPath(); g.arc(cx, cy, R, 0, TAU); g.fill();
    }
    g.strokeStyle = 'rgba(170,255,215,0.55)'; g.lineWidth = 1.4;
    g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + Math.cos(ang) * R, cy + Math.sin(ang) * R); g.stroke();
    /* ciele */
    blips.forEach(b => {
      b.x += Math.cos(b.h) * b.v * dt; b.y += Math.sin(b.h) * b.v * dt;
      b.acc += dt;
      if (b.acc > 1.1) { b.acc = 0; b.tr.push([b.x, b.y]); if (b.tr.length > 5) b.tr.shift(); }
      const d = Math.hypot(b.x - cx, b.y - cy);
      if (d > R * 1.02) { spawn(b); return; }
      /* lúč práve prešiel cez cieľ → rozsvieti sa a pomaly hasne */
      const ba = (Math.atan2(b.y - cy, b.x - cx) + TAU) % TAU;
      const diff = (ang - ba + TAU) % TAU;
      if (diff < 0.09) b.lit = 1;
      b.lit = Math.max(0.12, b.lit - dt * 0.24);
      b.tr.forEach((p, i) => { g.fillStyle = 'rgba(120,255,190,' + (b.lit * 0.25 * (i + 1) / b.tr.length) + ')'; g.fillRect(p[0] - 1, p[1] - 1, 2, 2); });
      g.fillStyle = 'rgba(190,255,225,' + b.lit + ')';
      g.fillRect(b.x - 2, b.y - 2, 4, 4);
      g.strokeStyle = 'rgba(150,255,205,' + (b.lit * 0.55) + ')'; g.lineWidth = 1;
      g.beginPath(); g.moveTo(b.x, b.y); g.lineTo(b.x + Math.cos(b.h) * 9, b.y + Math.sin(b.h) * 9); g.stroke();
    });
  }
  function frame(ts) {
    const dt = last ? Math.min(0.06, (ts - last) / 1000) : 0;
    last = ts;
    ang = (ang + dt * 0.75) % TAU;
    draw(dt);
    if (!still) requestAnimationFrame(frame);
  }
  size();
  window.addEventListener('resize', () => { size(); if (still) draw(0); });
  if (still) { ang = 0.9; draw(0); } else requestAnimationFrame(frame);
  /* keď je karta skrytá, prehliadač slučku sám pozastaví — nakresli aspoň prvý obraz */
  draw(0);
})();

apLoadProgress();
renderWeak();
startMode('home');
</script>
